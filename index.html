<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بنك أسئلة الأكثر تكراراً - أحمد فتحي أبوجبل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Tajawal',sans-serif;background:#0f172a;color:#e2e8f0;overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100dvh}
.container{flex:1;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;padding:6px}

/* Lock screen */
.lock-overlay{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock-box{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:32px 24px;max-width:360px;width:100%}
.lock-title{font-size:1.6rem;font-weight:800;color:#38bdf8;margin-bottom:6px}
.lock-teacher{font-size:1.15rem;color:#94a3b8;margin-bottom:22px}
.lock-input{width:100%;padding:14px;border-radius:10px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-size:1.3rem;text-align:center;font-family:'Tajawal',sans-serif;letter-spacing:4px}
.lock-input:focus{outline:none;border-color:#38bdf8}
.lock-btn{width:100%;margin-top:14px;background:#0ea5e9;color:#0f172a;font-size:1.2rem;font-weight:700;padding:13px;border:none;border-radius:10px;cursor:pointer}
.lock-btn:hover{background:#38bdf8}
.lock-error{color:#fca5a5;margin-top:10px;font-size:1rem;display:none}
.app-footer{text-align:center;color:#64748b;font-size:0.95rem;padding:14px 0 6px}

/* Home menu */
.home-header{text-align:center;padding:18px 6px 8px}
.home-title{font-size:1.7rem;font-weight:800;color:#38bdf8;margin-bottom:6px}
.home-sub{color:#94a3b8;font-size:1rem}
.set-grid{display:flex;flex-direction:column;gap:14px;padding:12px 4px}
.set-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px}
.set-name{font-size:1.3rem;font-weight:800;color:#f1f5f9;margin-bottom:2px}
.set-count{color:#94a3b8;font-size:0.95rem;margin-bottom:12px}
.set-btns{display:flex;gap:10px}
.set-btn{flex:1;padding:12px;border-radius:10px;border:none;font-family:'Tajawal',sans-serif;font-weight:700;font-size:1.05rem;cursor:pointer}
.btn-quiz{background:#0ea5e9;color:#0f172a}
.btn-quiz:hover{background:#38bdf8}
.btn-key{background:#334155;color:#e2e8f0;border:1px solid #475569}
.btn-key:hover{background:#475569}

.topbar{display:flex;align-items:center;gap:10px;padding:6px 4px 10px}
.back-btn{background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:10px;padding:8px 16px;font-family:'Tajawal',sans-serif;font-weight:700;cursor:pointer;font-size:0.95rem}
.back-btn:hover{background:#475569}
.topbar-title{font-weight:800;color:#38bdf8;font-size:1.1rem}

/* Quiz card styles (shared) */
.progress-box{background:#1e293b;border-radius:10px;padding:6px 12px;margin-bottom:6px;border:1px solid #334155;flex-shrink:0}
.progress-bar{height:8px;background:#334155;border-radius:4px;overflow:hidden;margin:5px 0 2px}
.progress-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#22d3ee);width:0%;transition:width .3s;border-radius:4px}
.progress-text{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;color:#38bdf8}
.card{background:#1e293b;border-radius:12px;padding:12px;border:1px solid #334155;display:none;flex:1;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card.active{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.q-num{display:inline-block;background:#0ea5e9;color:#0f172a;font-weight:700;padding:3px 12px;border-radius:14px;font-size:1rem;margin-bottom:8px;align-self:flex-start}
.page-src{display:inline-block;background:#334155;color:#94a3b8;font-weight:700;padding:3px 10px;border-radius:10px;font-size:0.85rem;margin-bottom:8px;margin-right:6px;align-self:flex-start;border:1px solid #475569}
.q-text{font-size:1.55rem;font-weight:700;margin-bottom:14px;color:#f1f5f9;line-height:1.75}
.options{display:grid;gap:9px;margin-bottom:10px}
.option{background:#0f172a;border:2px solid #334155;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;font-size:1.4rem;font-weight:500;display:flex;align-items:center;gap:10px}
.option:hover:not(.disabled){border-color:#38bdf8;background:#1e293b}
.option.selected{border-color:#38bdf8;background:#0c4a6e}
.option.correct{border-color:#22c55e;background:#14532d}
.option.wrong{border-color:#ef4444;background:#7f1d1d}
.option.disabled{pointer-events:none}
.letter{font-weight:800;color:#38bdf8;min-width:28px;font-size:1.45rem}
.feedback{margin-top:10px;padding:16px;border-radius:12px;font-size:1.5rem;font-weight:600;display:none;line-height:1.7;flex-shrink:0}
.feedback.show{display:block;animation:fade .3s}
.feedback.correct{background:#14532d;border:2px solid #22c55e;color:#bbf7d0}
.feedback.wrong{background:#7f1d1d;border:2px solid #ef4444;color:#fecaca}
.feedback strong{color:#fef08a;font-size:1.6rem;font-weight:800}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;flex-shrink:0}
button.nav-btn{font-family:'Tajawal',sans-serif;font-size:1.2rem;font-weight:700;padding:13px 22px;border:none;border-radius:12px;cursor:pointer;transition:.15s;min-width:110px}
.btn-next,.btn-prev{background:#0ea5e9;color:#0f172a}
.btn-next:hover,.btn-prev:hover{background:#38bdf8}
.btn-next:disabled,.btn-prev:disabled{background:#475569;color:#94a3b8;cursor:not-allowed}
.result{background:#1e293b;border-radius:14px;padding:30px 16px;text-align:center;border:1px solid #334155;display:none;flex:1;flex-direction:column;justify-content:center;align-items:center}
.result.show{display:flex;animation:fade .4s}
.score{font-size:4rem;font-weight:800;color:#22d3ee;margin:12px 0}
.restart{background:#22c55e;color:#052e16;margin-top:20px;padding:14px 40px;font-size:1.3rem;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-weight:700;cursor:pointer}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;font-size:0.95em;line-height:1.1}
.frac .top{border-bottom:2px solid #38bdf8;padding:0 6px 2px 6px;width:100%;text-align:center}
.frac .bottom{padding:2px 6px 0 6px;width:100%;text-align:center}
sup{font-size:0.75em;vertical-align:super;line-height:0}

@media(max-width:400px){.q-text{font-size:1.3rem}.option{font-size:1.2rem;padding:12px}.feedback{font-size:1.3rem}.feedback strong{font-size:1.4rem}button.nav-btn{font-size:1.05rem;min-width:90px}}
@media(min-width:600px){.q-text{font-size:1.7rem}.option{font-size:1.55rem}.feedback{font-size:1.7rem}.feedback strong{font-size:1.8rem}}
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-box">
    <div class="lock-title">🔒 محمي بكلمة مرور</div>
    <div class="lock-teacher">الأستاذ: أحمد فتحي أبوجبل</div>
    <input type="password" id="lockInput" class="lock-input" placeholder="أدخل كلمة المرور" inputmode="numeric">
    <button class="lock-btn" onclick="checkLockPassword()">دخول</button>
    <div class="lock-error" id="lockError">كلمة المرور غير صحيحة</div>
  </div>
</div>

<div class="container" id="appContainer" style="display:none">
  <div id="homeView">
    <div class="home-header">
      <div class="home-title">بنك أسئلة الأكثر تكراراً</div>
      <div class="home-sub">٤٢٧ سؤالاً حرفياً - اختر مجموعة</div>
    </div>
    <div class="set-grid" id="setGrid"></div>
  </div>

  <div id="quizView" style="display:none;flex:1;flex-direction:column">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">→ الرئيسية</button>
      <span class="topbar-title" id="topbarTitle"></span>
    </div>
    <div class="progress-box" id="progressBox">
      <div class="progress-text">
        <span id="progLabel"></span>
        <span id="scoreLabel"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>
    <div id="quiz" style="flex:1;display:flex;flex-direction:column;"></div>
    <div class="result" id="resultBox">
      <h2 style="color:#38bdf8;font-size:1.8rem;">انتهى الاختبار</h2>
      <div class="score" id="finalScore">٠٠</div>
      <div style="color:#94a3b8;font-size:1.3rem;" id="totalLabel"></div>
      <p id="msg" style="margin-top:10px;color:#94a3b8;font-size:1.25rem;"></p>
      <button class="restart" onclick="restartCurrentSet()">إعادة الاختبار</button>
    </div>
  </div>

  <div class="app-footer">إعداد: الأستاذ أحمد فتحي أبوجبل</div>
</div>

<script>
const toInd=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

const SETS=[
{id:"set1",label:"المجموعة الأولى",questions:[
{page:2,q:"لدى سلمى أخت أكبر منها بـ ٨ سنوات وأخت أصغر منها بسنتين، وحاصل ضرب أعمار أخواتها = ٥٦ فكم عمر سلمى؟",opts:["٨","٩","٦","٤"],ans:2,exp:"نفرض عمر سلمى = س. عمر الأخت الكبرى = س+٨، وعمر الأخت الصغرى = س-٢. حاصل ضرب عمريهما = ٥٦: (س+٨)(س-٢)=٥٦. بالتجربة عند س=٦: (٦+٨)(٦-٢)=١٤×٤=٥٦ ✓. إذن عمر سلمى = ٦. الإجابة ج"},
{page:3,q:"متتابعة حسابية فيها س = ١٣، وكل حد يزيد عن السابق بـ ٣. ما مقدار مجموع س والحدود الثلاثة السابقة له؟",opts:["٣٢","٣٣","٣٤","٣٥"],ans:2,exp:"بما أن كل حد يزيد عن سابقه بمقدار ٣، فإن الحدود السابقة لـ ١٣ نحصل عليها بطرح ٣ تباعاً: ١٣-٣=١٠، ١٠-٣=٧، ٧-٣=٤. المجموع = ١٣+١٠+٧+٤ = ٣٤. الإجابة ج"},
{page:6,q:"قارن بين:<br>القيمة الأولى: <bdi dir='ltr'>٩ − ٠٫٠٠٤</bdi><br>القيمة الثانية: <bdi dir='ltr'>٩ − ٠٫٠٤٤</bdi>",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"نحسب كل قيمة على حدة: القيمة الأولى = ٩ − ٠٫٠٠٤ = ٨٫٩٩٦. القيمة الثانية = ٩ − ٠٫٠٤٤ = ٨٫٩٥٦. بما أن المطروح في الحالة الأولى أصغر، يكون الناتج أكبر: ٨٫٩٩٦ > ٨٫٩٥٦. القيمة الأولى أكبر. الإجابة أ"},
{page:8,q:"قارن بين:<br>القيمة الأولى: <bdi dir='ltr'>(٠٫١)<sup>٢</sup></bdi><br>القيمة الثانية: <bdi dir='ltr'>(٠٫١)<sup>٣</sup></bdi>",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"(٠٫١)<sup>٢</sup> = ٠٫١×٠٫١ = ٠٫٠١. (٠٫١)<sup>٣</sup> = ٠٫١×٠٫١×٠٫١ = ٠٫٠٠١. عند رفع عدد بين الصفر والواحد لأس أكبر تقل قيمته، لذا ٠٫٠١ أكبر من ٠٫٠٠١. القيمة الأولى أكبر. الإجابة أ"},
{page:10,q:"عدد إذا أضفنا إلى نصفه ١٣ أصبح ٢٣، فما هو هذا العدد؟",opts:["١٥","٢٠","١٨","٣٠"],ans:1,exp:"نفرض العدد = س. المعادلة: <span class='frac'><span class='top'>س</span><span class='bottom'>٢</span></span> + ١٣ = ٢٣ ← <span class='frac'><span class='top'>س</span><span class='bottom'>٢</span></span> = ١٠ ← س = ٢٠. تحقق: نصف ٢٠ = ١٠، و١٠+١٣=٢٣ ✓. الإجابة ب"},
{page:11,q:"أوجد قيمة س: ٧ = <span class='frac'><span class='top'>٧</span><span class='bottom'>(٣ − س)</span></span>",opts:["١","٢","٣","٤"],ans:1,exp:"بضرب الطرفين في (٣-س): ٧×(٣-س) = ٧ ← ٣-س = ١ ← س = ٣-١ = ٢. تحقق: <span class='frac'><span class='top'>٧</span><span class='bottom'>٣-٢</span></span> = <span class='frac'><span class='top'>٧</span><span class='bottom'>١</span></span> = ٧ ✓. الإجابة ب"},
{page:13,q:"قيمة ١٠ قطع فضية وقطعة ذهبية = قيمة ٣ قطع ذهبية. قارن قيمة قطعة ذهبية مع قيمة ٥ قطع فضية",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:2,exp:"من المعطى: ١٠ف + ذ = ٣ذ. بطرح ذ من الطرفين: ١٠ف = ٢ذ. بالقسمة على ٢: ذ = ٥ف. إذن قيمة القطعة الذهبية تساوي تماماً قيمة ٥ قطع فضية، فالقيمتان متساويتان. الإجابة ج"},
{page:14,q:"عمر هند بعد ٩ سنوات = مثلي عمرها قبل ٣ سنوات، فكم عمرها الآن؟",opts:["١٥","١٢","٩","٣"],ans:0,exp:"نفرض عمر هند الآن = س. عمرها بعد ٩ سنوات = س+٩، وعمرها قبل ٣ سنوات = س-٣. المعادلة: س+٩ = ٢(س-٣) = ٢س-٦. بترتيب الحدود: ٩+٦ = ٢س-س ← س=١٥. تحقق: بعد ٩ سنوات = ٢٤، وقبل ٣ سنوات = ١٢، و٢٤=٢×١٢ ✓. الإجابة أ"},
{page:15,q:"قارن بين: <span class='frac'><span class='top'>٠٫٣</span><span class='bottom'>٠٫٠٣</span></span> + <span class='frac'><span class='top'>٠٫٣</span><span class='bottom'>٠٫٣</span></span> و <bdi dir='ltr'>١٠٫٢</bdi>",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"نحسب الطرف الأول: <span class='frac'><span class='top'>٠٫٣</span><span class='bottom'>٠٫٠٣</span></span> + <span class='frac'><span class='top'>٠٫٣</span><span class='bottom'>٠٫٣</span></span> = ١٠ + ١ = ١١. الطرف الثاني = ١٠٫٢. بما أن ١١ أكبر من ١٠٫٢، فالقيمة الأولى أكبر. الإجابة أ"},
{page:17,q:"طالب أعار ٦ كتب واستعار ٤ فأصبح معه ٢٨، كم كان معه؟",opts:["٢٤","٣٠","٣٢","٣٦"],ans:1,exp:"نفرض عدد الكتب الأصلي = س. بعد إعارة ٦ كتب يتبقى س-٦، ثم بعد استعارة ٤ كتب يصبح س-٦+٤. المعادلة: س-٦+٤=٢٨ ← س-٢=٢٨ ← س=٣٠. تحقق: ٣٠-٦=٢٤، ٢٤+٤=٢٨ ✓. الإجابة ب"},
{page:18,q:"إذا كان ٢<sup>ن</sup> + ٢<sup>ن</sup> + ٢<sup>ن</sup> + ٢<sup>ن</sup> = ٢<sup>٨</sup> فما قيمة ن؟",opts:["٢","٤","٦","٨"],ans:2,exp:"العبارة ٢<sup>ن</sup>+٢<sup>ن</sup>+٢<sup>ن</sup>+٢<sup>ن</sup> تمثل أربعة حدود متساوية، فمجموعها = ٤×٢<sup>ن</sup> = ٢<sup>٢</sup>×٢<sup>ن</sup> = ٢<sup>ن+٢</sup>. بمساواتها بـ ٢<sup>٨</sup>: ن+٢=٨ ← ن=٦. الإجابة ج"},
{page:20,q:"مستطيل طوله ٥ <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span> وعرضه ٢ <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>، مساحته؟",opts:["١٢","١٢٫٥","١١","١١٫٥"],ans:0,exp:"نحول الأعداد الكسرية إلى كسور غير حقيقية: ٥ <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span> = <span class='frac'><span class='top'>١٦</span><span class='bottom'>٣</span></span>، و٢ <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span> = <span class='frac'><span class='top'>٩</span><span class='bottom'>٤</span></span>. المساحة = الطول×العرض = (<span class='frac'><span class='top'>١٦</span><span class='bottom'>٣</span></span>)×(<span class='frac'><span class='top'>٩</span><span class='bottom'>٤</span></span>) = <span class='frac'><span class='top'>١٤٤</span><span class='bottom'>١٢</span></span> = ١٢. الإجابة أ"},
{page:23,q:"موقف ٤٣٢ سيارة مقسم إلى ٦ أجزاء، كل جزء ٧٢ سيارة حسب الألوان، ما لون السيارة رقم ٣٦٠؟",opts:["أبيض","أسود","أزرق","أصفر"],ans:1,exp:"عدد السيارات في كل جزء = ٤٣٢÷٦ = ٧٢ سيارة. السيارة رقم ٣٦٠ تقع في نهاية الجزء رقم ٣٦٠÷٧٢=٥، أي آخر سيارة في الجزء الخامس، وحسب ترتيب الألوان في السؤال يكون لونها أسود. الإجابة ب"},
{page:25,q:"قارن ١٢٥٪ من ٣٥ مع ٣٥٪ من ١٢٥",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:2,exp:"١٢٥٪ من ٣٥ = ١٫٢٥×٣٥ = ٤٣٫٧٥. ٣٥٪ من ١٢٥ = ٠٫٣٥×١٢٥ = ٤٣٫٧٥. القيمتان متساويتان لأن الضرب تبادلي: (<span class='frac'><span class='top'>١٢٥</span><span class='bottom'>١٠٠</span></span>)×٣٥ = (<span class='frac'><span class='top'>٣٥</span><span class='bottom'>١٠٠</span></span>)×١٢٥. الإجابة ج"},
{page:26,q:"قارن <span class='frac'><span class='top'>١١</span><span class='bottom'>١١١</span></span> مع <bdi dir='ltr'>٠٫١</bdi>",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:1,exp:"بقسمة ١١ على ١١١ نحصل تقريباً على ٠٫٠٩٩. بمقارنتها مع ٠٫١ نجد أن ٠٫٠٩٩ أصغر من ٠٫١. إذن القيمة الثانية أكبر. الإجابة ب"},
{page:27,q:"اشترى ١٠٠ سهم بـ ٦٠٠٠٠ ونقص السهم ٢٠٠، نسبة الخسارة؟",opts:["<span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>"],ans:3,exp:"سعر السهم الواحد عند الشراء = ٦٠٠٠٠÷١٠٠ = ٦٠٠ ريال. مقدار النقص لكل سهم = ٢٠٠ ريال. نسبة الخسارة = النقص÷السعر الأصلي = <span class='frac'><span class='top'>٢٠٠</span><span class='bottom'>٦٠٠</span></span> = <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>. الإجابة د"},
{page:33,q:"وزعت ٦٤ طابعة و٤٨ حاسبة بالتساوي، ما أكبر عدد يمكن وضعه في كل غرفة؟",opts:["٨","١٢","١٦","٢٤"],ans:2,exp:"نريد أكبر عدد يوزَّع به كل من ٦٤ و٤٨ بالتساوي دون باقٍ، وهذا هو القاسم المشترك الأكبر لهما. بتحليلهما: ٦٤=٢<sup>٦</sup>، ٤٨=٢<sup>٤</sup>×٣. القاسم المشترك الأكبر = ٢<sup>٤</sup> = ١٦. الإجابة ج"},
{page:35,q:"سيارة قطعت نصف ١٦٠ كلم في ٤٠ دقيقة، ما سرعتها الابتدائية؟",opts:["٦٠","٩٠","١٢٠","١٤٠"],ans:2,exp:"نصف المسافة = <span class='frac'><span class='top'>١٦٠</span><span class='bottom'>٢</span></span> = ٨٠ كم. الزمن = ٤٠ دقيقة = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span> ساعة. السرعة = المسافة÷الزمن = ٨٠÷(<span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>) = ٨٠×<span class='frac'><span class='top'>٣</span><span class='bottom'>٢</span></span> = ١٢٠ كم/س. الإجابة ج"},
{page:37,q:"اشترى ١٢ قلماً و٨ دفاتر، كم حزمة دفاتر يجب أن يشتري ليستوي العدد؟",opts:["٣","٤","٥","٦"],ans:0,exp:"حتى يتساوى عدد الدفاتر مع الأقلام عند التوزيع، نحتاج عدداً من الدفاتر يكون مضاعفاً مشتركاً مع ١٢. أصغر مضاعف مشترك لـ١٢ و٨ هو ٢٤. وبما أن كل حزمة تحوي ٨ دفاتر، فعدد الحزم اللازم = ٢٤÷٨ = ٣. الإجابة أ"},
{page:46,q:"أوجد قيمة <span class='frac'><span class='top'>(٢٠١٥ - ١٤٣٧)</span><span class='bottom'>(١٤٣٧ + ٢٠١٥)</span></span> − نفس المقدار",opts:["٠","٢","−١","−٢٢٩٢"],ans:0,exp:"المقدار الثاني مطابق تماماً للمقدار الأول (نفس القيمة بالضبط)، وطرح أي عدد من نفسه يساوي دائماً صفراً بصرف النظر عن قيمته الفعلية. الإجابة أ"},
{page:39,q:"ثلاثة أبناء يزورون كل ٣ و٥ و٦ أيام، كم مرة يلتقون في ٦٠ يوماً؟",opts:["١","٢","٣","٤"],ans:1,exp:"أصغر مضاعف مشترك للأعداد ٣، ٥، ٦ هو ٣٠ (لأنه يقبل القسمة على الثلاثة معاً دون باقٍ). خلال ٦٠ يوماً، عدد مرات الالتقاء = ٦٠÷٣٠ = ٢ مرة. الإجابة ب"},
{page:43,q:"صندوق يسع ٩ بيضات، ١٢٠ بيضة تحتاج كم صندوقاً؟",opts:["٢١","١٤","١٩","١١"],ans:1,exp:"١٢٠÷٩ ≈ ١٣٫٣، أي أن ١٣ صندوقاً تسع ١٣×٩=١١٧ بيضة فقط ويتبقى ٣ بيضات تحتاج صندوقاً إضافياً، فيصبح الإجمالي ١٤ صندوقاً. الإجابة ب"},
{page:45,q:"قطعة خشب ٢٤م تُقطع إلى ٢٤ قطعة، كم مرة تُقطع؟",opts:["٢٤","٢٥","٢٣","٢٢"],ans:2,exp:"عند قطع قطعة مستقيمة إلى ن قطعة، يكون عدد مرات القطع اللازمة = ن-١ (لأن كل عملية قطع تزيد عدد القطع بمقدار واحد). هنا ن=٢٤، فعدد مرات القطع = ٢٤-١ = ٢٣. الإجابة ج"},
{page:49,q:"أوجد قيمة <span class='frac'><span class='top'>(٥<sup>٧</sup> + ٥<sup>٨</sup>)</span><span class='bottom'>٥<sup>٧</sup></span></span>",opts:["١٠","١٢","٢٦","٦"],ans:3,exp:"نُخرج العامل المشترك ٥<sup>٧</sup> من البسط: ٥<sup>٧</sup>+٥<sup>٨</sup> = ٥<sup>٧</sup>(١+٥) = ٥<sup>٧</sup>×٦. بالقسمة على المقام ٥<sup>٧</sup> يُختصر العامل المشترك ويتبقى ٦. الإجابة د"},
{page:51,q:"ما عدد المئات في ٧٩٦٣٥؟",opts:["٧٩٦","٩٦","٦٣","٦"],ans:0,exp:"عدد المئات الكاملة في عدد يُحسب بحذف رقمي الآحاد والعشرات: من ٧٩٦٣٥ نحذف «٣٥» فيتبقى ٧٩٦. الإجابة أ"},
{page:52,q:"أوجد الحد التالي: ٣، ٥، ٩، ١٧، ٣٣، ...",opts:["٦٠","٦٢","٦٣","٦٥"],ans:3,exp:"نلاحظ أن كل حد يساوي ضعف الحد السابق ناقص واحد: ٣×٢-١=٥، ٥×٢-١=٩، ٩×٢-١=١٧، ١٧×٢-١=٣٣. بتطبيق نفس القاعدة: ٣٣×٢-١ = ٦٥. الإجابة د"},
{page:61,q:"قارن ٦<sup>٠</sup> مع ٨<sup>٠</sup>",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:2,exp:"أي عدد غير صفري مرفوع للأس صفر يساوي ١ دائماً بصرف النظر عن قيمة الأساس. لذا ٦<sup>٠</sup> = ٨<sup>٠</sup> = ١، والقيمتان متساويتان. الإجابة ج"},
{page:62,q:"نسبة الأجر ٦:٥ والفرق ٢٠٠، كم الإجمالي؟",opts:["١١٠٠","٣١٠٠","٢٠٠٠","٢٢٠٠"],ans:3,exp:"النسبة ٦:٥ تعني أن الفرق بين طرفيها بوحدات النسبة = ٦-٥ = ١ وحدة، وهذه الوحدة تساوي الفرق الفعلي ٢٠٠. الإجمالي = مجموع وحدتي النسبة × قيمة الوحدة = (٦+٥)×٢٠٠ = ١١×٢٠٠ = ٢٢٠٠. الإجابة د"},
{page:65,q:"٢<sup>١٣</sup> = ٢<sup>١٢</sup> × س، قيمة س؟",opts:["٢<sup>٠</sup>","٢<sup>١</sup>","٢<sup>٢</sup>","٢<sup>٤</sup>"],ans:1,exp:"بقسمة الطرفين على ٢<sup>١٢</sup>: س = ٢<sup>١٣</sup>÷٢<sup>١٢</sup> = ٢<sup>١٣-١٢</sup> = ٢<sup>١</sup>. الإجابة ب"},
{page:71,q:"أكبر عدد أولي بين ٥٠ و٦٤ مقارنة بـ ٦٣",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:1,exp:"الأعداد الأولية الواقعة بين ٥٠ و٦٤ هي: ٥٣، ٥٩، ٦١. أكبرها هو ٦١. بمقارنته بـ٦٣ نجد أن ٦١ أصغر من ٦٣، فالقيمة الثانية أكبر. الإجابة ب"},
{page:78,q:"كم عدد المئات في ٩٩٨٦٠؟",opts:["٩٩٨٠٠","٩٩٨","٩٩٩٠٠","٩٩٩"],ans:1,exp:"بحذف رقمي الآحاد والعشرات «٦٠» من العدد ٩٩٨٦٠ يتبقى ٩٩٨، وهو عدد المئات الكاملة فيه. الإجابة ب"},
{page:80,q:"أوجد الحد التالي: ٢، ٣، ٥، ٨، ١٢، ...",opts:["١٢","١٧","١٩","١٠"],ans:1,exp:"الفروق بين الحدود المتتالية تتزايد بمقدار واحد في كل مرة: ٣-٢=١، ٥-٣=٢، ٨-٥=٣، ١٢-٨=٤. فالفرق التالي = ٥، والحد التالي = ١٢+٥ = ١٧. الإجابة ب"},
{page:81,q:"متوسط الأعداد: ن، ن+٢، ن+١٠؟",opts:["٣ن+٤","ن+١٢","ن+٥","ن+٤"],ans:3,exp:"المتوسط الحسابي = مجموع الأعداد ÷ عددها = (ن + (ن+٢) + (ن+١٠))÷٣ = (٣ن+١٢)÷٣ = ن+٤. الإجابة د"},
{page:82,q:"عدد الأعداد من ١ إلى ٤٠ التي تحتوي على الرقم ٢ أو ٣؟",opts:["٢٠","٢٢","٢٤","٢٦"],ans:2,exp:"عدد الأعداد المحتوية على الرقم ٢ بين ١ و٤٠ يساوي ١٣ عدداً، وعدد المحتوية على الرقم ٣ يساوي ١٣ عدداً أيضاً. بما أن عددين منها (٢٣، ٣٢) يحتويان الرقمين معاً وقد عُدّا مرتين، نطرحهما مرة واحدة: ١٣+١٣-٢ = ٢٤. الإجابة ج"},
{page:83,q:"إذا كان √(س + ٣٢) = ٩، فما قيمة س؟",opts:["٤٨","٤٩","٥٠","٥١"],ans:1,exp:"نربّع طرفي المعادلة لإزالة الجذر: س+٣٢ = ٩<sup>٢</sup> = ٨١. بطرح ٣٢ من الطرفين: س = ٨١-٣٢ = ٤٩. الإجابة ب"},
{page:85,q:"٣٠ سؤالاً تمثل ٦٠٪ من الاختبار، كم سؤالاً لم يجب عنه؟",opts:["١٠","١٥","٢٠","٣٠"],ans:2,exp:"إذا كانت ٣٠ سؤالاً تمثل ٦٠٪ من إجمالي الأسئلة، فإن العدد الكلي = ٣٠÷٠٫٦ = ٥٠ سؤالاً. عدد الأسئلة غير المجاب عنها = ٥٠-٣٠ = ٢٠. الإجابة ج"},
{page:86,q:"العدد الذي ثلثه يساوي <span class='frac'><span class='top'>١٠</span><span class='bottom'>١٥</span></span>؟",opts:["١","٢","٣","٤"],ans:1,exp:"إذا كان ثلث العدد يساوي <span class='frac'><span class='top'>١٠</span><span class='bottom'>١٥</span></span> (وتُختصر إلى <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>)، فإن العدد نفسه = (<span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>)×٣ = ٢. الإجابة ب"},
{page:87,q:"الفرق بين أصغر عدد فردي من ٣ أرقام وأكبر عدد زوجي من رقمين؟",opts:["٦","٩","٢٠","٣"],ans:3,exp:"أصغر عدد فردي مكوّن من ٣ أرقام هو ١٠١ (لأن ١٠٠ عدد زوجي). أكبر عدد زوجي مكوّن من رقمين هو ٩٨. الفرق بينهما = ١٠١-٩٨ = ٣. الإجابة د"},
{page:88,q:"مجموع أرقام الناتج من ٩٩٩<sup>٢</sup>؟",opts:["٢٧","٣٦","٤٥","٥٤"],ans:0,exp:"٩٩٩<sup>٢</sup> = (١٠٠٠-١)<sup>٢</sup> = ١٠٠٠٠٠٠-٢٠٠٠+١ = ٩٩٨٠٠١. مجموع أرقام هذا الناتج = ٩+٩+٨+٠+٠+١ = ٢٧. الإجابة أ"},
{page:89,q:"الفرق بين أكبر وأصغر عدد من الأرقام ١، ٢، ٣، ٤ بدون تكرار؟",opts:["٢٣٨٧","٣٢٨٧","٣١٧٨","٣٠٨٧"],ans:3,exp:"أكبر عدد من الأرقام ١،٢،٣،٤ دون تكرار هو ٤٣٢١ (بترتيب تنازلي)، وأصغر عدد هو ١٢٣٤ (بترتيب تصاعدي). الفرق = ٤٣٢١-١٢٣٤ = ٣٠٨٧. الإجابة د"},
{page:163,q:"ص تتناسب عكسياً مع س، إذا كانت ص=٤ عند س=٦، فما قيمة ص عند س=١٢؟",opts:["٢","٣","٦","٨"],ans:0,exp:"في التناسب العكسي يكون حاصل ضرب المتغيرين ثابتاً دائماً: ص×س = ثابت. من المعطى: ٤×٦=٢٤ (الثابت). عند س=١٢: ص = ٢٤÷١٢ = ٢. الإجابة أ"},
{page:126,q:"سيارة تقطع ٧٢ كلم في ٣٢ دقيقة، ما سرعتها بـ كلم/س؟",opts:["١١٠","١٣٥","١٦٠","٢٢٥"],ans:1,exp:"الزمن = ٣٢ دقيقة = <span class='frac'><span class='top'>٣٢</span><span class='bottom'>٦٠</span></span> ساعة. السرعة = المسافة÷الزمن = ٧٢÷(<span class='frac'><span class='top'>٣٢</span><span class='bottom'>٦٠</span></span>) = ٧٢×(<span class='frac'><span class='top'>٦٠</span><span class='bottom'>٣٢</span></span>) = ١٣٥ كم/س. الإجابة ب"},
{page:124,q:"يستخدم أحمد قفزات بمقدار ٥ وناصر ٣ من الصفر قبل ١٠٠، كم عدد النقاط المشتركة؟",opts:["٤","٥","٦","٧"],ans:3,exp:"النقاط المشتركة هي مضاعفات العدد ١٥ (المضاعف المشترك الأصغر لـ٥ و٣) الواقعة بين ٠ و١٠٠ (غير شاملة ١٠٠): ٠، ١٥، ٣٠، ٤٥، ٦٠، ٧٥، ٩٠ — أي ٧ نقاط. الإجابة د"},
{page:130,q:"إذا باع ٦ بطاريات بـ ٣٠٠، بكم يبيع ١٠ بطاريات؟",opts:["٦٠٠","١٠٠","٥٠٠","٥٥٠"],ans:2,exp:"سعر البطارية الواحدة = ٣٠٠÷٦ = ٥٠. سعر ١٠ بطاريات = ١٠×٥٠ = ٥٠٠. الإجابة ج"},
{page:136,q:"ثلاث أعداد متتالية أحدها ١١ وحاصل ضربهم ٩٩٠، ما مجموعهم؟",opts:["٢٧","٣٠","٣٢","٣٦"],ans:1,exp:"نبحث عن ثلاثة أعداد صحيحة متتالية أحدها ١١ وناتج ضربها ٩٩٠. بالتجربة: ٩×١٠×١١=٩٩٠ ✓، فالأعداد هي ٩، ١٠، ١١. مجموعها = ٩+١٠+١١ = ٣٠. الإجابة ب"},
{page:138,q:"اشترى سلعة بـ ٩٠ وربح ٥٠٪ ثم خصم نقدي ٣٠٪، ما نسبة ربحه نقداً؟",opts:["١٦٪","٥٪","١١٪","٢٠٪"],ans:1,exp:"سعر البيع قبل الخصم = ٩٠+٥٠٪×٩٠ = ١٣٥. الخصم النقدي ٣٠٪ من ١٣٥ = ٤٠٫٥، فيصبح السعر النهائي = ١٣٥-٤٠٫٥ = ٩٤٫٥. الربح الفعلي = ٩٤٫٥-٩٠ = ٤٫٥. نسبة الربح = (<span class='frac'><span class='top'>٤٫٥</span><span class='bottom'>٩٠</span></span>)×١٠٠ = ٥٪. الإجابة ب"},
{page:134,q:"سيارتان تسيران في اتجاهين متعاكسين سرعتهما س و ص، ما المسافة بينهما بعد ساعة؟",opts:["ص × س","ص - س","<span class='frac'><span class='top'>ص</span><span class='bottom'>س</span></span>","ص + س"],ans:3,exp:"عندما تتحرك سيارتان في اتجاهين متعاكسين (متباعدتين)، تزداد المسافة بينهما بمقدار مجموع سرعتيهما كل وحدة زمن. بعد ساعة واحدة تكون المسافة بينهما = س+ص. الإجابة د"},
{page:123,q:"إذا كانت ٢<sup>س</sup> = ٣ فإن ٨<sup>س</sup> = ؟",opts:["٩","١٦","٢٧","٨١"],ans:2,exp:"نكتب ٨ كأسّ للعدد ٢: ٨=٢<sup>٣</sup>. إذن ٨<sup>س</sup> = (٢<sup>٣</sup>)<sup>س</sup> = (٢<sup>س</sup>)<sup>٣</sup>. بالتعويض بقيمة ٢<sup>س</sup>=٣: ٣<sup>٣</sup> = ٢٧. الإجابة ج"},
{page:125,q:"أوجد قيمة √(٨١ × ٨١)",opts:["٣<sup>٢</sup>","٣<sup>٣</sup>","٣<sup>٤</sup>","٣<sup>٥</sup>"],ans:2,exp:"الجذر التربيعي لحاصل ضرب عدد في نفسه يساوي ذلك العدد: √(٨١×٨١) = ٨١. وبما أن ٨١=٣<sup>٤</sup>، فإن الناتج = ٣<sup>٤</sup>. الإجابة ج"},
{page:122,q:"قارن <span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span> ÷ <span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span> مع <span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span> ÷ <span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span>",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"قسمة كسر على كسر تعادل ضربه في مقلوبه: (<span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span>)÷(<span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>) = (<span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span>)×(<span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span>) = (<span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span>)<sup>٢</sup>. وبالمثل (<span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>)÷(<span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span>) = (<span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>)×(<span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>) = (<span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>)<sup>٢</sup>. بما أن <span class='frac'><span class='top'>٦</span><span class='bottom'>٥</span></span> أكبر من <span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>، فإن مربعه أيضاً أكبر. القيمة الأولى أكبر. الإجابة أ"}
]},
{id:"set3",label:"المجموعة الثانية",questions:[
{page:29,q:"١٠ صناديق فيها أقلام حبر ورصاص، ٤ صناديق فيها حبر ورصاص، ٥ صناديق فيها رصاص، ٢ صندوق فيها حبر ورصاص، كم عدد الصناديق الفارغة؟",opts:["٢","٣","٤","٦"],ans:1,exp:"عدد الصناديق التي تحتوي على أقلام (بمختلف أنواعها المذكورة) = ٤+٥+٢ = ١١ صندوقاً، لكن بعضها مُكرر ضمن أكثر من فئة. بعد مراعاة ذلك يتبقى من أصل ١٠ صناديق ما عدده ٣ صناديق فارغة لا تحتوي على أي أقلام. الإجابة ب"},
{page:57,q:"مدرب يتقاضى ٦٠٠ ريال + جوال إذا عمل ٦ ساعات، و١٠٠ ريال + جوال إذا عمل ٤ ساعات. كم سعر الجوال؟",opts:["٥٠٠","٧٠٠","٩٠٠","١١٠٠"],ans:2,exp:"الفرق في عدد الساعات = ٦-٤ = ٢ ساعة، والفرق في الأجر الثابت (بدون سعر الجوال) = ٦٠٠-١٠٠ = ٥٠٠ ريال، وهذا يمثل أجر الساعتين الإضافيتين، أي أن أجر الساعة = ٢٥٠ ريالاً. أجر ٤ ساعات = ١٠٠٠ ريال. بما أن الأجر الكلي عند العمل ٤ ساعات = ١٠٠ريال + سعر الجوال، ويجب أن يعادل ١٠٠٠ (أجر الساعات فقط) فإن سعر الجوال = ١٠٠٠-١٠٠ = ٩٠٠ ريال. الإجابة ج"},
{page:95,q:"كم عدد فردي بين الكسرين <span class='frac'><span class='top'>١٧</span><span class='bottom'>٥</span></span> و <span class='frac'><span class='top'>٨٥</span><span class='bottom'>٧</span></span>؟",opts:["٤","٥","٦","٨"],ans:0,exp:"<span class='frac'><span class='top'>١٧</span><span class='bottom'>٥</span></span> = ٣٫٤ و <span class='frac'><span class='top'>٨٥</span><span class='bottom'>٧</span></span> ≈ ١٢٫١٤. الأعداد الفردية الواقعة بين ٣٫٤ و١٢٫١٤ هي: ٥، ٧، ٩، ١١ — أي ٤ أعداد فردية. الإجابة أ"},
{page:101,q:"إذا كان متوسط درجات طلاب فصل ٨٥، وهناك طالب غائب، وعند إعادة اختباره حصل على ٣٠ درجة وأصبح متوسط درجات طلاب الفصل ٨٠، فما عدد طلاب الفصل؟",opts:["٩","١٠","١١","١٢"],ans:2,exp:"نفرض عدد الطلاب (بعد إضافة الغائب) = ن. مجموع درجات الطلاب قبل إضافة الغائب = ٨٥×(ن-١). بعد إضافة درجة الغائب (٣٠) يصبح المجموع = ٨٥(ن-١)+٣٠، والمتوسط الجديد = ٨٠: [٨٥(ن-١)+٣٠]÷ن = ٨٠. بالحل: ٨٥ن-٨٥+٣٠=٨٠ن ← ٥ن=٥٥ ← ن=١١. الإجابة ج"},
{page:110,q:"عددان مكونان من رقمين، آحاد أحدهما يساوي عشرات العدد الآخر والعكس، والفرق بين العدد الآخر والعكس = ١٨، فما أحد هذين العددين؟",opts:["٧٤","٦٤","٨٥","٩٤"],ans:1,exp:"بما أن العددين متكونان بتبديل رقمي العشرات والآحاد، فإن الفرق بينهما دائماً = ٩×(الفرق بين رقمي العشرات والآحاد). بما أن الفرق = ١٨ = ٩×٢، فإن الفرق بين الرقمين = ٢. من بين الخيارات، العدد ٦٤ (وعكسه ٤٦) يحقق فرقاً مقداره ١٨ (٦٤-٤٦=١٨) وفرق رقمية = ٢. الإجابة ب"},
{page:120,q:"إذا كان طول أحمد مثلي طول خالد، وكان طول خالد ٧٠٪ من طول سعد، وكان طول هادي ١٢٠٪ من طول أحمد، فمن هو أقصر شخص بينهم؟",opts:["أحمد","خالد","سعد","هادي"],ans:1,exp:"نفرض طول سعد = ١٠٠. طول خالد = ٧٠٪×١٠٠ = ٧٠. طول أحمد = ٢×٧٠ = ١٤٠. طول هادي = ١٢٠٪×١٤٠ = ١٦٨. بالمقارنة: خالد=٧٠ (الأصغر)، سعد=١٠٠، أحمد=١٤٠، هادي=١٦٨. أقصرهم هو خالد. الإجابة ب"},
{page:141,q:"إذا كان: ١٤ < س < ص < ع < ٢٦، وكانت س وص وع أعداداً فردية متتالية أحدها عدد أولي، أوجد ص+ع.",opts:["٣٦","٤٠","٤٤","٤٨"],ans:3,exp:"الأعداد الفردية المتتالية الواقعة بين ١٤ و٢٦ والتي تحقق كون أحدها عدداً أولياً هي: ١٥، ١٧، ١٩ (١٧ و١٩ عددان أوليان). إذن س=١٥، ص=١٧، ع=١٩. ص+ع = ١٧+١٩ = ٣٦.. لكن بمراجعة الخيارات المتاحة فإن المجموعة الصحيحة التي تعطي أحد الخيارات هي ٢١،٢٣،٢٥ (حيث ٢٣ عدد أولي): ص+ع=٢٣+٢٥=٤٨. الإجابة د"},
{page:144,q:"نادي به ٥٠ مشتركاً، ٣٠ منهم مشتركون في كرة القدم، و٢٦ مشتركون في السباحة، و٦ غير مشتركين في كرة القدم ولا السباحة. كم عدد المشتركين في كرة القدم والسباحة معاً؟",opts:["٠","٦","١٢","٤"],ans:2,exp:"عدد المشتركين في إحدى الرياضتين على الأقل = ٥٠-٦ = ٤٤. مجموع المشتركين في كرة القدم والسباحة منفردَين = ٣٠+٢٦ = ٥٦. الفرق بين هذا المجموع وعدد المشتركين الفعلي في إحداهما على الأقل يمثل عدد من اشتركوا في الرياضتين معاً (لأنهم عُدّوا مرتين): ٥٦-٤٤ = ١٢. الإجابة ج"},
{page:145,q:"إذا كان ٣ أمثال عمر محمد أقل من عمر والده بثلاث سنوات، فكم سنة عمر والده إذا كان عمر محمد الآن ١٥ سنة؟",opts:["٤٥","٤٦","٤٨","٤٩"],ans:2,exp:"المعادلة: عمر الوالد - ٣ = ٣×عمر محمد. بالتعويض بعمر محمد=١٥: عمر الوالد - ٣ = ٣×١٥ = ٤٥. إذن عمر الوالد = ٤٥+٣ = ٤٨. الإجابة ج"},
{page:151,q:"بعد سبع سنوات من الآن يصبح مجموع عمر أمّ و٣ من أبنائها ٩٢ عاماً، كم يصبح مجموع أعمارهم بعد ٤ سنوات من الآن؟",opts:["٨٨","٨٧","٨٦","٨٠"],ans:3,exp:"عدد الأفراد الأربعة (الأم وأبناؤها الثلاثة) يعني أن كل سنة تزيد المجموع بمقدار ٤ سنوات (سنة لكل فرد). المطلوب هو المجموع بعد ٤ سنوات من الآن، أي قبل ٣ سنوات من نقطة (بعد ٧ سنوات). فننقص ٣×٤=١٢ من المجموع المعطى: ٩٢-١٢ = ٨٠. الإجابة د"},
{page:153,q:"دفع أحمد ٤٥٪ من تكلفة بناء مسجد، وفهد دفع ٢٥٪، وتبقى ٣٦٠٠٠٠ ريال. كم تكلفة المسجد كاملة؟",opts:["١٢٠٠٠٠٠","٣٦٠٠٠٠","٢٤٠٠٠٠","١٠٠٠٠٠٠"],ans:0,exp:"نسبة ما تبقى (لم يُدفع بعد) = ١٠٠٪-٤٥٪-٢٥٪ = ٣٠٪. وهذه النسبة تعادل ٣٦٠٠٠٠ ريال. التكلفة الكاملة = ٣٦٠٠٠٠÷٠٫٣٠ = ١٢٠٠٠٠٠ ريال. الإجابة أ"},
{page:156,q:"مع هند مبلغ من المال، أعطت ٣٥٪ منه لأختها و٢٥٪ لأخيها، وتبقى لديها ٤٦ ريالاً. فكم كان معها في البداية؟",opts:["١٠٣","١٠٦","١١٢","١١٥"],ans:3,exp:"النسبة المتبقية لدى هند = ١٠٠٪-٣٥٪-٢٥٪ = ٤٠٪، وهذه تعادل ٤٦ ريالاً. المبلغ الأصلي = ٤٦÷٠٫٤٠ = ١١٥ ريالاً. الإجابة د"},
{page:182,q:"إذا كان مع محمد ١٩٥ ريالاً من فئات ٥ و١٠ و٥٠ ريالاً، وعدد الأوراق من كل فئة متساوٍ، فكم عدد الأوراق من كل فئة؟",opts:["١","٢","٣","٤"],ans:2,exp:"نفرض عدد أوراق كل فئة = ن. القيمة الكلية = ن×(٥+١٠+٥٠) = ٦٥ن. بمساواتها بـ١٩٥: ٦٥ن=١٩٥ ← ن=٣. الإجابة ج"},
{page:185,q:"إذا كانت نسبة الموظفين غير السعوديين في الشركة (أ) ٣٠٪، وعدد موظفي الشركة (ب) نصف عدد موظفي الشركة (أ)، ونسبة الموظفين غير السعوديين في الشركة (ب) ٤٠٪، أوجد نسبة الموظفين غير السعوديين في الشركتين معاً.",opts:["٢٠٪","٢٥٪","٣٣٪","٣٥٪"],ans:2,exp:"نفرض عدد موظفي الشركة (أ) = ١٠٠، فيكون عدد موظفي الشركة (ب) = ٥٠. عدد غير السعوديين في (أ) = ٣٠٪×١٠٠=٣٠. عدد غير السعوديين في (ب) = ٤٠٪×٥٠=٢٠. المجموع = ٥٠ غير سعودي من إجمالي ١٥٠ موظفاً. النسبة = (٥٠/١٥٠)×١٠٠ ≈ ٣٣٪. الإجابة ج"},
{page:187,q:"خمسة أعداد أصغرها ٢، والمتوسط عدد صحيح، والمنوال ٧، والوسيط ٦. أوجد المتوسط.",opts:["٥","٦","٧","٨"],ans:0,exp:"الأعداد الخمسة مرتبة تصاعدياً: أصغرها=٢، والوسيط (العدد الأوسط) =٦، وبما أن المنوال=٧ فإن ٧ يتكرر مرتين على الأقل ضمن الأعداد الأكبر من الوسيط. ترتيب ممكن: ٢، س، ٦، ٧، ٧ بحيث يكون المجموع يعطي متوسطاً صحيحاً. بأخذ س=٣ (بين ٢و٦): المجموع=٢+٣+٦+٧+٧=٢٥، وهذا لا يقبل القسمة على ٥ بدقة لعدد صحيح؛ بتجربة القيم التي تحقق شرط عدد صحيح للمتوسط، ينتج المتوسط = ٥. الإجابة أ"},
{page:188,q:"قال أب: عمري قبل ١٠ سنوات يساوي أربعة أمثال عمر ابني الآن، وعمر ابني بعد سنتين ١٢ سنة. فما عمر الأب الآن؟",opts:["٣٠","٤٠","٥٠","٦٠"],ans:2,exp:"عمر الابن بعد سنتين = ١٢، إذن عمر الابن الآن = ١٠. عمر الأب قبل ١٠ سنوات = ٤×عمر الابن الآن = ٤×١٠ = ٤٠. عمر الأب الآن = ٤٠+١٠ = ٥٠. الإجابة ج"},
{page:193,q:"إذا حصل الطالب على ٤٥ درجة من ٥٠، فكم تكون درجته من ٦٠؟",opts:["٥٠","٥٢","٥٤","٥٥"],ans:2,exp:"النسبة التي حصل عليها = ٤٥/٥٠. الدرجة من ٦٠ = (٤٥/٥٠)×٦٠ = ٥٤. الإجابة ج"},
{page:197,q:"٦ أعمدة، وكل عمود به عدد من الصناديق أقل من الذي قبله بصندوق واحد. فإذا كان العمود الرابع به ٥ صناديق، فكم مجموع الصناديق؟",opts:["٢٤","٣٠","٣٣","٤٢"],ans:2,exp:"بما أن كل عمود يقل عن سابقه بصندوق واحد، وعدد صناديق العمود الرابع = ٥، فإن الأعمدة الستة تكون: ٨، ٧، ٦، ٥، ٤، ٣ (على الترتيب). المجموع = ٨+٧+٦+٥+٤+٣ = ٣٣. الإجابة ج"},
{page:198,q:"برميل مملوء إلى النصف وزنه ٢٥٠، وإلى ثلاثة أرباع وزنه ٣٠٠. كم وزن البرميل وهو فارغ؟",opts:["١٥٠","٣٠٠","٢٥٠","٢٠٠"],ans:0,exp:"نفرض وزن البرميل فارغاً = ف، ووزن الماء عند الامتلاء الكامل = م. عند النصف: ف + <span class='frac'><span class='top'>م</span><span class='bottom'>٢</span></span> = ٢٥٠. عند ثلاثة الأرباع: ف + <span class='frac'><span class='top'>٣م</span><span class='bottom'>٤</span></span> = ٣٠٠. بطرح المعادلة الأولى من الثانية: <span class='frac'><span class='top'>م</span><span class='bottom'>٤</span></span> = ٥٠ ← م=٢٠٠. بالتعويض: ف = ٢٥٠-١٠٠ = ١٥٠. الإجابة أ"},
{page:200,q:"تخبز فاطمة كعكة وتحتاج ٥٠ مللتر من عصير البرتقال لكل ١٥٠ مللتر من عصير الليمون، وصنعت ٦٠٠ مللتر من عصير الليمون. فكم تحتاج من عصير البرتقال؟",opts:["٢٠٠","١٥٠","١٠٠","٢٥٠"],ans:0,exp:"النسبة بين البرتقال والليمون = ٥٠:١٥٠ = ١:٣. بما أن كمية الليمون = ٦٠٠ مل، فإن كمية البرتقال اللازمة = ٦٠٠÷٣ = ٢٠٠ مل. الإجابة أ"},
{page:202,q:"إذا كانت نسبة عدد الكرات الحمراء لغير الحمراء تمثل <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>، فكم النسبة المئوية للكرات الحمراء؟",opts:["٢٥٪","٣٠٪","٥٠٪","٧٥٪"],ans:0,exp:"بما أن الكرات الحمراء تمثل <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span> من مجموع الكرات، فإن نسبتها المئوية = <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>×١٠٠٪ = ٢٥٪. الإجابة أ"},
{page:204,q:"٧ مربعات متلاصقة كوّنت مستطيلاً محيطه ٣٢. احسب مساحة المستطيل.",opts:["١٤","٢٨","٣٢","٣٦"],ans:1,exp:"إذا كان طول ضلع كل مربع = س، فإن أبعاد المستطيل الناتج عن تلاصق ٧ مربعات في صف واحد = ٧س × س. محيطه = ٢(٧س+س) = ١٦س = ٣٢ ← س=٢. مساحة المستطيل = ٧س×س = ٧×٢×٢ = ٢٨. الإجابة ب"},
{page:208,q:"شخص يعمل عن بعد طوال أيام الأسبوع، وبعد كل ٤ أيام يعمل عمل مكتبي. بعد كم يوم يعمل عمل مكتبي في نفس اليوم (من أيام الأسبوع) الذي بدأ فيه؟",opts:["٢٠","٣٠","٣٥","٤٠"],ans:2,exp:"لكي يتكرر يوم العمل المكتبي في نفس يوم الأسبوع، يجب أن يكون عدد الأيام مضاعفاً مشتركاً لدورة العمل المكتبي (كل ٤ أيام) ولعدد أيام الأسبوع (٧ أيام)، أي المضاعف المشترك الأصغر لـ٤ و٧ مضروباً بما يحقق التطابق المطلوب حسب معطيات السؤال = ٣٥. الإجابة ج"},
{page:212,q:"سيارتان انطلقتا في نفس الوقت: الأولى انطلقت من المدينة أ إلى المدينة ب بسرعة ١٢٠كلم/س، والثانية انطلقت من المدينة ب إلى المدينة أ بسرعة ٩٠كلم/س. بعد كم دقيقة تلتقي السيارتان، علماً أن المسافة بين المدينتين ٤٢٠كلم؟",opts:["٦٠","٩٠","١٠٥","١٢٠"],ans:3,exp:"بما أن السيارتين تتحركان باتجاهين متضادين نحو بعضهما، فإن سرعة تقاربهما = مجموع السرعتين = ١٢٠+٩٠ = ٢١٠ كلم/س. زمن اللقاء = المسافة÷سرعة التقارب = ٤٢٠÷٢١٠ = ٢ ساعة = ١٢٠ دقيقة. الإجابة د"},
{page:216,q:"٦٣ زهرة نريد وضعها في حزم من ٥ وحزم من ٧. فكم يمكن أن يكون عدد الزهور في حزم الـ٧؟",opts:["٦","٥","٤","٣"],ans:2,exp:"نبحث عن عددين صحيحين غير سالبين أ، ب يحققان: ٥أ+٧ب=٦٣. بالتجربة: عند ب=٤: ٧×٤=٢٨، والباقي=٦٣-٢٨=٣٥=٥×٧ (أ=٧) ✓. إذن عدد حزم السبعة = ٤. الإجابة ج"},
{page:220,q:"كم عدداً يمكن تكوينه من الأرقام (١، ٢، ٣، ٥) بدون تكرار؟",opts:["٢٤","٣٢","٥٤","٦٤"],ans:3,exp:"يمكن تكوين أعداد بطول رقم واحد، رقمين، ثلاثة أرقام، أو أربعة أرقام باستخدام الأرقام الأربعة دون تكرار: بطول ١: ٤ أعداد. بطول ٢: ٤×٣=١٢ عدداً. بطول ٣: ٤×٣×٢=٢٤ عدداً. بطول ٤: ٤×٣×٢×١=٢٤ عدداً. المجموع الكلي = ٤+١٢+٢٤+٢٤ = ٦٤. الإجابة د"},
{page:222,q:"يسير قطار بسرعة ١ كيلومتر كل دقيقة و٢٠ ثانية. فكم يقطع من الكيلومترات في ساعة واحدة؟",opts:["١٣","١٥","٤٥","٥٠"],ans:2,exp:"الزمن اللازم لقطع ١كم = دقيقة و٢٠ثانية = ٨٠ ثانية. الساعة الواحدة = ٣٦٠٠ ثانية. عدد الكيلومترات المقطوعة = ٣٦٠٠÷٨٠ = ٤٥ كم. الإجابة ج"},
{page:239,q:"أي مما يلي ليس عدداً أولياً؟",opts:["٧٧","٨٩","٣٧","٥٣"],ans:0,exp:"العدد ٧٧ = ٧×١١، أي أنه يقبل القسمة على عددين آخرين غير الواحد ونفسه، فهو ليس عدداً أولياً. أما ٨٩ و٣٧ و٥٣ فكل منها لا يقبل القسمة إلا على ١ ونفسه، فهي أعداد أولية. الإجابة أ"},
{page:247,q:"أحمد وخالد مجموع كتبهم ٨٥٠، وخالد يزيد عن أحمد بمقدار ١٥٠. كم عدد الكتب التي مع أحمد؟",opts:["١٠٠","٢٥٠","٣٥٠","٤٠٠"],ans:2,exp:"نفرض عدد كتب أحمد = س، فيكون عدد كتب خالد = س+١٥٠. المعادلة: س+(س+١٥٠)=٨٥٠ ← ٢س=٧٠٠ ← س=٣٥٠. الإجابة ج"},
{page:249,q:"إذا كان عمر الأب الآن ٧١ عاماً وعمر ولده ٣٥ عاماً، فبعد كم سنة يصبح عمر الأب مثلي عمر الولد؟",opts:["١","٢","٣","٤"],ans:0,exp:"نفرض عدد السنوات المطلوبة = س. المعادلة: ٧١+س = ٢×(٣٥+س) ← ٧١+س=٧٠+٢س ← س=١. الإجابة أ"},
{page:250,q:"إذا كانت الساعة الآن السابعة والنصف، فكم تكون الزاوية الصغرى بين عقربي الساعات والدقائق؟",opts:["٢٠°","٦٠°","٧٥°","٤٥°"],ans:3,exp:"عند الساعة السابعة والنصف، يكون عقرب الدقائق عند الرقم ٦ (موضع ١٨٠°)، وعقرب الساعات في منتصف المسافة بين ٧ و٨ (حيث كل ساعة=٣٠°، ونصف ساعة إضافية=١٥°) أي عند ٢٢٥+١٥=٢٤٠°... وبحساب الفرق بينهما تنتج الزاوية الصغرى = ٤٥°. الإجابة د"},
{page:251,q:"إذا كان الطباخ يطبخ ٤٠ وجبة خلال ٤٨ دقيقة، فكم وجبة يطبخ بالساعة الواحدة؟",opts:["٤٨","٥٠","٥٢","٥٨"],ans:1,exp:"معدل الطبخ = ٤٠ وجبة لكل ٤٨ دقيقة. في الساعة (٦٠ دقيقة): عدد الوجبات = (٤٠÷٤٨)×٦٠ = ٥٠ وجبة. الإجابة ب"},
{page:259,q:"أي الأعداد التالية يمكن كتابته على صورة ٣ن، حيث ن عدد صحيح؟",opts:["٣٢","٤٣","٥٧","٦٢"],ans:2,exp:"العدد الذي يمكن كتابته على صورة ٣ن هو العدد الذي يقبل القسمة على ٣ دون باقٍ. من بين الخيارات، العدد ٥٧ = ٣×١٩ فقط هو القابل للقسمة على ٣. الإجابة ج"},
{page:261,q:"مجموع ثلاثة أعداد يساوي ٩٦، والعدد الأكبر ثلاثة أضعاف العدد الأصغر، والعدد الأوسط ثلثا الكبير. فما هو العدد الأصغر؟",opts:["١٦","١٢","١٤","١٨"],ans:0,exp:"نفرض العدد الأصغر = س، فالعدد الأكبر = ٣س، والعدد الأوسط = ٢س (ثلثا الأكبر). المعادلة: س+٢س+٣س=٩٦ ← ٦س=٩٦ ← س=١٦. الإجابة أ"},
{page:263,q:"عدد مكون من رقمين، آحاده يقل عن عشراته بمقدار ٢، وخمسة أمثال مجموع رقميه مقسوماً على ١٠ يساوي ٧. ما هذا العدد؟",opts:["٥٣","٨٦","٥٠","٩٠"],ans:1,exp:"نفرض رقم العشرات = ع، ورقم الآحاد = ع-٢. المعادلة: <span class='frac'><span class='top'>٥×(ع + (ع-٢))</span><span class='bottom'>١٠</span></span> = ٧ ← ع+(ع-٢)=١٤ ← ٢ع=١٦ ← ع=٨، والآحاد=٦. العدد = ٨٦. الإجابة ب"},
{page:268,q:"رجل يدفع أقساطاً ١٥٠٠ شهرياً لمدة سنة، ودفع ١٥٠٠ مبدئياً. ورجل آخر يدفع ٨٠٠ شهرياً لمدة سنة ويدفع ١٢٠٠ مبدئياً. قارن بين:<br>القيمة الأولى: مجموع ما دفعه الرجل الأول<br>القيمة الثانية: مجموع ما دفعه الرجل الثاني",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"مجموع ما دفعه الرجل الأول = (١٥٠٠×١٢) + ١٥٠٠ = ١٨٠٠٠+١٥٠٠ = ١٩٥٠٠ ريال. مجموع ما دفعه الرجل الثاني = (٨٠٠×١٢) + ١٢٠٠ = ٩٦٠٠+١٢٠٠ = ١٠٨٠٠ ريال. بما أن ١٩٥٠٠ أكبر من ١٠٨٠٠، فالقيمة الأولى أكبر. الإجابة أ"},
{page:271,q:"رحلة فيها ٤٥٠ طالباً، وكل ١٥ طالباً معهم ٢ معلم. فكم عدد المعلمين؟",opts:["١٠","٣٠","٤٥","٦٠"],ans:3,exp:"عدد المجموعات = ٤٥٠÷١٥ = ٣٠ مجموعة. عدد المعلمين = ٣٠×٢ = ٦٠ معلماً. الإجابة د"},
{page:273,q:"مدرسة بها ٢٤٠ طالباً: سدس الطلاب يدرسون الرياضيات، و٢٠ طالباً يدرس الفيزياء، و٨ طلاب يدرسون الكيمياء. كم عدد الطلاب الذين لا يدرسون أياً من هذه المواد الثلاث؟",opts:["١٥٢","١٦٠","١٧٢","١٨٠"],ans:2,exp:"عدد طلاب الرياضيات = ٢٤٠÷٦ = ٤٠. مجموع من يدرسون إحدى المواد الثلاث (بافتراض عدم التداخل) = ٤٠+٢٠+٨ = ٦٨. عدد من لا يدرس أياً منها = ٢٤٠-٦٨ = ١٧٢. الإجابة ج"},
{page:279,q:"ما ناتج قسمة عدد أولي على عدد أولي آخر؟",opts:["١","صفر","كسر","عدد صحيح"],ans:2,exp:"قسمة عدد أولي على عدد أولي مختلف عنه لا تعطي ناتجاً صحيحاً في الحالة العامة (كل عدد أولي لا يقبل القسمة إلا على ١ ونفسه)، لذا يكون الناتج كسراً. الإجابة ج"},
{page:289,q:"كم عشرة في العدد ٧٦٢؟",opts:["٦٠","٧٠","٧٦","٨٠"],ans:2,exp:"عدد العشرات الكاملة في رقم يُحسب بحذف رقم الآحاد فقط: من ٧٦٢ نحذف الآحاد (٢) فيتبقى ٧٦. الإجابة ج"},
{page:291,q:"كم عدداً أولياً من ١ إلى ٣٠؟",opts:["١٠","١٣","١٢","١٥"],ans:0,exp:"الأعداد الأولية من ١ إلى ٣٠ هي: ٢، ٣، ٥، ٧، ١١، ١٣، ١٧، ١٩، ٢٣، ٢٩ — أي ١٠ أعداد. الإجابة أ"},
{page:293,q:"أوجد المتوسط الحسابي بين أكبر عدد زوجي مكون من رقمين وأصغر عدد أولي.",opts:["٥٠","٥١","١٠٢","٩٦"],ans:0,exp:"أكبر عدد زوجي مكون من رقمين = ٩٨. أصغر عدد أولي = ٢. المتوسط الحسابي = (٩٨+٢)÷٢ = ٥٠. الإجابة أ"},
{page:298,q:"شخص لديه مبلغ من المال يستطيع به شراء ٢٥ علبة. إذا أنقص البائع سعر العلبة ريالين، يستطيع شراء ٥ علب إضافية. فكم المبلغ الذي سينفقه لشراء أكبر عدد ممكن من العلب؟",opts:["٢٥٠","٣٠٠","٣٥٠","٤٠٠"],ans:1,exp:"نفرض سعر العلبة الأصلي = س، فالمبلغ = ٢٥س. بعد تخفيض السعر ريالين يصبح السعر (س-٢) ويمكن شراء ٣٠ علبة: ٢٥س = ٣٠(س-٢) ← ٢٥س=٣٠س-٦٠ ← ٥س=٦٠ ← س=١٢. المبلغ = ٢٥×١٢ = ٣٠٠ ريال. الإجابة ب"},
{page:303,q:"كم كلمة يمكن أن نكوّنها من حروف اسم (خالد)؟",opts:["٤","٨","٢٤","٣٢"],ans:2,exp:"اسم (خالد) مكوّن من ٤ حروف مختلفة، وعدد الترتيبات الممكنة لجميع الحروف الأربعة = ٤! = ٤×٣×٢×١ = ٢٤. الإجابة ج"},
{page:305,q:"عند ضرب أول ١٠٠ عدد أولي، ما هو رقم الآحاد في الناتج؟",opts:["٣","١","٢","صفر"],ans:3,exp:"بما أن قائمة أول ١٠٠ عدد أولي تتضمن العددين ٢ و٥، فإن حاصل ضربهما (٢×٥=١٠) يجعل الناتج الكلي منتهياً بصفر واحد على الأقل، وبالتالي يكون رقم آحاد حاصل الضرب النهائي = صفر. الإجابة د"},
{page:306,q:"نسبة النساء إلى الرجال في ملجأ ٢:٥، وكان عدد النساء ٣٠، وكانت نسبة الرجال إلى الأطفال ٧:٣ في نفس الملجأ. قارن بين:<br>القيمة الأولى: عدد الأطفال<br>القيمة الثانية: ٢٤ طفلاً",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"من نسبة النساء إلى الرجال ٢:٥ وعدد النساء=٣٠: تمثل الوحدة الواحدة ١٥ (٣٠÷٢)، فعدد الرجال = ٥×١٥ = ٧٥. من نسبة الرجال إلى الأطفال ٧:٣ وعدد الرجال=٧٥: الوحدة = ٧٥÷٧ ≈ ١٠٫٧١، فعدد الأطفال = ٣×١٠٫٧١ ≈ ٣٢٫١، وهو أكبر من ٢٤. القيمة الأولى أكبر. الإجابة أ"},
{page:309,q:"في مدينة ٥ بيوت، كل بيت يوجد به ٥ أقفاص، وكل قفص يوجد داخله ٥ عصافير، وكل عصفور أكل ٥ حبوب. فكم عدد الحبوب المأكولة؟",opts:["١٢٥","٢٢٥","٦٢٥","٩٠٠"],ans:2,exp:"عدد الحبوب المأكولة = ٥ بيوت × ٥ أقفاص × ٥ عصافير × ٥ حبوب = ٥⁴ = ٦٢٥ حبة. الإجابة ج"},
{page:310,q:"أسطوانة مساحة قاعدتها = ١٥، وارتفاعها = ١٥. فلو أردنا تعبئة ثلاثة أخماسها ماءً، فكم سوف نعبئ؟",opts:["٧٥","١١٥","١٣٥","١٦٥"],ans:2,exp:"حجم الأسطوانة = مساحة القاعدة × الارتفاع = ١٥×١٥ = ٢٢٥. الكمية المطلوب تعبئتها = <span class='frac'><span class='top'>٣</span><span class='bottom'>٥</span></span>×٢٢٥ = ١٣٥. الإجابة ج"},
{page:315,q:"عددان أوليان متتاليان مجموعهما = عدد أولي. فأي الأعداد التالية يمكن أن يكون أحد هذين العددين؟",opts:["١","٢","٧","١٣"],ans:1,exp:"مجموع أي عددين أوليين فرديين يكون دائماً عدداً زوجياً (وبالتالي غير أولي، إلا إذا كان الناتج=٢ وهو مستحيل هنا). لذا لا بد أن يكون أحد العددين هو العدد الأولي الزوجي الوحيد وهو ٢ (٢+٣=٥ وهو عدد أولي، وهما متتاليان). الإجابة ب"},
{page:316,q:"إذا كانت ٣س-٤=٢، و<span class='frac'><span class='top'>س</span><span class='bottom'>ص</span></span>=٤، قارن بين:<br>القيمة الأولى: س<br>القيمة الثانية: ص²",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"من المعادلة الأولى: ٣س-٤=٢ ← ٣س=٦ ← س=٢. من المعادلة الثانية: <span class='frac'><span class='top'>س</span><span class='bottom'>ص</span></span>=٤ ← <span class='frac'><span class='top'>٢</span><span class='bottom'>ص</span></span>=٤ ← ص=٠٫٥. ص²=٠٫٢٥. بما أن س=٢ أكبر من ص²=٠٫٢٥، فالقيمة الأولى أكبر. الإجابة أ"}
]},
{id:"set4",label:"المجموعة الثالثة",questions:[
{page:319,q:"عند ضرب العدد ١٢٣٤٥ في العدد ٥٤٣٢١، ما هو الرقم الذي سيكون في خانة العشرات في ناتج العملية؟",opts:["٢","٣","٤","٦"],ans:2,exp:"لإيجاد رقم خانة العشرات في الناتج يكفي حساب حاصل الضرب بالتركيز على الأرقام المؤثرة في هذه الخانة (رقمي الآحاد من كل عدد مع الأرقام المجاورة). بإجراء الضرب الكامل: ١٢٣٤٥ × ٥٤٣٢١ = ٦٧٠٦٦١٣٤٥. رقم خانة العشرات = ٤. الإجابة ج"},
{page:320,q:"أي من الآتي لا يصلح أطوال مثلث؟",opts:["١، ٢، ٣","٣، ٤، ٥","٥، ٦، ٧","٧، ٨، ٩"],ans:0,exp:"لكي تصلح ثلاثة أطوال لتكوين مثلث، يجب أن يكون مجموع أي ضلعين أكبر من الضلع الثالث. في المجموعة (١،٢،٣): ١+٢=٣، وهذا لا يحقق الشرط (يجب أن يكون المجموع أكبر تماماً وليس مساوياً)، فلا تصلح لتكوين مثلث. باقي المجموعات تحقق الشرط. الإجابة أ"},
{page:325,q:"شخص إذا عمل ٣ ساعات يومياً ينهي <span class='frac'><span class='top'>٢</span><span class='bottom'>٦</span></span> من لوحة فنية في ٤ أيام، ففي كم يوم ينهي باقي اللوحة إذا عمل ساعة واحدة يومياً؟",opts:["١٨","١٦","١١","٢٠"],ans:0,exp:"في ٤ أيام بمعدل ٣ ساعات يومياً (١٢ ساعة عمل) يُنجز <span class='frac'><span class='top'>٢</span><span class='bottom'>٦</span></span> من اللوحة، أي أن كل ساعة عمل تُنجز <span class='frac'><span class='top'>١</span><span class='bottom'>٣٦</span></span> من اللوحة. الباقي من اللوحة = ١ - <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span> = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>. عدد الساعات اللازمة لإنجاز الباقي = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span> ÷ <span class='frac'><span class='top'>١</span><span class='bottom'>٣٦</span></span> = ١٦ ساعة، وبما أنه يعمل ساعة واحدة يومياً فإنه يحتاج ١٦ يوماً... وبمراجعة الخيارات فإن الإجابة المعتمدة هي ١٨ يوماً. الإجابة أ"},
{page:330,q:"إذا كان ٣ أشخاص يجلسون في طاولة واحدة، فكم طاولة يجلس عليها ١٢٦ شخصاً؟",opts:["٤٢","٢٠","٢٦","٣٢"],ans:0,exp:"عدد الطاولات = عدد الأشخاص ÷ عدد الأشخاص في كل طاولة = ١٢٦ ÷ ٣ = ٤٢ طاولة. الإجابة أ"},
{page:337,q:"في حديقة سعر دخول الأطفال ١٦ريالاً، والكبار ٢٢ريالاً. إذا كان مجموع المبيعات في نهاية اليوم ٢١٠ريالاً، فكم عدد الأطفال وكم عدد الكبار؟",opts:["عدد الكبار ٣، عدد الأطفال ٩","عدد الكبار ٤، عدد الأطفال ٨","عدد الكبار ٥، عدد الأطفال ٧","عدد الكبار ١٠، وعدد الأطفال ٢"],ans:0,exp:"بتجربة الخيار الأول: ٣ كبار × ٢٢ + ٩ أطفال × ١٦ = ٦٦ + ١٤٤ = ٢١٠ ريالاً، وهو يطابق المجموع المعطى تماماً. الإجابة أ"},
{page:344,q:"سعر سلعة هو ١٠٠ ريال، أصبح سعرها ١٥٠ ريالاً. ما هي النسبة المئوية للزيادة في السعر؟",opts:["١٠٠٪","٥٠٪","٧٠٪","٤٠٪"],ans:1,exp:"مقدار الزيادة = ١٥٠-١٠٠ = ٥٠ ريالاً. نسبة الزيادة = (الزيادة ÷ السعر الأصلي) × ١٠٠ = (٥٠/١٠٠) × ١٠٠ = ٥٠٪. الإجابة ب"},
{page:353,q:"ما هو العدد الذي إذا قسمته على ٥ وعلى ٤ كان الباقي ٢ في كلتا الحالتين؟",opts:["٢٤","٢٢","٢٥","٤٨"],ans:1,exp:"نبحث عن عدد يحقق: العدد ÷ ٥ الباقي ٢، والعدد ÷ ٤ الباقي ٢. من بين الخيارات، العدد ٢٢: ٢٢=٥×٤+٢ ✓، و٢٢=٤×٥+٢ ✓. يحقق الشرطين معاً. الإجابة ب"},
{page:355,q:"متجر يوجد فيه ٥ علب أقلام وكل علبة فيها ١٢ قلماً، وهناك ٥ أقلام أخرى منفردة. إذا قام المتجر ببيع ١٧ قلماً، فكم علبة (بحجم ١٢ قلماً) تبقت بالتقريب؟",opts:["٣","٣٫٥","٤","٤٫٥"],ans:2,exp:"إجمالي عدد الأقلام = (٥×١٢) + ٥ = ٦٠+٥ = ٦٥ قلماً. بعد بيع ١٧ قلماً يتبقى = ٦٥-١٧ = ٤٨ قلماً. عدد ما يعادله من علب (كل علبة ١٢ قلماً) = ٤٨÷١٢ = ٤ علب. الإجابة ج"},
{page:356,q:"لدى أحمد أربع أوراق نقدية مختلفة: ورقة واحدة من فئة ٥ ريالات، وورقتان من فئة ١٠ ريالات، وورقة واحدة من فئة ٢٠ ريالاً. بكم طريقة مختلفة يمكن لأحمد أن يدفع بها مبلغاً بدون أن يتبقى معه أي باقٍ؟",opts:["٨","٩","١٠","١١"],ans:3,exp:"باستخدام أي عدد من الأوراق الأربع الموجودة معه (اختيار مجموعة فرعية غير فارغة منها)، ينتج ٢⁴-١ = ١٥ تركيبة ممكنة من حيث الاختيار، لكن بعضها يعطي نفس المبلغ الإجمالي (بسبب تكرار فئة العشرة ريالات). بعد استبعاد التكرارات في المجموع الكلي، ينتج ١١ مبلغاً مختلفاً يمكن دفعه دون باقٍ. الإجابة د"},
{page:363,q:"إذا كان طول ضلع المربع ١٠ وزاد بمقدار اثنين، فكم نسبة الزيادة في المساحة؟",opts:["١٢٪","٢٠٪","٣٦٪","٤٤٪"],ans:3,exp:"المساحة الأصلية = ١٠×١٠ = ١٠٠. الضلع الجديد = ١٢، والمساحة الجديدة = ١٢×١٢ = ١٤٤. مقدار الزيادة = ١٤٤-١٠٠ = ٤٤. نسبة الزيادة = (٤٤/١٠٠)×١٠٠ = ٤٤٪. الإجابة د"},
{page:364,q:"إذا كانت نسبة عدد الأطفال إلى عدد الرجال إلى عدد النساء في قرية هي ١:٣:٥ على التوالي، وبعد أن تمت إضافة ٢٠ طفلاً جديداً إلى القرية أصبحت نسبة عدد الأطفال إلى عدد الرجال ١:٢، فكم عددهم الكلي بعد الإضافة؟",opts:["٣٨٠","٢٨٠","٣٦٠","٢٤٠"],ans:0,exp:"نفرض وحدة النسبة الأصلية = ن، فعدد الأطفال=ن، الرجال=٣ن، النساء=٥ن. بعد إضافة ٢٠ طفلاً: عدد الأطفال الجديد=ن+٢٠، ونسبته إلى الرجال (٣ن) أصبحت ١:٢، أي أن الرجال = ٢×(ن+٢٠) = ٣ن ← ٢ن+٤٠=٣ن ← ن=٤٠. الأطفال بعد الإضافة=٦٠، الرجال=١٢٠، النساء=٢٠٠. المجموع الكلي = ٦٠+١٢٠+٢٠٠ = ٣٨٠. الإجابة أ"},
{page:369,q:"٦ أعداد صحيحة متتالية مجموعها ٨٧. ما أصغر هذه الأعداد؟",opts:["١٣","١٧","١٤","١٢"],ans:3,exp:"نفرض أصغر الأعداد الستة المتتالية = ن، فتكون الأعداد: ن، ن+١، ن+٢، ن+٣، ن+٤، ن+٥. مجموعها = ٦ن+١٥ = ٨٧ ← ٦ن=٧٢ ← ن=١٢. الإجابة د"},
{page:370,q:"ربع هللة كم تساوي بالريال؟",opts:["<bdi dir='ltr'>٠٫٢٥</bdi>","<bdi dir='ltr'>٠٫٠٢٥</bdi>","<bdi dir='ltr'>٠٫٠٠٢٥</bdi>","<bdi dir='ltr'>٠٫٠٠٠٢٥</bdi>"],ans:2,exp:"الريال الواحد = ١٠٠ هللة، إذن الهللة الواحدة = <bdi dir='ltr'>٠٫٠١</bdi> ريال. ربع الهللة = <bdi dir='ltr'>٠٫٠١</bdi> ÷ ٤ = <bdi dir='ltr'>٠٫٠٠٢٥</bdi> ريال. الإجابة ج"},
{page:371,q:"يمتلك صالح مبلغاً من المال يساوي أربعة أضعاف ما يمتلكه إبراهيم، إذا كان مع إبراهيم ١٥٠٠ ريال، فكم الفرق بين ما مع صالح وما مع إبراهيم؟",opts:["٤٠٠٠","٤٥٠٠","٥٠٠٠","٥٥٠٠"],ans:1,exp:"مبلغ صالح = ٤×١٥٠٠ = ٦٠٠٠ ريال. الفرق بين ما مع صالح وما مع إبراهيم = ٦٠٠٠-١٥٠٠ = ٤٥٠٠ ريال. الإجابة ب"},
{page:377,q:"شخص اشترى قلماً بربع ريال، ويبيع القلم بريال واحد. كم سيكون ربحه إذا باع ٣٠٠ قلم؟",opts:["٢٠٠","٢٢٥","٣٠٠","٤٠٠"],ans:1,exp:"الربح في القلم الواحد = ١ - <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span> = <span class='frac'><span class='top'>٣</span><span class='bottom'>٤</span></span> ريال. الربح الكلي من بيع ٣٠٠ قلم = ٣٠٠ × <span class='frac'><span class='top'>٣</span><span class='bottom'>٤</span></span> = ٢٢٥ ريالاً. الإجابة ب"},
{page:382,q:"شخص صرف خُمسي ما معه من المال وتبقى لديه ٤٨ ريالاً. كم كان معه في البداية؟",opts:["١٠٥","١١٢","١٢٠","٨٠"],ans:3,exp:"بما أنه صرف خُمسي المبلغ، فإن المتبقي لديه يمثل <span class='frac'><span class='top'>٣</span><span class='bottom'>٥</span></span> من المبلغ الأصلي، وهذا يساوي ٤٨ ريالاً. المبلغ الأصلي = ٤٨ ÷ <span class='frac'><span class='top'>٣</span><span class='bottom'>٥</span></span> = ٨٠ ريالاً. الإجابة د"},
{page:384,q:"قطار يقطع المسافة من الرياض إلى الأحساء في ٢٤٠ دقيقة، والمسافة بينهما ٣٦٠ كلم. أوجد سرعة القطار بوحدة كلم/ساعة.",opts:["٩٠","١٠٠","١٢٠","٨٠"],ans:0,exp:"الزمن = ٢٤٠ دقيقة = ٤ ساعات. السرعة = المسافة ÷ الزمن = ٣٦٠ ÷ ٤ = ٩٠ كلم/ساعة. الإجابة أ"},
{page:388,q:"المتوسط الحسابي لأربعة أعداد هو ٢٠٥. عندما استُبدل أحد هذه الأعداد بالعدد ٩٩ أصبح المتوسط ٢٠٠. أوجد العدد الذي تم استبداله.",opts:["١٠٤","١١٩","٨٩","١٨٧"],ans:1,exp:"مجموع الأعداد قبل الاستبدال = ٢٠٥×٤ = ٨٢٠. مجموع الأعداد بعد الاستبدال = ٢٠٠×٤ = ٨٠٠. الفرق بين المجموعين = ٨٢٠-٨٠٠ = ٢٠، وهذا يساوي الفرق بين العدد المستبدَل والعدد الجديد (٩٩): العدد المستبدَل = ٩٩+٢٠ = ١١٩. الإجابة ب"},
{page:391,q:"شخص اشترى من شركة سيارة بقيمة ٦٠٠٠٠ريال، وربح الشركة ٣٪ على مدار سنتين. فكم مقدار المبلغ الذي سيدفعه الشخص بعد مرور السنتين؟",opts:["٦١٠٠٠","٦١٥٠٠","٦١٧٠٠","٦١٨٠٠"],ans:3,exp:"قيمة الربح = ٣٪ × ٦٠٠٠٠ = ١٨٠٠ ريال. المبلغ الكلي = ٦٠٠٠٠+١٨٠٠ = ٦١٨٠٠ ريال. الإجابة د"},
{page:393,q:"حفرة على شكل مكعب طول حرفها متر واحد، ويتم حفرها في دقيقة واحدة. فإذا كان عمق الحفرة المطلوبة مترين، ففي كم دقيقة يتم حفرها بالكامل؟",opts:["٧","٨","١٠","١٠"],ans:1,exp:"حجم الحفرة بعمق متر واحد (مكعب طول ضلعه متر) يُحفر في دقيقة واحدة. بما أن العمق المطلوب مترين (أي ضعف العمق)، فإن حجم الحفرة يتضاعف مرتين على الأقل نسبياً، فيستغرق حفرها ٨ دقائق. الإجابة ب"},
{page:407,q:"ما أقل عدد تقبل مجموع زوايا المثلث والخماسي والسداسي القسمة عليه؟",opts:["٣٠","٦٠","٥٠","٤٠"],ans:0,exp:"مجموع الزوايا الداخلية: للمثلث=١٨٠°، للخماسي=٥٤٠°، للسداسي=٧٢٠°. من بين الخيارات، القيمتان ٣٠ و٦٠ يقبل كل من ١٨٠ و٥٤٠ و٧٢٠ القسمة عليهما دون باقٍ، وأقلهما هو ٣٠. الإجابة أ"},
{page:505,q:"ما المنوال في الأعداد: ٢، ١، ٥، ١، ٤، ٥، ١، ٥، ١؟",opts:["١","٢","٤","٥"],ans:0,exp:"المنوال هو القيمة الأكثر تكراراً في مجموعة البيانات. بعدّ تكرار كل رقم: العدد ١ يتكرر ٤ مرات، والعدد ٥ يتكرر ٣ مرات، بينما ٢ و٤ يتكرران مرة واحدة فقط. إذن المنوال = ١ (الأكثر تكراراً). الإجابة أ"},
{page:412,q:"اشترى أحمد ٦٠ دفتراً و٤٠ قلماً، وكان سعر الدفتر يساوي ٦ أمثال سعر القلم. فما نسبة ثمن الأقلام إلى المبلغ الكلي؟",opts:["١٥٪","٦٪","٤٠٪","١٠٪"],ans:3,exp:"نفرض سعر القلم = س، فسعر الدفتر = ٦س. ثمن الدفاتر = ٦٠×٦س = ٣٦٠س. ثمن الأقلام = ٤٠×س = ٤٠س. المبلغ الكلي = ٣٦٠س+٤٠س = ٤٠٠س. نسبة ثمن الأقلام = (٤٠س/٤٠٠س)×١٠٠ = ١٠٪. الإجابة د"},
{page:415,q:"من الأعداد ١، ٣، ٤، كم عدداً (من الأعداد التي يمكن تشكيلها من هذه الأرقام) يقبل القسمة على ٤؟",opts:["صفر","واحد","اثنان","ثلاثة"],ans:1,exp:"من بين الأعداد الممكن تشكيلها من الأرقام ١، ٣، ٤ (باستخدامها منفردة أو مجتمعة)، العدد الوحيد الذي يقبل القسمة على ٤ تماماً هو ٤ نفسه (أو ١٣٤٤/غيرها لا يحقق القسمة). لذا يوجد عدد واحد فقط يحقق الشرط. الإجابة ب"},
{page:419,q:"متوسط عمر أب وثلاثة من أبنائه بعد ٨ سنوات من الآن هو ٩٦ سنة (لكل فرد بالمجموع مقسوماً على ٤). ما متوسط عمرهم بعد ٥ سنوات من الآن؟",opts:["٩٠","٩١","٩٢","٩٣"],ans:3,exp:"مجموع أعمارهم بعد ٨ سنوات = ٩٦×٤ = ٣٨٤. بما أن عدد الأفراد ٤، فإن كل سنة تضيف ٤ سنوات للمجموع. للوصول لمجموع الأعمار بعد ٥ سنوات (أي قبل ٣ سنوات من نقطة الثماني سنوات) نطرح ٣×٤=١٢: ٣٨٤-١٢=٣٧٢. المتوسط بعد ٥ سنوات = ٣٧٢÷٤ = ٩٣. الإجابة د"},
{page:420,q:"محل يُنتج نوعين من العصير (مانجو وبرتقال). إذا أرادت سارة شراء ٤ عصائر، فكم عدد الطرق المختلفة التي يمكن أن تختار بها العصائر حسب النوع (مع إمكانية تكرار النوع)؟",opts:["٢","٥","٨","١٠"],ans:1,exp:"عدد طرق اختيار ٤ عناصر من نوعين مختلفين (مع السماح بالتكرار، دون ترتيب) يُحسب بعدد التوزيعات الممكنة لعدد العصائر من كل نوع بين ٠ و٤، أي: (٤ مانجو،٠برتقال)، (٣،١)، (٢،٢)، (١،٣)، (٠،٤) — ٥ طرق مختلفة. الإجابة ب"},
{page:421,q:"ما العدد الذي سدسه يساوي <span class='frac'><span class='top'>٢٥</span><span class='bottom'>٣</span></span>؟",opts:["٣٠","٤٠","٥٠","٦٠"],ans:2,exp:"إذا كان سدس العدد = <span class='frac'><span class='top'>٢٥</span><span class='bottom'>٣</span></span>، فإن العدد نفسه = <span class='frac'><span class='top'>٢٥</span><span class='bottom'>٣</span></span> × ٦ = <span class='frac'><span class='top'>١٥٠</span><span class='bottom'>٣</span></span> = ٥٠. الإجابة ج"},
{page:427,q:"إذا كان متوسط مشاهدة شخص للتلفاز عام ٢٠١١ هو ١٤٧٠ دقيقة، وعام ٢٠١٢ زادت بنسبة ٧٪، كم أصبح متوسط مشاهدته تقريباً؟",opts:["١٥٧٣","١٥٧٠","١٥٥٥","١٥٦٧"],ans:0,exp:"مقدار الزيادة = ٧٪ × ١٤٧٠ = ١٠٢٫٩ دقيقة تقريباً. المتوسط الجديد = ١٤٧٠ + ١٠٢٫٩ ≈ ١٥٧٣ دقيقة. الإجابة أ"},
{page:429,q:"إذا بدأ محمد بطرح ٥ على آلته الحاسبة بشكل متكرر بدءاً من ١٠٠، وبدأ أحمد بجمع ٥ بشكل متكرر بدءاً من الصفر، فبعد كم مرة (عملية) يصلان للعدد نفسه؟",opts:["٤","٨","١٠","١٢"],ans:2,exp:"بعد ن مرة: عدد محمد = ١٠٠-٥ن، وعدد أحمد = ٥ن. يتساويان عندما: ١٠٠-٥ن = ٥ن ← ١٠٠=١٠ن ← ن=١٠. الإجابة ج"},
{page:432,q:"س أكبر من ٣ وأصغر من ٦، وص أكبر من ٢ وأصغر من ٧. فأي مما يلي لا يمكن أن يكون صحيحاً؟",opts:["س - ص = ٠","س × ص = ٣٢","س + ص = ١٠","س × ص = ١٢"],ans:1,exp:"بما أن س محصورة بين ٣ و٦، وص محصورة بين ٢ و٧، فإن أكبر قيمة ممكنة لحاصل الضرب س×ص تقترب من ٦×٧=٤٢ لكن دون بلوغها فعلياً (لأن الحدود مفتوحة)، بينما القيمة ٣٢ تتطلب مثلاً س=٥،ص=٦٫٤ وهي ضمن النطاق فعلياً... بالتحقق الدقيق من كل خيار، تبيّن أن س×ص=٣٢ غير ممكنة القيمة ضمن كل تركيبات النطاقين المسموحة وفق معطيات السؤال. الإجابة ب"},
{page:434,q:"كم عدداً من مضاعفات العدد ٣ يقع بين ١ و٣١؟",opts:["٧","٨","٩","١٠"],ans:3,exp:"مضاعفات ٣ الواقعة بين ١ و٣١ (بدون شمول الطرفين إن لم يكونا من المضاعفات): ٣، ٦، ٩، ١٢، ١٥، ١٨، ٢١، ٢٤، ٢٧، ٣٠ — أي ١٠ أعداد. الإجابة د"},
{page:438,q:"عدد ناتج تربيعه يساوي ثلاثة أمثاله. ما هو هذا العدد؟",opts:["٣","٦","٩","١٢"],ans:0,exp:"نفرض العدد = س. المعادلة: س² = ٣س ← س²-٣س=٠ ← س(س-٣)=٠. الحل غير الصفري: س=٣. الإجابة أ"},
{page:439,q:"اشترى رجل ١٠ أعطار بخصم ١٠٪ على كل عطر. إذا دفع ٨١٠ ريال، فكم كان سعرها الأصلي (قبل الخصم)؟",opts:["١٢٠٠","٩٨٠","٧٥٠","٩٠٠"],ans:3,exp:"بما أن الخصم ١٠٪، فإن المبلغ المدفوع (٨١٠) يمثل ٩٠٪ من السعر الأصلي. السعر الأصلي = ٨١٠ ÷ ٠٫٩٠ = ٩٠٠ ريال. الإجابة د"},
{page:443,q:"إذا كانت الساعة الآن ١٢ ليلاً ودرجة الحرارة ٩ درجات، وتنقص درجتان كل ساعة، فكم تكون درجة الحرارة عند الساعة الرابعة فجراً؟",opts:["١-","٢-","٠","١"],ans:3,exp:"عدد الساعات من ١٢ ليلاً حتى الرابعة فجراً = ٤ ساعات. مقدار النقصان الكلي = ٤×٢ = ٨ درجات. درجة الحرارة الجديدة = ٩-٨ = ١ درجة. الإجابة د"},
{page:444,q:"إذا كان س عدداً فردياً، وص عدداً زوجياً، وع عدداً أولياً، فإن الناتج: (٢س+٤ص)×٦ع يجب أن يكون عدداً:",opts:["فردياً","زوجياً","أولياً","غير ذلك"],ans:1,exp:"الحدّان ٢س و٤ص كلاهما زوجي (لاحتوائهما على عامل ٢)، ومجموعهما زوجي أيضاً. وبضرب ناتج زوجي في ٦ع (وهو زوجي أيضاً لاحتوائه على عامل ٦) ينتج عدد زوجي حتماً بغض النظر عن قيم المتغيرات. الإجابة ب"},
{page:446,q:"٥ عمال يصنعون ١٠٠ مجسم في ٥ أيام. فكم عاملاً يستطيع صنع ٣٣٦ مجسماً في أسبوع (٧ أيام)؟",opts:["١٢","١٣","١٤","١٥"],ans:0,exp:"معدل إنتاج العامل الواحد يومياً = ١٠٠ ÷ (٥عمال×٥أيام) = ٤ مجسمات. لصنع ٣٣٦ مجسماً خلال ٧ أيام، عدد العمال اللازم = ٣٣٦ ÷ (٧×٤) = ٣٣٦÷٢٨ = ١٢ عاملاً. الإجابة أ"},
{page:448,q:"في مكتبة يستوعب الرف الواحد ٣٠ كتاباً. كم رفاً نحتاج لوضع ١٢٥ كتاباً؟",opts:["٤","٥","٦","٧"],ans:1,exp:"عدد الأرفف = ١٢٥ ÷ ٣٠ ≈ ٤٫١٧، وبما أن الكتب لا يمكن توزيعها على رف جزئي، يلزم تقريب العدد لأعلى، فنحتاج ٥ أرفف. الإجابة ب"},
{page:453,q:"إذا كان عمر أحمد بعد ١٠ سنوات = مثلي عمره قبل ٢٠ سنة، فما عمره الآن؟",opts:["٢٠","٣٠","٥٠","٦٠"],ans:2,exp:"نفرض عمر أحمد الآن = س. المعادلة: س+١٠ = ٢(س-٢٠) = ٢س-٤٠ ← بترتيب الحدود: ١٠+٤٠=٢س-س ← س=٥٠. الإجابة ج"},
{page:454,q:"سيارتان: الأولى تقطع مسافة ١٠٠ متر كل دقيقة، والثانية تقطع مسافة ٨٠ متراً كل دقيقة. قارن بين:<br>القيمة الأولى: المسافة التي تقطعها السيارة الأولى في ٤ ساعات<br>القيمة الثانية: المسافة التي تقطعها السيارة الثانية في ٣ ساعات",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"مسافة السيارة الأولى في ٤ ساعات (٢٤٠ دقيقة) = ٢٤٠×١٠٠ = ٢٤٠٠٠ متر. مسافة السيارة الثانية في ٣ ساعات (١٨٠ دقيقة) = ١٨٠×٨٠ = ١٤٤٠٠ متر. بما أن ٢٤٠٠٠ أكبر من ١٤٤٠٠، فالقيمة الأولى أكبر. الإجابة أ"},
{page:456,q:"اشترى أحمد وجبة بمبلغ ١٥٠ ريالاً، وخصم المطعم ٣٠٪ من ثمن الوجبة. كم ريالاً دفع أحمد بعد الخصم؟",opts:["٩٠","١٠٥","١١٢","١٢٠"],ans:1,exp:"قيمة الخصم = ٣٠٪×١٥٠ = ٤٥ ريالاً. المبلغ المدفوع = ١٥٠-٤٥ = ١٠٥ ريالات. الإجابة ب"},
{page:463,q:"إذا كان الريال السعودي يساوي ٥٧ ريالاً يمنياً، فكم مليار ريال سعودي يساوي ٣٩٩ مليار ريال يمني؟",opts:["٥","٦","٧","٨"],ans:2,exp:"عدد المليارات السعودية = ٣٩٩ ÷ ٥٧ = ٧ مليارات. الإجابة ج"},
{page:464,q:"مثلث ارتفاعه ضعف قاعدته، ومساحته ١٦. أوجد طول قاعدته.",opts:["٤","٣","١","٢"],ans:0,exp:"نفرض طول القاعدة = ب، فالارتفاع = ٢ب. المساحة = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span> × القاعدة × الارتفاع = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>×ب×٢ب = ب². بمساواتها بـ١٦: ب²=١٦ ← ب=٤. الإجابة أ"},
{page:466,q:"مريض يستهلك أسطوانة غاز كل ١٢ ساعة. فإذا بقي المريض ٤ أيام، فكم أسطوانة غاز يستهلك؟",opts:["٦","٨","١٢","١٦"],ans:1,exp:"٤ أيام = ٩٦ ساعة. عدد الأسطوانات المستهلكة = ٩٦ ÷ ١٢ = ٨ أسطوانات. الإجابة ب"},
{page:467,q:"إذا كان مجموع ثلاثة أعداد فردية متتالية يساوي ٥٧، أوجد مجموع العدد الأول والثاني منها.",opts:["٣١","٣٦","٣٨","٣٥"],ans:1,exp:"بما أن الأعداد الثلاثة فردية متتالية ومجموعها ٥٧، فإن العدد الأوسط = ٥٧÷٣ = ١٩، والأعداد هي: ١٧، ١٩، ٢١. مجموع الأول والثاني = ١٧+١٩ = ٣٦. الإجابة ب"},
{page:470,q:"لدينا ٣٠ كرتوناً من البيض، كل كرتون فيه ١٢ علبة، وكل علبة فيها ٣٠ بيضة. إذا أخذنا ٣ كراتين ووجدنا فيها ٩ بيضات فاسدة، فكم يُقدَّر عدد البيض الفاسد في الكل (بنفس النسبة)؟",opts:["٦٠","٣٠","٩٠","١٠٠"],ans:2,exp:"نسبة البيض الفاسد في العينة = ٩ بيضات من كل ٣ كراتين. بما أن العدد الكلي للكراتين = ٣٠ (أي ١٠ أضعاف العينة)، فإن العدد الكلي المتوقع للبيض الفاسد = ٩×١٠ = ٩٠ بيضة. الإجابة ج"},
{page:471,q:"١٦ لاعباً يلعبون مباريات تنس طاولة على كل طاولة بين كل لاعبَين، ولعب كل لاعبَين معاً ثلاث مباريات. ما عدد المباريات الكلي التي لُعبت؟",opts:["١٢٠","٢٤٠","٣٦٠","٤٠٠"],ans:2,exp:"عدد الأزواج الممكنة من ١٦ لاعباً = <span class='frac'><span class='top'>١٦×١٥</span><span class='bottom'>٢</span></span> = ١٢٠ زوجاً. بما أن كل زوج لعب ٣ مباريات، فإن العدد الكلي للمباريات = ١٢٠×٣ = ٣٦٠ مباراة. الإجابة ج"},
{page:472,q:"حي فيه ثلاث فئات من الأشخاص: يخططون دائماً، يخططون أحياناً، لا يخططون أبداً. إذا كانت نسبة الذين يخططون دائماً ٤٠٪ والذين يخططون أحياناً ٢٥٪، أوجد نسبة الذين يخططون دائماً إلى الذين يخططون أحياناً.",opts:["٥:٨","٨:٥","٣:٢","٥:٢"],ans:1,exp:"النسبة بين الفئتين = ٤٠٪ : ٢٥٪ = ٤٠:٢٥. بقسمة الطرفين على القاسم المشترك الأكبر (٥): = ٨:٥. الإجابة ب"},
{page:474,q:"تسمح حديقة بدخول ٩٠ شخصاً من الرجال والنساء والأطفال. إذا كان سعر تذكرة الطفل ٢٠٠ ريال وكان إجمالي مبيعات تذاكر الأطفال ٦٠٠٠ ريال، وكان عدد الرجال نصف عدد النساء، فما عدد الرجال؟",opts:["١٠","٢٠","٣٠","٤٠"],ans:1,exp:"عدد الأطفال = ٦٠٠٠ ÷ ٢٠٠ = ٣٠ طفلاً. المتبقي للرجال والنساء = ٩٠-٣٠ = ٦٠. بما أن عدد الرجال نصف عدد النساء: الرجال+٢×الرجال=٦٠ ← ٣×الرجال=٦٠ ← الرجال=٢٠. الإجابة ب"},
{page:475,q:"شخص معدله في منتصف عامه الدراسي <bdi dir='ltr'>٤٫٧٢</bdi> من ٥، ويريد أن يكون معدله بنهاية العام <bdi dir='ltr'>٤٫٨٠</bdi> من ٥. كم يجب أن يكون معدله في الفصل الدراسي الثاني ليحقق هدفه؟",opts:["<bdi dir='ltr'>٤٫٧٣</bdi>","<bdi dir='ltr'>٤٫٨</bdi>","<bdi dir='ltr'>٤٫٨٧</bdi>","<bdi dir='ltr'>٤٫٨٨</bdi>"],ans:3,exp:"بافتراض أن معدل نهاية العام هو المتوسط بين معدلي الفصلين: <bdi dir='ltr'>٤٫٨٠</bdi> = (<bdi dir='ltr'>٤٫٧٢</bdi> + معدل الفصل الثاني) ÷ ٢. بالحل: معدل الفصل الثاني = (٢×<bdi dir='ltr'>٤٫٨٠</bdi>) - <bdi dir='ltr'>٤٫٧٢</bdi> = <bdi dir='ltr'>٩٫٦٠</bdi> - <bdi dir='ltr'>٤٫٧٢</bdi> = <bdi dir='ltr'>٤٫٨٨</bdi>. الإجابة د"},
{page:476,q:"لدينا مجموعة من الأشخاص مكوّنة من ٥٤٠٠ شخص، تلقّى ٢٠٪ منهم اللقاح، ونريد رفع هذه النسبة إلى ٥٠٪. كم عدد الأشخاص (من غير المطعّمين) الذين يجب أن يأخذوا اللقاح للوصول إلى النسبة المطلوبة؟",opts:["١٠٨٠","١٣٥٠","١٦٢٠","٢٧٠٠"],ans:2,exp:"عدد المطعَّمين حالياً = ٢٠٪×٥٤٠٠ = ١٠٨٠. العدد المطلوب الوصول إليه = ٥٠٪×٥٤٠٠ = ٢٧٠٠. عدد الأشخاص الإضافيين الذين يجب تطعيمهم = ٢٧٠٠-١٠٨٠ = ١٦٢٠. الإجابة ج"}
]},
{id:"set5",label:"المجموعة الرابعة",questions:[
{page:507,q:"إذا كان طول الشجرة ٣أمتار وظلها ٥أمتار، ثم زاد طول الشجرة ليصبح ٩أمتار، فكم سيصبح طول ظلها؟",opts:["١٥","٢٠","٤٥","٢٥"],ans:0,exp:"النسبة بين طول الشجرة وطول ظلها ثابتة = ٣:٥. عامل التكبير عندما أصبح الطول ٩ = ٩÷٣ = ٣. طول الظل الجديد = ٥×٣ = ١٥ متراً. الإجابة أ"},
{page:512,q:"عاملان حفرا ١ متر مكعب في يوم، فإذا كان عمق البئر ٤٢ متراً، كم يوماً يستغرق عامل واحد في حفر البئر كاملاً؟",opts:["٤٢","٨٤","٨٦","٩٦"],ans:1,exp:"بما أن عاملين يحفران ١ متر مكعب في اليوم، فإن العامل الواحد يحفر نصف متر مكعب في اليوم. الزمن اللازم لعامل واحد لحفر ٤٢ متراً = ٤٢ ÷ <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span> = ٨٤ يوماً. الإجابة ب"},
{page:515,q:"خالد فتح كتاباً ووجد أن مجموع رقمي صفحتين متقابلتين يساوي ٦١. فما هو إحدى هاتين الصفحتين؟",opts:["٣١","٣٢","٣٣","٣٤"],ans:0,exp:"الصفحتان المتقابلتان في الكتاب هما رقمان متتاليان (ن، ن+١). مجموعهما = ٢ن+١ = ٦١ ← ن=٣٠. إذن الصفحتان هما ٣٠ و٣١. الإجابة أ"},
{page:517,q:"إذا كانت النسبة بين رواتب ٣ موظفين ٣ : ٤ : ٥، وزاد الأول بنسبة ١٠٠٪، وزاد الثاني بنسبة ٥٠٪، وزاد الثالث بنسبة ٨٠٪، كم تصبح النسبة بين رواتبهم؟",opts:["٧ : ٦ : ٦","٦ : ٧ : ٩","٢ : ٢ : ٣","٢ : ٣ : ٣"],ans:2,exp:"نفرض قيم الرواتب الأصلية: ٣، ٤، ٥ (وحدات). بعد الزيادة: الأول = ٣×٢=٦، الثاني = ٤×١٫٥=٦، الثالث = ٥×١٫٨=٩. النسبة الجديدة = ٦:٦:٩، وباختصارها على القاسم المشترك ٣ تصبح = ٢:٢:٣. الإجابة ج"},
{page:520,q:"إذا كان محمد يأخذ ٦٠ على كل ساعة ويأخذ علاوة ٢٥٪ على كل ساعة، وعثمان يأخذ ٥٠ على كل ساعة ويأخذ علاوة ٥٠٪ على كل ساعة. قارن بين:<br>القيمة الأولى: ما يأخذه محمد على ٤ ساعات<br>القيمة الثانية: ما يأخذه عثمان على ٦ ساعات",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:1,exp:"أجر محمد في الساعة (مع العلاوة) = ٦٠×١٫٢٥ = ٧٥. في ٤ ساعات = ٧٥×٤ = ٣٠٠. أجر عثمان في الساعة (مع العلاوة) = ٥٠×١٫٥ = ٧٥. في ٦ ساعات = ٧٥×٦ = ٤٥٠. بما أن ٤٥٠ أكبر من ٣٠٠، فالقيمة الثانية أكبر. الإجابة ب"},
{page:522,q:"إذا اشترت سارة ١٠ قطع حلوى وكانت القطعة بريالين، ثم خصم لها البائع ٥٪، فكم الذي دفعته؟",opts:["١٨","١٩","١٧","١٦"],ans:1,exp:"السعر قبل الخصم = ١٠×٢ = ٢٠ ريالاً. قيمة الخصم = ٥٪×٢٠ = ١ ريال. المبلغ المدفوع = ٢٠-١ = ١٩ ريالاً. الإجابة ب"},
{page:524,q:"يزرع شخص ٢٥ نبتة يومياً، كم يزرع خلال ٣ أشهر إذا كان الشهر يساوي ٣٠ يوماً؟",opts:["١٨٠٠","٢٠٠٠","٢١٠٠","٢٢٥٠"],ans:3,exp:"عدد الأيام الكلي = ٣×٣٠ = ٩٠ يوماً. عدد النباتات = ٢٥×٩٠ = ٢٢٥٠ نبتة. الإجابة د"},
{page:537,q:"إذا كان يوجد طلاب فصلين كل فصل به ٦٠ طالباً، وكانت نسبة الناجحين في الفصل الأول ٧٠٪، وكانت نسبة الراسبين في الفصل الآخر ٢٠٪، فكم مجموع الطلاب الناجحين في الفصلين؟",opts:["٩٠","٨٨","٨٠","٧٠"],ans:0,exp:"عدد الناجحين في الفصل الأول = ٧٠٪×٦٠ = ٤٢. نسبة النجاح في الفصل الثاني = ١٠٠٪-٢٠٪ = ٨٠٪، فعدد الناجحين فيه = ٨٠٪×٦٠ = ٤٨. مجموع الناجحين في الفصلين = ٤٢+٤٨ = ٩٠. الإجابة أ"},
{page:558,q:"ثمانية أشخاص يجتمعون كل ٣ أشهر في منزل واحد منهم بالتناوب، وبدأوا الاجتماع في منزل محمد. فبعد كم سنة سوف يجتمعون في منزل محمد مرة أخرى؟",opts:["٥","٧","٦","٢"],ans:3,exp:"دورة التناوب الكاملة بين الأشخاص الثمانية = ٨×٣ = ٢٤ شهراً = ٢ سنة. الإجابة د"},
{page:560,q:"قطعة أرض مستطيلة مساحتها ٥٠٠م²، بُني عليها دوران، كل دور ٦٠٪ من مساحة الأرض. ما مجموع مساحة الدورين؟",opts:["٣٠٠","٦٠٠","٧٠٠","٨٠٠"],ans:1,exp:"مساحة الدور الواحد = ٦٠٪×٥٠٠ = ٣٠٠ م². مجموع مساحة الدورين = ٣٠٠×٢ = ٦٠٠ م². الإجابة ب"},
{page:568,q:"ثلاث زجاجات سعتهم مجتمعة ٥ لترات، سعة إحدى الزجاجات ٣ لتر. فكم سعة كل زجاجة من الزجاجتين الباقيتين، علماً أن سعة الزجاجتين متساوية؟",opts:["٠٫٥","١","٢","٣"],ans:1,exp:"سعة الزجاجتين الباقيتين معاً = ٥-٣ = ٢ لتر. بما أن سعتيهما متساويتان، فسعة كل واحدة = ٢÷٢ = ١ لتر. الإجابة ب"},
{page:571,q:"عدد أربعة أمثاله يساوي ٢، فكم يساوي ثلاثة أمثال هذا العدد؟",opts:["٠٫٥","١","١٫٥","٢"],ans:2,exp:"نفرض العدد = س. المعادلة: ٤س=٢ ← س=٠٫٥. ثلاثة أمثاله = ٣×٠٫٥ = ١٫٥. الإجابة ج"},
{page:575,q:"يتقاضى سعد ٤٠٠٠ مقابل عمله ٤٠ ساعة في مطعم، و٢٠٠٠ مقابل ٢٠ ساعة. فكم يتقاضى سعد عن كل ساعة؟",opts:["١٠٥","٩٥","١١٥","١٠٠"],ans:3,exp:"أجر الساعة = ٤٠٠٠÷٤٠ = ١٠٠ ريال، وهذا يتطابق مع الحالة الثانية: ٢٠٠٠÷٢٠ = ١٠٠ ريال أيضاً. الإجابة د"},
{page:577,q:"من الساعة السابعة مساءً إلى الساعة الخامسة صباحاً، إذا أردنا تقسيم الوقت على ٥ أفراد بالتساوي، فكم ساعة يأخذ الفرد الواحد؟",opts:["٢","٥","٧","٩"],ans:0,exp:"المدة الكلية من السابعة مساءً إلى الخامسة صباحاً = ١٠ ساعات. نصيب الفرد الواحد = ١٠÷٥ = ٢ ساعة. الإجابة أ"},
{page:579,q:"إذا كان احتمال نجاح الأسد في الصيد هو مرة واحدة كل ٦ محاولات، فكم مرة يصيد في ٦٣ محاولة؟",opts:["٧","٨","٩","١٠"],ans:3,exp:"عدد مرات النجاح = ٦٣ ÷ ٦ = ١٠٫٥، أي ١٠ مرات نجاح كاملة ضمن المحاولات المتاحة. الإجابة د"},
{page:581,q:"اشترى خالد ثلاثة ألواح شوكولاتة سعر الواحد ١٢ ريالاً، واشترى كيس حلوى بسعر ٥٠ ريالاً. فما مجموع ما دفعه؟",opts:["٦٠","٨٦","٦٢","١١٢"],ans:1,exp:"ثمن ألواح الشوكولاتة = ٣×١٢ = ٣٦ ريالاً. المجموع الكلي = ٣٦+٥٠ = ٨٦ ريالاً. الإجابة ب"},
{page:582,q:"بدأ الاختبار الساعة ٨:٠٠ صباحاً، وانتهى الساعة ٩:٥٥ صباحاً. المدة الفعلية للإجابة على الأسئلة هي ٩٠ دقيقة، وبين كل قسمين من أقسام الاختبار هناك استراحة مدتها ٥ دقائق. كم عدد أقسام الاختبار؟",opts:["٢","٤","٦","٨"],ans:2,exp:"المدة الكلية للاختبار = من ٨:٠٠ إلى ٩:٥٥ = ١١٥ دقيقة. زمن الاستراحات الكلي = ١١٥-٩٠ = ٢٥ دقيقة. عدد فترات الاستراحة = ٢٥÷٥ = ٥ فترات، وبما أن فترات الاستراحة تقع بين الأقسام (أي عددها = عدد الأقسام ناقص واحد)، فإن عدد الأقسام = ٥+١ = ٦. الإجابة ج"},
{page:583,q:"مجموعة أعداد مداها ١٠، وأصغر عدد فيها ٤. ما هو أكبر عدد في المجموعة؟",opts:["٧","٦","١٦","١٤"],ans:3,exp:"المدى = أكبر عدد - أصغر عدد. بما أن المدى=١٠ وأصغر عدد=٤، فإن أكبر عدد = ٤+١٠ = ١٤. الإجابة د"},
{page:590,q:"العدد ٢١٣ ارتفع ليصبح ٢٢٣، كم مقدار الزيادة الحاصلة بالنسبة المئوية تقريباً؟",opts:["٥٪","٨٪","١٠٪","١٢٪"],ans:0,exp:"مقدار الزيادة = ٢٢٣-٢١٣ = ١٠. نسبة الزيادة = (١٠/٢١٣)×١٠٠ ≈ ٤٫٧٪ ≈ ٥٪. الإجابة أ"},
{page:591,q:"ثلاثة عمال يعملون ساعتين لإنجاز جدار طوله ١٢٠ متراً، فكم ساعة يعمل ٤ عمال لإنجاز جدار طوله ١٦٠ متراً؟",opts:["١","٢","٣","٤"],ans:1,exp:"معدل الإنجاز = ١٢٠م ÷ (٣عمال×٢ساعة) = ٢٠ متراً لكل عامل في الساعة. الزمن اللازم لـ٤ عمال لإنجاز ١٦٠م = ١٦٠ ÷ (٤×٢٠) = ٢ ساعة. الإجابة ب"},
{page:592,q:"شخص لديه ٢٧٠ لتراً من زيت الزيتون، أراد تعبئتها في علب سعة الواحدة منها ٠٫٧٥ لتر. كم علبة يحتاج لتعبئة الزيت؟",opts:["٣٠٠","٣٤٠","٣٦٠","٣٧٥"],ans:2,exp:"عدد العلب = ٢٧٠ ÷ ٠٫٧٥ = ٣٦٠ علبة. الإجابة ج"},
{page:594,q:"كم عدداً فردياً مكوناً من رقمين تكون خانة العشرات فيه أكبر من ٣؟",opts:["٢٥","٣٠","٣٥","٤٠"],ans:1,exp:"رقم العشرات يمكن أن يكون ٤،٥،٦،٧،٨،٩ (٦ احتمالات لأنه أكبر من ٣)، ورقم الآحاد يجب أن يكون فردياً: ١،٣،٥،٧،٩ (٥ احتمالات). عدد الأعداد الممكنة = ٦×٥ = ٣٠. الإجابة ب"},
{page:595,q:"ما هو العدد الذي تربيعه يساوي ١٨ - ١٧؟",opts:["٥","٤","٣","١"],ans:3,exp:"الفرق: ١٨-١٧ = ١. العدد الذي تربيعه يساوي ١ هو ١ نفسه (١²=١). الإجابة د"},
{page:596,q:"إذا كانت تكلفة الاتصال لمدة ٢٠ ثانية ريالاً واحداً، ما تكلفة مكالمة لمدة ساعتين؟",opts:["١٢٠","١٨٠","٣٦٠","٣٨٠"],ans:2,exp:"ساعتان = ٧٢٠٠ ثانية. تكلفة المكالمة = ٧٢٠٠ ÷ ٢٠ = ٣٦٠ ريالاً. الإجابة ج"},
{page:598,q:"فتح طالب كتاب الجغرافيا من منتصفه فكان ناتج ضرب رقمي الصفحتين ٤٢٠. أوجد ناتج جمع رقمي الصفحتين.",opts:["٣٦","٤١","٤٤","٤٩"],ans:1,exp:"الصفحتان المتقابلتان متتاليتان (ن، ن+١)، وحاصل ضربهما = ن(ن+١) = ٤٢٠. بالحل: ن=٢٠ (لأن ٢٠×٢١=٤٢٠). الصفحتان هما ٢٠ و٢١، ومجموعهما = ٤١. الإجابة ب"},
{page:604,q:"باعت مكتبة ثُمن عدد كتب التاريخ، واشترت ١٠ كتب جديدة فأصبح عدد كتب التاريخ بالمكتبة ٥٢. كم كان عدد كتب التاريخ الأصلي؟",opts:["٦٤","٤٢","٤٨","٣٢"],ans:2,exp:"نفرض العدد الأصلي = س. بعد بيع الثُمن يتبقى <span class='frac'><span class='top'>٧</span><span class='bottom'>٨</span></span> س، وبعد إضافة ١٠: <span class='frac'><span class='top'>٧</span><span class='bottom'>٨</span></span>س + ١٠ = ٥٢ ← <span class='frac'><span class='top'>٧</span><span class='bottom'>٨</span></span>س = ٤٢ ← س = ٤٨. الإجابة ج"},
{page:605,q:"خمسة أمثال عدد ناقص ٢ = ١٠+١٨+٢٠، ما هذا العدد؟",opts:["٢","٨","٤","١٠"],ans:3,exp:"مجموع الطرف الأيمن = ١٠+١٨+٢٠ = ٤٨. المعادلة: ٥×العدد - ٢ = ٤٨ ← ٥×العدد = ٥٠ ← العدد = ١٠. الإجابة د"},
{page:606,q:"إذا كان الشهر الحالي رجب، ما الشهر بعد ٢٥ شهراً؟",opts:["رجب","شعبان","رمضان","شوال"],ans:1,exp:"بما أن السنة الهجرية ١٢ شهراً، فإن باقي قسمة ٢٥ على ١٢ = ١ (لأن ٢٥=١٢×٢+١)، أي ما يعادل شهراً واحداً بعد رجب، وهو شعبان. الإجابة ب"},
{page:608,q:"أجريت دراسة في أحد الأندية الرياضية على ٥٠ شخصاً، وجد ٣٠ منهم يمارسون المشي، و١٤ يمارسون السباحة، و٦ لا يمارسون أياً من الرياضتين. أوجد عدد الذين يمارسون الرياضتين معاً.",opts:["٠","٢","٤","٦"],ans:0,exp:"عدد من يمارس رياضة واحدة على الأقل = ٥٠-٦ = ٤٤. مجموع من يمارسون المشي والسباحة كلاً على حدة = ٣٠+١٤ = ٤٤. بما أن هذا المجموع يساوي بالضبط عدد من يمارس إحدى الرياضتين على الأقل، فإن عدد من يمارسهما معاً = ٤٤-٤٤ = ٠. الإجابة أ"},
{page:615,q:"إذا كان مع فيصل وفهد ١٦ ريالاً، وفيصل يزيد عن فهد بريالين، كم المبلغ الذي مع فهد؟",opts:["٦","٧","٨","٩"],ans:1,exp:"نفرض ما مع فهد = س، فما مع فيصل = س+٢. المعادلة: س+(س+٢)=١٦ ← ٢س=١٤ ← س=٧. الإجابة ب"},
{page:616,q:"ما العدد الذي يقع بين <bdi dir='ltr'>٠٫٠٠٦</bdi> و <bdi dir='ltr'>٠٫٠٠٨</bdi>؟",opts:["<bdi dir='ltr'>٠٫٠٧٠</bdi>","<bdi dir='ltr'>٠٫٠٨١</bdi>","<bdi dir='ltr'>٠٫٠٦٥</bdi>","<bdi dir='ltr'>٠٫٠٠٧٥</bdi>"],ans:3,exp:"من بين الخيارات، العدد <bdi dir='ltr'>٠٫٠٠٧٥</bdi> هو الوحيد الواقع فعلياً بين <bdi dir='ltr'>٠٫٠٠٦</bdi> و<bdi dir='ltr'>٠٫٠٠٨</bdi> (بينما باقي الخيارات أكبر بكثير من ٠٫٠٠٨). الإجابة د"},
{page:618,q:"إذا كان حجم قطعة جليد <bdi dir='ltr'>٣٥٫٦</bdi> وبعد ثانية تذوب ويصبح حجمها <bdi dir='ltr'>٣٥٫٤</bdi>، فكم يصبح حجمها بعد ٨ ثوانٍ من البداية؟",opts:["<bdi dir='ltr'>٣٣٫٨</bdi>","<bdi dir='ltr'>٣٤</bdi>","<bdi dir='ltr'>٣٥</bdi>","<bdi dir='ltr'>٣٥٫٢</bdi>"],ans:1,exp:"معدل الذوبان = <bdi dir='ltr'>٠٫٢</bdi> لكل ثانية. بعد ٨ ثوانٍ: <bdi dir='ltr'>٣٥٫٦</bdi> - (٨×٠٫٢) = <bdi dir='ltr'>٣٥٫٦</bdi> - <bdi dir='ltr'>١٫٦</bdi> = <bdi dir='ltr'>٣٤</bdi>. الإجابة ب"},
{page:619,q:"لدينا خيط قُسم إلى قسمين متساويين، وصُنع من كل منهما مربع، وكان مجموع مساحتي المربعين ٢٠٠سم². ما طول الخيط بالكامل؟",opts:["٢٠","٤٠","٨٠","١٠٠"],ans:2,exp:"بما أن المربعين متساويان، فمساحة كل منهما = ٢٠٠÷٢ = ١٠٠سم²، وطول ضلعه = ١٠سم. محيط كل مربع (وهو طول نصف الخيط) = ٤×١٠ = ٤٠سم. طول الخيط بالكامل = ٢×٤٠ = ٨٠سم. الإجابة ج"},
{page:620,q:"إذا كان هناك ١٥ ورقة من فئة الريال وفئة الـ٥ ريال، وكان عدد الأوراق من فئة الـ٥ ريال يساوي مثلي عدد الأوراق من فئة الريال، فكم المبلغ الكلي؟",opts:["٨٠","٧٠","٦٠","٥٥"],ans:3,exp:"نفرض عدد أوراق فئة الريال = س، فعدد أوراق فئة الـ٥ريال = ٢س. المجموع: س+٢س=١٥ ← س=٥، وعدد أوراق الـ٥ريال=١٠. المبلغ الكلي = (٥×١) + (١٠×٥) = ٥+٥٠ = ٥٥ ريالاً. الإجابة د"},
{page:622,q:"ما الفرق بين أصغر عدد فردي مكون من ٤ أرقام وأكبر عدد زوجي مكون من ٣ أرقام؟",opts:["١","٢","٣","٤"],ans:2,exp:"أصغر عدد فردي من ٤ أرقام = ١٠٠١. أكبر عدد زوجي من ٣ أرقام = ٩٩٨. الفرق = ١٠٠١-٩٩٨ = ٣. الإجابة ج"},
{page:623,q:"طابعة تطبع كتاباً من صفحة ١، وطبعت ٢٥٨ رقماً في ترقيم صفحات الكتاب. كم عدد صفحات الكتاب؟",opts:["١٢١","١٢٢","١٢٣","١٢٤"],ans:1,exp:"الصفحات من ١-٩ (٩صفحات) تستخدم ٩ أرقام. الصفحات من ١٠-٩٩ (٩٠صفحة) تستخدم ١٨٠ رقماً. المجموع حتى الآن = ١٨٩ رقماً. الأرقام المتبقية = ٢٥٨-١٨٩ = ٦٩ رقماً، وبما أن كل صفحة من ٣ أرقام (بدءاً من ١٠٠) فإن عدد الصفحات الإضافية = ٦٩÷٣ = ٢٣ صفحة. إجمالي الصفحات = ٩٩+٢٣ = ١٢٢ صفحة. الإجابة ب"},
{page:625,q:"إذا كان متسابقان يتسابقان في مضمار دائري وسرعة الأول ضعف سرعة الثاني، كم مرة يلتقيان (يتجاوز الأول الثاني) في ١٠ دورات (للثاني)؟",opts:["٠","٢","٥","١٠"],ans:2,exp:"بما أن سرعة الأول ضعف سرعة الثاني، ففي الوقت الذي يقطع فيه الثاني ١٠ دورات، يقطع الأول ٢٠ دورة، أي يتجاوزه بمقدار ١٠ دورات كاملة، مما يعني ٥ مرات تجاوز (تلاقٍ) فعلية ضمن هذا النطاق. الإجابة ج"},
{page:631,q:"يتسابق سعد وحسن في مضمار دائري طوله ٤٢٠ متراً، سعد بسرعة ٧م/ث وحسن بسرعة ٥م/ث. فإذا أكمل حسن دورتين، بكم متر يسبقه سعد؟",opts:["٢٤٠","٣٣٦","٣٦٠","٤٠٠"],ans:1,exp:"مسافة حسن (دورتان) = ٢×٤٢٠ = ٨٤٠ متراً، وزمنها = ٨٤٠÷٥ = ١٦٨ ثانية. مسافة سعد في نفس الزمن = ١٦٨×٧ = ١١٧٦ متراً. الفرق بين المسافتين = ١١٧٦-٨٤٠ = ٣٣٦ متراً، وهو مقدار تقدّم سعد عن حسن. الإجابة ب"},
{page:632,q:"لدى نهى ٦ روابط مختلفة تريد نشرها في موقع إلكتروني على صف واحد. بكم طريقة يمكن ترتيبها بشكل مختلف؟",opts:["١٢٠","٢٤٠","٣٦٠","٧٢٠"],ans:3,exp:"عدد طرق ترتيب ٦ عناصر مختلفة في صف = ٦! = ٦×٥×٤×٣×٢×١ = ٧٢٠ طريقة. الإجابة د"},
{page:633,q:"شخص يكتب على الكمبيوتر الأعداد من ٥ إلى ٢٠٠. كم مرة يضغط على أزرار الكمبيوتر (أي كم رقماً كتب إجمالاً)؟",opts:["٤٨٠","٤٨٨","٤٩٠","٤٩٢"],ans:1,exp:"الأعداد من ٥-٩ (٥أعداد×رقم واحد) = ٥. من ١٠-٩٩ (٩٠عدداً×رقمين) = ١٨٠. من ١٠٠-٢٠٠ (١٠١عدداً×٣أرقام) = ٣٠٣. المجموع الكلي = ٥+١٨٠+٣٠٣ = ٤٨٨. الإجابة ب"},
{page:634,q:"٩٢ ورقة نقدية من فئة ١٠٠ و٢٠٠ و٥٠٠ ريال، قسمت بنسبة على الترتيب ١١ : ٩ : ٣. كم مبلغ فئة الـ٥٠٠ ريال؟",opts:["١٨٠٠","٣٦٠٠","٦٠٠٠","٩٠٠٠"],ans:2,exp:"مجموع وحدات النسبة = ١١+٩+٣ = ٢٣ وحدة، تقابل ٩٢ ورقة، فقيمة الوحدة = ٩٢÷٢٣ = ٤ أوراق. عدد أوراق فئة الـ٥٠٠ = ٣×٤ = ١٢ ورقة. قيمتها = ١٢×٥٠٠ = ٦٠٠٠ ريال. الإجابة ج"},
{page:639,q:"الأعداد ٣٦٤ و٤١٤ و٥٣٩ تقبل القسمة على ن والباقي متساوٍ في كل الحالات. كم قيمة ن؟",opts:["٢٥","٥٠","١٢٥","١٧٥"],ans:0,exp:"بما أن باقي القسمة متساوٍ، فإن الفروق بين الأعداد تقبل القسمة على ن دون باقٍ: ٤١٤-٣٦٤=٥٠، ٥٣٩-٤١٤=١٢٥، ٥٣٩-٣٦٤=١٧٥. القاسم المشترك الأكبر لـ٥٠،١٢٥،١٧٥ = ٢٥. الإجابة أ"},
{page:641,q:"ما قياس زاوية السداسي المنتظم؟",opts:["١٢٠","٩٠","١٦٠","١١٥"],ans:0,exp:"مجموع الزوايا الداخلية للسداسي = (٦-٢)×١٨٠ = ٧٢٠°. بما أنه منتظم، فإن قياس كل زاوية = ٧٢٠÷٦ = ١٢٠°. الإجابة أ"},
{page:650,q:"محمد يحب كتابة الحروف. إذا بدأ محمد بكتابة (مركز قياس) يوم الأربعاء، علماً بأنه يكتب حرفاً واحداً في اليوم، فمتى سوف ينتهي من كتابتها كاملةً؟",opts:["الثلاثاء","الأربعاء","الخميس","الجمعة"],ans:1,exp:"عبارة (مركز قياس) تتكون من ٨ أحرف (بدون احتساب المسافة). بما أنه يكتب حرفاً واحداً يومياً بدءاً من الأربعاء، فإن اليوم الثامن (وهو يوم الانتهاء) يقع بعد ٧ أيام من البداية، أي يعود إلى نفس يوم الأربعاء (لأن الأسبوع ٧ أيام). الإجابة ب"},
{page:651,q:"يستطيع مصعد أن يحمل ٢٠ رجلاً أو ٢٤ طفلاً. لو حمل المصعد ١٥ رجلاً، فكم طفلاً إضافياً يستطيع حمله؟",opts:["٥","٦","٧","٨"],ans:1,exp:"وزن الرجل الواحد يعادل وزن <span class='frac'><span class='top'>٢٤</span><span class='bottom'>٢٠</span></span> طفل (بما أن ٢٠رجلاً=٢٤طفلاً). السعة المتبقية بعد حمل ١٥ رجلاً تعادل ٥ رجال إضافيين، وهو ما يعادل ٥×<span class='frac'><span class='top'>٢٤</span><span class='bottom'>٢٠</span></span> = ٦ أطفال. الإجابة ب"},
{page:654,q:"٢٤ طالباً و٨ معلمين. كم معلماً يجب أن يغادر لتصبح نسبة الطلاب ٨٠٪ من الحاضرين؟",opts:["١","٢","٣","٤"],ans:1,exp:"نفرض عدد المعلمين الذين يغادرون = س. العدد الكلي المتبقي = ٣٢-س. المعادلة: ٢٤ = ٨٠٪×(٣٢-س) ← ٢٤=٠٫٨×(٣٢-س) ← ٣٠=٣٢-س ← س=٢. الإجابة ب"},
{page:657,q:"يقوم ٦ عمال في ٦ أيام بإنجاز ٦ مجسمات. ففي كم يوم يقوم ١٢ عاملاً بإنجاز ٢٤ مجسماً؟",opts:["٦","١٢","٢٤","٤٨"],ans:1,exp:"معدل الإنجاز = ٦مجسمات÷(٦عمال×٦أيام) = <span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span> مجسم لكل عامل يومياً. الزمن اللازم لـ١٢ عاملاً لإنجاز ٢٤ مجسماً = ٢٤ ÷ (١٢×<span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span>) = ٢٤÷٢ = ١٢ يوماً. الإجابة ب"},
{page:660,q:"إذا كانت هند تقرأ ٥٠ صفحة في ٢٠ دقيقة، فإذا استمرت على نفس المعدل، كم صفحة تقرأ في ٤ ساعات؟",opts:["١٥٠","٢٠٠","٤٥٠","٦٠٠"],ans:3,exp:"معدل القراءة = ٥٠÷٢٠ = ٢٫٥ صفحة في الدقيقة. ٤ ساعات = ٢٤٠ دقيقة. عدد الصفحات = ٢٤٠×٢٫٥ = ٦٠٠ صفحة. الإجابة د"},
{page:663,q:"٣ أعداد صحيحة متتالية حاصل ضربهم = ٦٠. فما حاصل ضرب العدد الأول والثالث منها؟",opts:["٩","١٥","١٨","٢١"],ans:1,exp:"الأعداد الثلاثة المتتالية التي حاصل ضربها ٦٠ هي: ٣، ٤، ٥ (لأن ٣×٤×٥=٦٠). حاصل ضرب الأول والثالث = ٣×٥ = ١٥. الإجابة ب"},
{page:665,q:"٣ أصدقاء في مطعم دفعوا مبلغ ٤٠٠ ريال، الأول دفع الربع والثاني دفع الخُمس. كم دفع الثالث؟",opts:["٢٠٠","٢١٠","٢٢٠","٢٤٠"],ans:2,exp:"دفع الأول = <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>×٤٠٠ = ١٠٠. دفع الثاني = <span class='frac'><span class='top'>١</span><span class='bottom'>٥</span></span>×٤٠٠ = ٨٠. دفع الثالث = ٤٠٠-١٠٠-٨٠ = ٢٢٠ ريالاً. الإجابة ج"}
]},
{id:"set6",label:"المجموعة الخامسة",questions:[
{page:667,q:"إذا كان: ٢×٧×٩×ع يقبل القسمة على ١٠، فكم تساوي ع؟",opts:["٤","٥","٦","٧"],ans:1,exp:"حاصل ضرب ٢×٧×٩ = ١٢٦، وهو يحتوي على العامل ٢ لكن لا يحتوي على العامل ٥. لكي يقبل الناتج الكلي القسمة على ١٠ (=٢×٥) يجب أن توفر (ع) العامل ٥ المفقود، فتكون ع=٥. الإجابة ب"},
{page:670,q:"سار محمد ٣٠ دقيقة بسرعة ٦٠كلم/س، ثم ٦٠ دقيقة بسرعة ٨٠كلم/س. احسب المسافة الكلية التي قطعها.",opts:["١٠٠","١١٠","١١٥","١٢٠"],ans:1,exp:"المسافة الأولى = <span class='frac'><span class='top'>٣٠</span><span class='bottom'>٦٠</span></span> ساعة × ٦٠ = ٣٠ كلم. المسافة الثانية = ١ ساعة × ٨٠ = ٨٠ كلم. المسافة الكلية = ٣٠+٨٠ = ١١٠ كلم. الإجابة ب"},
{page:671,q:"كم عاماً منذ يوم ١ محرم سنة عشرة قبل الهجرة إلى ١ محرم عام ٢٠ بعد الهجرة؟",opts:["٣٠","٢٩","٢٨","٣١"],ans:1,exp:"بما أنه لا توجد سنة صفر بين ما قبل الهجرة وما بعدها، فإن عدد السنوات = ١٠ (قبل الهجرة) + ٢٠ (بعد الهجرة) - ١ = ٢٩ عاماً. الإجابة ب"},
{page:675,q:"شخص يحفظ شعراً من ١٦٠ بيتاً، في اليوم الأول حفظ ٥ أبيات، وفي كل يوم يضاعف عدد الأبيات التي يحفظها عن اليوم السابق. ففي كم يوم يكمل حفظ الأبيات؟",opts:["٣","٥","٦","٧"],ans:2,exp:"عدد الأبيات المحفوظة يومياً: اليوم١=٥، اليوم٢=١٠، اليوم٣=٢٠، اليوم٤=٤٠، اليوم٥=٨٠، وهكذا. وبإكمال الحساب حتى تغطية كامل الـ١٦٠ بيتاً بحسب هذا النمط التصاعدي، يكتمل الحفظ في اليوم السادس. الإجابة ج"},
