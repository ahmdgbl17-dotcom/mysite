const CORRECT_PASSWORD = "857565";
function checkLockPassword(){
  const val = document.getElementById('lockInput').value;
  if(val === CORRECT_PASSWORD){
    document.getElementById('lockOverlay').style.display='none';
    document.getElementById('appContainer').style.display='flex';
    document.getElementById('appContainer').style.flexDirection='column';
    renderHome();
  } else {
    document.getElementById('lockError').style.display='block';
  }
}
document.getElementById('lockInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkLockPassword();
});

function renderHome(){
  const grid = document.getElementById('setGrid');
  grid.innerHTML = SETS.map((s,i)=>`
    <div class="set-card">
      <div class="set-name">${s.label}</div>
      <div class="set-count">${toInd(s.questions.length)} سؤالاً</div>
      <div class="set-btns">
        <button class="set-btn btn-quiz" onclick="openQuiz(${i},'quiz')">ابدأ الاختبار</button>
        <button class="set-btn btn-key" onclick="openQuiz(${i},'key')">عرض الحل</button>
      </div>
    </div>
  `).join('');
  document.getElementById('homeView').style.display='block';
  document.getElementById('quizView').style.display='none';
}

function goHome(){
  document.getElementById('homeView').style.display='block';
  document.getElementById('quizView').style.display='none';
}

let curSetIdx=0, curMode='quiz', cur=0, score=0, answered=[];

function openQuiz(setIdx, mode){
  curSetIdx = setIdx; curMode = mode; cur=0; score=0;
  const Q = SETS[setIdx].questions;
  answered = Array(Q.length).fill(false);
  document.getElementById('homeView').style.display='none';
  document.getElementById('quizView').style.display='flex';
  document.getElementById('topbarTitle').textContent = SETS[setIdx].label + (mode==='key' ? ' - الحل' : '');
  document.getElementById('resultBox').classList.remove('show');
  if(mode==='quiz'){
    document.getElementById('progressBox').style.display='block';
    render();
  } else {
    document.getElementById('progressBox').style.display='none';
    renderAll();
  }
}

function restartCurrentSet(){
  openQuiz(curSetIdx, curMode);
}

function render(){
  const Q = SETS[curSetIdx].questions;
  const TOTAL = Q.length;
  if(cur>=TOTAL){showResult();return;}
  const q=Q[cur];
  const letters=['أ','ب','ج','د'];
  const srcLabel = (SETS[curSetIdx].id === 'set11' || SETS[curSetIdx].id === 'set12' || SETS[curSetIdx].id === 'set13' || SETS[curSetIdx].id === 'set14') ? ' (الأهم)' : '';
  let html=`<div class="card active"><span class="q-num">السؤال ${toInd(cur+1)}</span><span class="page-src">صفحة ${toInd(q.page)}${srcLabel}</span><div class="q-text">${q.q}</div><div class="options">`;
  q.opts.forEach((o,i)=>{html+=`<div class="option" onclick="choose(${i})"><span class="letter">${letters[i]}:</span> ${o}</div>`;});
  html+=`</div><div class="feedback" id="fb"></div><div class="nav"><button class="nav-btn btn-prev" onclick="prev()" ${cur===0?'disabled':''}>السابق</button><button class="nav-btn btn-next" id="nxt" onclick="next()" disabled>التالي</button></div></div>`;
  document.getElementById('quiz').innerHTML=html;
  updateProg();
}
function choose(i){
  if(answered[cur])return;
  const Q = SETS[curSetIdx].questions;
  const q=Q[cur];
  const opts=document.querySelectorAll('.option');
  const fb=document.getElementById('fb');
  opts.forEach(o=>o.classList.add('disabled'));
  opts[i].classList.add('selected');
  if(i===q.ans){opts[i].classList.add('correct');fb.className='feedback show correct';fb.innerHTML=`✅ <strong>إجابة صحيحة</strong><br>${q.exp}`;score++;}
  else{opts[i].classList.add('wrong');opts[q.ans].classList.add('correct');fb.className='feedback show wrong';fb.innerHTML=`❌ <strong>إجابة خاطئة</strong> – الصحيحة <strong>${['أ','ب','ج','د'][q.ans]}</strong><br>${q.exp}`;}
  answered[cur]=true;
  document.getElementById('nxt').disabled=false;
  document.getElementById('scoreLabel').textContent=`النتيجة: ${toInd(score)}`;
}
function next(){cur++;render();}
function prev(){if(cur>0){cur--;render();}}
function updateProg(){
  const TOTAL = SETS[curSetIdx].questions.length;
  document.getElementById('progFill').style.width=(cur/TOTAL*100)+'%';
  document.getElementById('progLabel').textContent=`السؤال ${toInd(cur+1)} من ${toInd(TOTAL)}`;
}
function showResult(){
  const TOTAL = SETS[curSetIdx].questions.length;
  document.getElementById('quiz').innerHTML='';
  document.getElementById('resultBox').classList.add('show');
  document.getElementById('finalScore').textContent=toInd(score);
  document.getElementById('totalLabel').textContent=`من ${toInd(TOTAL)}`;
  const m=document.getElementById('msg');
  const pct=score/TOTAL*100;
  if(pct>=90)m.textContent='ممتاز جداً!';else if(pct>=70)m.textContent='جيد جداً';else if(pct>=50)m.textContent='مستوى متوسط';else m.textContent='تحتاج مزيداً من التدريب';
}

function renderAll(){
  const Q = SETS[curSetIdx].questions;
  const letters=['أ','ب','ج','د'];
  let html='';
  const srcLabelAll = (SETS[curSetIdx].id === 'set11' || SETS[curSetIdx].id === 'set12' || SETS[curSetIdx].id === 'set13' || SETS[curSetIdx].id === 'set14') ? ' (الأهم)' : '';
  Q.forEach((q,idx)=>{
    html+=`<div class="card active" style="flex:none"><span class="q-num">السؤال ${toInd(idx+1)}</span><span class="page-src">صفحة ${toInd(q.page)}${srcLabelAll}</span><div class="q-text">${q.q}</div><div class="options">`;
    q.opts.forEach((o,i)=>{
      const cls = i===q.ans ? 'option correct disabled' : 'option disabled';
      const mark = i===q.ans ? ' ✅' : '';
      html+=`<div class="${cls}"><span class="letter">${letters[i]}:</span> ${o}${mark}</div>`;
    });
    html+=`</div><div class="feedback show correct">✅ <strong>الإجابة الصحيحة: ${letters[q.ans]}</strong><br>${q.exp}</div></div>`;
  });
  document.getElementById('quiz').innerHTML=html;
}
</script>
</body>
</html>
