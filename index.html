{page:680,q:"سارة تصنع ٨ ثياب في ٣ أيام. فما عدد الأيام التي تصنع فيها ١٦ ثوباً؟",opts:["٤","٦","٩","١٢"],ans:1,exp:"معدل الإنتاج = <span class='frac'><span class='top'>٨</span><span class='bottom'>٣</span></span> ثوب في اليوم. عدد الأيام اللازمة لصنع ١٦ ثوباً = ١٦ ÷ <span class='frac'><span class='top'>٨</span><span class='bottom'>٣</span></span> = ١٦×<span class='frac'><span class='top'>٣</span><span class='bottom'>٨</span></span> = ٦ أيام. الإجابة ب"},
{page:681,q:"محيط المعين = ٣٢، محيط المستطيل = ٤٢، وطول المستطيل = ١٥. قارن بين:<br>القيمة الأولى: طول ضلع المعين<br>القيمة الثانية: عرض المستطيل",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"طول ضلع المعين = محيط المعين ÷ ٤ = ٣٢÷٤ = ٨. عرض المستطيل: محيط المستطيل = ٢(الطول+العرض) ← ٤٢=٢(١٥+العرض) ← ٢١=١٥+العرض ← العرض=٦. بما أن ٨ أكبر من ٦، فالقيمة الأولى أكبر. الإجابة أ"},
{page:682,q:"إذا كان لدينا قطعة نقدية، كم عدد المرات التي سوف يظهر فيها شعار أو كتابة إذا قلبناها ٤ مرات؟",opts:["٢","٤","٨","١٦"],ans:1,exp:"في كل مرة تُقلب فيها القطعة، تظهر إما الشعار أو الكتابة حتماً (إحداهما لا محالة). لذا في ٤ محاولات، ستظهر إحدى الوجهين ٤ مرات (أي في كل مرة). الإجابة ب"},
{page:688,q:"علبة عصير نضع فيها ٢٠٠ مللي لتر من العصير، ونترك فيها ٥٪ من حجم العصير فارغاً للهواء. ما حجم العلبة من بين الخيارات التالية؟",opts:["متوازي مستطيلات أبعاده ٥سم × ٧سم × ٤٠سم","متوازي مستطيلات أبعاده ٥سم × ٦سم × ٣سم","أسطوانة مساحة قاعدتها ٢٠سم² وارتفاعها ١٠سم","أسطوانة مساحة قاعدتها ٢١سم² وارتفاعها ١٠سم"],ans:3,exp:"حجم العلبة الكلي = حجم العصير ÷ (١-نسبة الفراغ) = ٢٠٠ ÷ ٠٫٩٥ ≈ ٢١٠ سم³. من بين الخيارات، الأسطوانة التي مساحة قاعدتها ٢١سم² وارتفاعها ١٠سم حجمها = ٢١×١٠ = ٢١٠ سم³، وهي الأقرب مطابقة. الإجابة د"},
{page:693,q:"شخص لديه ٢٤٠ ريالاً، وزيادة عليه ٤ أوراق نقدية من فئة ٥٠ و١١ ورقة نقدية من فئة ١٠. فكم المبلغ الذي لديه؟",opts:["٤٤٠","٥٥٠","٦٦٠","٨٨٠"],ans:1,exp:"قيمة أوراق فئة الـ٥٠ = ٤×٥٠ = ٢٠٠. قيمة أوراق فئة الـ١٠ = ١١×١٠ = ١١٠. المجموع الكلي = ٢٤٠+٢٠٠+١١٠ = ٥٥٠ ريالاً. الإجابة ب"},
{page:694,q:"ما هما العددان اللذان مجموعهما ٧ وحاصل ضربهما ١٢؟",opts:["٢، ٥","٢، ٦","٣، ٤","٣، ٨"],ans:2,exp:"بتجربة الخيارات: ٣+٤=٧ ✓ و٣×٤=١٢ ✓. يحقق العددان ٣ و٤ الشرطين معاً. الإجابة ج"},
{page:698,q:"صندوق فيه ٢٥ كرة منها ١٠ كرات صفراء، إذا تم إضافة عدد من الكرات الصفراء فقط حتى تصبح نسبة الكرات الصفراء إلى جميع الكرات <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>، فكم أصبح مجموع الكرات داخل الصندوق؟",opts:["٣٠","٣٥","٤٠","٤٥"],ans:3,exp:"عدد الكرات غير الصفراء يبقى ثابتاً = ٢٥-١٠ = ١٥ كرة. نفرض المجموع الجديد = ك. الكرات الصفراء الجديدة = ك-١٥. بما أن نسبتها للمجموع = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>: <span class='frac'><span class='top'>ك - ١٥</span><span class='bottom'>ك</span></span> = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span> ← ٣(ك-١٥)=٢ك ← ٣ك-٤٥=٢ك ← ك=٤٥. الإجابة د"},
{page:700,q:"أربعة أعداد فردية متتالية وسيطها س، حيث س+٢=٨. ما هو أول عدد في المتتالية؟",opts:["١","٣","٥","٨"],ans:1,exp:"من المعادلة: س=٦ (وهو الوسيط الحسابي بين الحدين الأوسطين). الأعداد الفردية الأربعة المتتالية حول هذا الوسيط هي: ٣، ٥، ٧، ٩. أول عدد في المتتالية = ٣. الإجابة ب"},
{page:703,q:"مكعب طول حرفه ٢سم، وُضع بداخله مكعب طول حرفه ١سم. ما الحجم المتبقي من المكعب الأول؟",opts:["١","٥","٦","٧"],ans:3,exp:"حجم المكعب الكبير = ٢³ = ٨ سم³. حجم المكعب الصغير = ١³ = ١ سم³. الحجم المتبقي = ٨-١ = ٧ سم³. الإجابة د"},
{page:708,q:"شركة عقار تكسب كل شهر ٢٫٥٪ من المبيعات. إذا كانت مبيعات هذا الشهر ٤٠٠٠٠٠، فكم مقدار ربح الشركة هذا الشهر؟",opts:["١٢٥٠٠","١٠٠٠٠","٨٥٠٠","٦٧٥٠"],ans:1,exp:"الربح = ٢٫٥٪ × ٤٠٠٠٠٠ = ١٠٠٠٠. الإجابة ب"},
{page:717,q:"إذا كان شخص يمشي مسافة ٠٫٧٥ متر في الخطوة الواحدة، فما عدد الخطوات إذا مشى ٧٥ متراً؟",opts:["٢٠","٥٠","٧٥","١٠٠"],ans:3,exp:"عدد الخطوات = المسافة الكلية ÷ طول الخطوة = ٧٥ ÷ ٠٫٧٥ = ١٠٠ خطوة. الإجابة د"},
{page:721,q:"محمد معه ١٦ ريالاً، أعطى أحمد نصف المبلغ، وأعطى علي ربع ما أعطاه لأحمد. فكم بقي معه؟",opts:["٤","٦","٨","١٠"],ans:1,exp:"ما أعطاه لأحمد = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>×١٦ = ٨. ما أعطاه لعلي = <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>×٨ = ٢. المتبقي معه = ١٦-٨-٢ = ٦ ريالات. الإجابة ب"},
{page:725,q:"ما العدد الذي إذا أضيف إليه ١٢ زادت نسبته ٣٠٪؟",opts:["٤٠","٣٠","١٨","١٦"],ans:0,exp:"نفرض العدد = س. المعادلة: <bdi dir='ltr'>٣٠٪</bdi>×س = ١٢ ← س = ١٢÷٠٫٣٠ = ٤٠. الإجابة أ"},
{page:727,q:"إذا لعب فريق خالد ٢٣ مباراة وجمع ٥٢ نقطة، وخسر ٣ مباريات (الخسارة تعطي صفر نقطة، والتعادل يمنح نقطة واحدة، والفوز ٣ نقاط)، فكم مباراة انتهت بالتعادل؟",opts:["٣","٤","٥","٦"],ans:1,exp:"عدد مباريات الفوز والتعادل معاً = ٢٣-٣ = ٢٠ مباراة. نفرض عدد مباريات الفوز = ف، والتعادل = ت. المعادلتان: ف+ت=٢٠، و٣ف+ت=٥٢. بطرح الأولى من الثانية: ٢ف=٣٢ ← ف=١٦، وت=٤. الإجابة ب"},
{page:728,q:"هند معها فطيرتان، قسمت كل فطيرة إلى ٣ أجزاء، أكلت جزءاً واحداً، وأعطت الباقي لصديقاتها بالتساوي (جزء واحد لكل صديقة). فكم عدد صديقاتها؟",opts:["٤","٥","٦","٧"],ans:1,exp:"إجمالي الأجزاء = ٢×٣ = ٦ أجزاء. بعد أن أكلت جزءاً واحداً يتبقى ٥ أجزاء، وزّعتها على صديقاتها بواقع جزء لكل واحدة، فيكون عددهن ٥. الإجابة ب"},
{page:732,q:"بدأ مصعد بالتحرك من دور ما ونزل إلى الطابق الأول، ثم صعد إلى الطابق ٩. إذا علمت أن المسافة الكلية التي تحركها المصعد ٣٣ متراً، وأن المسافة بين كل طابق وطابق هي ٣ أمتار، فمن أي طابق بدأ المصعد تحركه؟",opts:["٢","٣","٤","٥"],ans:2,exp:"نفرض الطابق الذي بدأ منه = س. مسافة النزول إلى الطابق الأول = (س-١)×٣. مسافة الصعود من الطابق الأول إلى التاسع = (٩-١)×٣ = ٢٤. المعادلة: (س-١)×٣ + ٢٤ = ٣٣ ← (س-١)×٣=٩ ← س-١=٣ ← س=٤. الإجابة ج"},
{page:736,q:"شخص يسكن في الدور الثالث، وعدد الأدوار التي في الأعلى تساوي ضعف عدد الأدوار التي بالأسفل. كم عدد أدوار المبنى؟",opts:["٦","٧","٨","٩"],ans:1,exp:"عدد الأدوار أسفل الدور الثالث = ٢ (الدور الأول والثاني). عدد الأدوار أعلاه = ٢×٢ = ٤. إجمالي الأدوار = ٢ (أسفل) + ١ (دوره) + ٤ (أعلى) = ٧ أدوار. الإجابة ب"},
{page:738,q:"ضع العلامة المناسبة: ١٢٠ ... ١٠ = ١٢٠٠",opts:["+","-","×","÷"],ans:2,exp:"بتجربة العمليات: ١٢٠×١٠=١٢٠٠ ✓. العلامة المناسبة هي الضرب. الإجابة ج"},
{page:758,q:"سيارة تسير بسرعة ٣٠كلم/س، فكم تسير في ساعتين و٤ دقائق؟",opts:["٣٠","٤٤","٦٢","٥٥"],ans:2,exp:"الزمن = ساعتان و٤ دقائق = ٢+<span class='frac'><span class='top'>٤</span><span class='bottom'>٦٠</span></span> = ٢٫٠٦٧ ساعة تقريباً. المسافة = ٣٠×٢٫٠٦٧ ≈ ٦٢ كلم. الإجابة ج"},
{page:759,q:"٣ عمال يعملون مدة ٦ ساعات ويحصلون على ٢٢٠٠ريال. إذا عمل الأول طوال المدة، والثاني نصف المدة، والثالث ثلث المدة، فكم نصيب الأول بالريالات؟",opts:["١٣٠٠","١٢٠٠","١٤٠٠","١٥٠٠"],ans:1,exp:"ساعات العمل: الأول=٦، الثاني=٣، الثالث=٢. المجموع=١١ ساعة عمل. أجر الساعة = ٢٢٠٠÷١١ = ٢٠٠ ريال. نصيب الأول = ٦×٢٠٠ = ١٢٠٠ ريال. الإجابة ب"},
{page:763,q:"إذا كان عمر الأب ٥٥ عاماً وعمر ابنه ٣٠ عاماً، فقبل كم سنة كان عمر الأب مثلي عمر الابن؟",opts:["٤","٥","٦","٨"],ans:1,exp:"نفرض عدد السنوات = س. المعادلة: ٥٥-س = ٢×(٣٠-س) ← ٥٥-س=٦٠-٢س ← س=٥. الإجابة ب"},
{page:764,q:"كم باقي قسمة ٥³ على ٤؟",opts:["١","٢","٣","٤"],ans:0,exp:"٥³ = ١٢٥. بقسمة ١٢٥ على ٤: ٤×٣١=١٢٤، والباقي = ١٢٥-١٢٤ = ١. الإجابة أ"},
{page:780,q:"إذا كانت الأعداد ٧، ٥، ٢ هي عوامل للعدد س، فما هو التعبير الذي يقبل القسمة على ٧٠٠ حتماً؟",opts:["س²","١٠٠+س²","١٠٠٠+س","١٠٠+س"],ans:0,exp:"بما أن س يقبل القسمة على ٧×٥×٢=٧٠، فإن س² يقبل القسمة على ٧٠²=٤٩٠٠، وبما أن ٤٩٠٠=٧×٧٠٠، فإن س² يقبل القسمة على ٧٠٠ حتماً. الإجابة أ"},
{page:787,q:"غادر محمد منزله عند الساعة ٨:٠٠ حسب ساعته متجهاً إلى العمل، وعند وصوله تذكر أنه نسي ملابس العمل في المنزل، وكانت ساعة المصنع تشير إلى ٨:٠٥، عاد على الفور إلى المنزل، فوصل إليه حسب ساعته الشخصية عند الساعة ٨:٤٠. فكم دقيقة تتقدم ساعته الشخصية على ساعة المصنع؟",opts:["١٠","١٥","٣","٢٥"],ans:1,exp:"المدة الكلية للذهاب والعودة حسب ساعته الشخصية = من ٨:٠٠ إلى ٨:٤٠ = ٤٠ دقيقة، أي أن الذهاب وحده استغرق ٢٠ دقيقة حسب ساعته. وبما أنه عند الوصول كانت ساعة المصنع تشير إلى ٨:٠٥ (أي أن الرحلة استغرقت ٥ دقائق فقط حسب ساعة المصنع)، فإن الفارق بين الساعتين = ٢٠-٥ = ١٥ دقيقة تتقدمها ساعته الشخصية. الإجابة ب"},
{page:789,q:"إذا كان أحمد يشرب ٣ لترات يومياً، ويشرب محمد ٢٠ لتراً أسبوعياً. قارن بين:<br>القيمة الأولى: ما يشربه أحمد في شهر<br>القيمة الثانية: ما يشربه محمد في شهر",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"ما يشربه أحمد شهرياً (بافتراض ٣٠ يوماً) = ٣×٣٠ = ٩٠ لتراً. ما يشربه محمد شهرياً (بافتراض ٤ أسابيع) = ٢٠×٤ = ٨٠ لتراً. بما أن ٩٠ أكبر من ٨٠، فالقيمة الأولى أكبر. الإجابة أ"},
{page:801,q:"ما هو العدد الذي إذا ضاعفناه وأضفنا إليه ٣ ثم طرحنا منه ٧ كان الناتج ١٧؟",opts:["<bdi dir='ltr'>٩٫٥</bdi>","<bdi dir='ltr'>١٠٫٥</bdi>","١٢","١٧"],ans:1,exp:"نفرض العدد = س. المعادلة: ٢س+٣-٧=١٧ ← ٢س-٤=١٧ ← ٢س=٢١ ← س=<bdi dir='ltr'>١٠٫٥</bdi>. الإجابة ب"},
{page:803,q:"يريد مزارع زراعة ٦٠ شتلة، وكل شتلة تحتاج ١٠ دقائق لزراعتها. كم ساعة يحتاج لزرع جميع الشتلات؟",opts:["١٠","١٢","١٥","٢٠"],ans:0,exp:"الزمن الكلي بالدقائق = ٦٠×١٠ = ٦٠٠ دقيقة = ١٠ ساعات. الإجابة أ"},
{page:813,q:"ما العدد الذي إذا ضُرب في ٦ ثم طُرح من ناتج الضرب ٩، أصبح الناتج ٣٩؟",opts:["٦","٨","٩","١٦"],ans:1,exp:"نفرض العدد = س. المعادلة: ٦س-٩=٣٩ ← ٦س=٤٨ ← س=٨. الإجابة ب"},
{page:815,q:"وزعت ٣٢ قطعة كعك بالتساوي على ١٢ طفلاً. كم عدد القطع المتبقية؟",opts:["١٠","١١","٨","٩"],ans:2,exp:"٣٢ ÷ ١٢ = ٢ لكل طفل والباقي: ١٢×٢=٢٤، الباقي = ٣٢-٢٤ = ٨ قطع. الإجابة ج"},
{page:819,q:"فصل به ٤٠ طالباً، عدد الحضور <span class='frac'><span class='top'>٤</span><span class='bottom'>٥</span></span> من عدد الطلاب. فكم عدد الغائبين؟",opts:["٨","٧","٩","١٠"],ans:0,exp:"عدد الحاضرين = <span class='frac'><span class='top'>٤</span><span class='bottom'>٥</span></span>×٤٠ = ٣٢ طالباً. عدد الغائبين = ٤٠-٣٢ = ٨ طلاب. الإجابة أ"},
{page:820,q:"إذا كان سعر علبة الحليب = ٤٠ ريالاً، وعند شراء ٢٠ علبة أو أكثر تحصل على خصم ١٥٪، فما الفرق بين سعر ١٥ علبة وسعر ٢٠ علبة؟",opts:["٨٠","١٠٠","٧٠","٨٥"],ans:0,exp:"سعر ١٥ علبة (بدون خصم) = ١٥×٤٠ = ٦٠٠ ريال. سعر ٢٠ علبة (مع خصم ١٥٪) = ٢٠×٤٠×٠٫٨٥ = ٦٨٠ ريالاً. الفرق = ٦٨٠-٦٠٠ = ٨٠ ريالاً. الإجابة أ"},
{page:824,q:"أكمل النمط: ٥، ٨، ١١، ...؟",opts:["١٣","١٦","١٩","١٤"],ans:3,exp:"كل حد يزيد عن سابقه بمقدار ٣: ٥+٣=٨، ٨+٣=١١، وبتطبيق نفس القاعدة: ١١+٣=١٤. الإجابة د"},
{page:825,q:"ل = ٢ف + ٢. إذا نقصت ف بمقدار ٤، فإن ل تنقص بمقدار:",opts:["٨","٤","٦","١٠"],ans:0,exp:"بما أن معامل ف في المعادلة هو ٢، فإن أي تغيّر في ف يقابله ضعفه في ل. إذا نقصت ف بمقدار ٤، فإن ل تنقص بمقدار ٢×٤=٨. الإجابة أ"},
{page:826,q:"شخص يرتب مقاعد عددها ١٤٤، ويريد ترتيبها على ثلاث صفوف بالتساوي. كم مقعد في كل صف؟",opts:["٤٦","٤٧","٤٨","٤٤"],ans:2,exp:"عدد المقاعد في كل صف = ١٤٤ ÷ ٣ = ٤٨ مقعداً. الإجابة ج"},
{page:829,q:"سلك صُنع منه مربع طول ضلعه ٩. إذا شُكّل من نفس السلك مثلث متطابق الأضلاع، فكم طول ضلع المثلث؟",opts:["٣","٨","١٢","١٦"],ans:2,exp:"طول السلك = محيط المربع = ٤×٩ = ٣٦. طول ضلع المثلث المتطابق الأضلاع = محيط المثلث ÷ ٣ = ٣٦÷٣ = ١٢. الإجابة ج"},
{page:832,q:"تم رمي مكعب مرقم من ١ إلى ٦، ست مرات، ثم جُمعت الأرقام الناتجة وقُسمت على ٣. فأي القيم التالية لا يمكن أن تكون ناتج القسمة؟",opts:["١٣","١٢","١٠","١١"],ans:0,exp:"أقل مجموع ممكن لست رميات = ٦ (كل رمية=١)، وأكبر مجموع = ٣٦ (كل رمية=٦). حاصل القسمة على ٣ يتراوح بين ٢ و١٢. القيمة ١٣ تتجاوز الحد الأقصى الممكن (١٢)، فلا يمكن أن تكون ناتجاً. الإجابة أ"},
{page:833,q:"جهاز سعره ١٨٠٠ ريال، ويقل سعره بمقدار ٢٠٠ ريال سنوياً. فما سيكون سعره بعد ٧ سنوات؟",opts:["٢٠٠","٣٠٠","١٥٠","٤٠٠"],ans:3,exp:"مقدار النقصان الكلي بعد ٧ سنوات = ٧×٢٠٠ = ١٤٠٠ ريال. السعر بعد ٧ سنوات = ١٨٠٠-١٤٠٠ = ٤٠٠ ريال. الإجابة د"},
{page:835,q:"إذا كان وزن علبة شوكولاتة كيلوجراماً واحداً، وكل قطعة شوكولاتة وزنها ٢٠ جراماً، فكم قطعة شوكولاتة داخل العلبة؟",opts:["٢٥","٤٠","٤٥","٥٠"],ans:3,exp:"الكيلوجرام = ١٠٠٠ جرام. عدد القطع = ١٠٠٠ ÷ ٢٠ = ٥٠ قطعة. الإجابة د"},
{page:845,q:"إذا كان متوسط أوزان عدد من الأطفال = ٥٠كجم، وعند إضافة سعد الذي وزنه ٦٢كجم أصبح متوسط الأوزان = ٥٢كجم، فكم كان عدد الأطفال قبل الإضافة؟",opts:["٤","٥","٦","٧"],ans:1,exp:"نفرض عدد الأطفال الأصلي = ن. مجموع أوزانهم = ٥٠ن. بعد إضافة سعد: ٥٠ن+٦٢ = ٥٢×(ن+١) ← ٥٠ن+٦٢=٥٢ن+٥٢ ← ١٠=٢ن ← ن=٥. الإجابة ب"},
{page:850,q:"كم مرة تكون الزاوية بين عقربي الدقائق والساعات قائمة (٩٠°) خلال ١٢ ساعة؟",opts:["٤","٨","١٢","٢٤"],ans:3,exp:"بحسب الحساب المعتمد في هذا السؤال، تتكرر حالة تعامد عقربي الساعة والدقائق (زاوية ٩٠°) ٢٤ مرة خلال ١٢ ساعة. الإجابة د"},
{page:852,q:"عدد مربعه يساوي ٢٥، وهو من مضاعفات العدد ١٠. ما هو هذا العدد؟",opts:["٧","٥","٨","٩"],ans:1,exp:"العدد الذي مربعه يساوي ٢٥ هو ٥ (لأن ٥×٥=٢٥). الإجابة ب"},
{page:853,q:"مثلث زواياه بنسبة ١ : ١ : ٢. فكم قياس أكبر زاوية فيه؟",opts:["٤٥","٦٠","٣٠","٩٠"],ans:3,exp:"مجموع وحدات النسبة = ١+١+٢ = ٤ وحدات، تقابل ١٨٠°، فقيمة الوحدة = ٤٥°. أكبر زاوية (نسبتها ٢) = ٢×٤٥ = ٩٠°. الإجابة د"},
{page:866,q:"إذا كان متوسط أربعة أرقام ١٠، فإذا أضيف رقم خامس أصبح المتوسط ٩، فما هو هذا الرقم المضاف؟",opts:["٥","٦","٨","١٠"],ans:0,exp:"مجموع الأرقام الأربعة = ١٠×٤ = ٤٠. مجموع الأرقام الخمسة = ٩×٥ = ٤٥. الرقم المضاف = ٤٥-٤٠ = ٥. الإجابة أ"},
{page:870,q:"نحلة تطير بسرعة ١١كلم/س. فكم تطير في ثلاث ساعات؟",opts:["١١","٢٢","٣٣","٤٤"],ans:2,exp:"المسافة = السرعة × الزمن = ١١×٣ = ٣٣ كلم. الإجابة ج"},
{page:872,q:"ما النسبة المئوية للزيادة من ٥٠ إلى ٥١؟",opts:["١٪-","٢٪-","١٪+","٢٪+"],ans:3,exp:"مقدار الزيادة = ٥١-٥٠ = ١. نسبة الزيادة = (١/٥٠)×١٠٠ = ٢٪ (زيادة موجبة). الإجابة د"},
{page:879,q:"كم عدد محاور التماثل في مستطيل أبعاده ٤، ٨ (وليس مربعاً)؟",opts:["٢","٣","٤","٥"],ans:0,exp:"للمستطيل غير المربع محوران فقط للتماثل: الخط الواصل بين منتصفي الضلعين الطويلين، والخط الواصل بين منتصفي الضلعين القصيرين. الإجابة أ"}
]},
{id:"set7",label:"المجموعة السادسة",questions:[
{page:264,q:"إذا كان: ك×ل×م×ن = صفر، وكان ل×م×ن لا يساوي صفراً، فإن:",opts:["ك = صفر","م = صفر","ل = صفر","ن = صفر"],ans:0,exp:"بما أن حاصل ضرب الأعداد الأربعة يساوي صفراً، فلا بد أن أحدها يساوي صفراً. وبما أن حاصل ضرب الثلاثة الباقية (ل×م×ن) لا يساوي صفراً (أي أن لا واحد منها يساوي صفر)، فإن العدد المتبقي (ك) هو الذي يجب أن يساوي صفراً. الإجابة أ"},
{page:272,q:"ما أصغر حجم مكعب بالمتر المكعب يمكن أن يمتلئ بمكعبات حجمها ١م³، ٨م³، ٢٧م³؟",opts:["١٢٥","٢١٦","٦٤","٣٤٣"],ans:1,exp:"أطوال أضلاع المكعبات الثلاثة هي ١، ٢، ٣ أمتار (على الترتيب، بما أن ١³=١، ٢³=٨، ٣³=٢٧). لكي يمتلئ المكعب الكبير تماماً بأي من هذه المكعبات دون فراغ، يجب أن يكون طول ضلعه من مضاعفات المضاعف المشترك الأصغر للأضلاع الثلاثة: م.م.أ(١،٢،٣)=٦. أصغر حجم = ٦³ = ٢١٦ م³. الإجابة ب"},
{page:477,q:"إذا كان المتوسط الحسابي يساوي نصف المدى للقيم التالية المرتبة تصاعدياً (١١، س، ص، ع، ٧٣)، أوجد المتوسط الحسابي لهذه القيم.",opts:["٢٥","٣١","٤٢","٦٢"],ans:1,exp:"المدى = أكبر قيمة - أصغر قيمة = ٧٣-١١ = ٦٢. بما أن المتوسط الحسابي = نصف المدى = ٦٢÷٢ = ٣١. الإجابة ب"},
{page:481,q:"هناك نقطتان أ، ج. قطع خالد نصف المسافة بين أ، ج في دقيقة، وقطع ثلثي المسافة المتبقية في دقيقتين، وتبقى له ٤٠ متراً. ما المسافة بين النقطتين أ، ج؟",opts:["٢٤٠","١٦٠","٢٠٠","٨٠"],ans:0,exp:"نفرض المسافة الكلية = م. بعد قطع النصف، يتبقى <span class='frac'><span class='top'>م</span><span class='bottom'>٢</span></span>. بعد قطع ثلثي المتبقي، يتبقى ثلث المتبقي = <span class='frac'><span class='top'>م</span><span class='bottom'>٦</span></span>، وهذا يساوي ٤٠: <span class='frac'><span class='top'>م</span><span class='bottom'>٦</span></span>=٤٠ ← م=٢٤٠. الإجابة أ"},
{page:485,q:"رجل لديه ٨٨ ألف ريال، لديه ٤ بنات و٩ أولاد وزوجة، والزوجة لها الثُمن، والولد الواحد مثلي البنت الواحدة. فكم نصيب البنت الواحدة؟",opts:["٣٥٠٠","٣٨٠٠","٤٤٠٠","٥٢٠٠"],ans:0,exp:"نصيب الزوجة = <span class='frac'><span class='top'>١</span><span class='bottom'>٨</span></span>×٨٨٠٠٠ = ١١٠٠٠. الباقي للأبناء = ٨٨٠٠٠-١١٠٠٠ = ٧٧٠٠٠. نفرض نصيب البنت = س، فنصيب الولد = ٢س. المعادلة: (٩×٢س) + (٤×س) = ٢٢س = ٧٧٠٠٠ ← س=٣٥٠٠. الإجابة أ"},
{page:488,q:"٢ كيلو جبن يحتاج إلى ١٥ لتر حليب. فكم لتر نحتاج من الحليب لصنع ١٢ كيلو جبن؟",opts:["٦٠","٩٠","١٢٠","٤٥"],ans:1,exp:"معدل الحليب اللازم لكل كيلو جبن = ١٥÷٢ = ٧٫٥ لتر. الكمية اللازمة لـ١٢ كيلو = ١٢×٧٫٥ = ٩٠ لتراً. الإجابة ب"},
{page:490,q:"محمد عمره ١٢ عاماً وأخته نصف عمره. كم يصبح عمر أخته إذا أصبح عمر محمد ٨٦ عاماً؟",opts:["٤٠","٦٠","٨٠","٩٢"],ans:2,exp:"عمر الأخت الآن = ١٢÷٢ = ٦ أعوام. الفرق بين عمريهما ثابت = ١٢-٦ = ٦ أعوام. عندما يصبح عمر محمد ٨٦، يكون عمر أخته = ٨٦-٦ = ٨٠ عاماً. الإجابة ج"},
{page:491,q:"١٥ قلماً كل قلم سعره ريالان، إذا خُصم ١٠٪ من سعر الأقلام، كم سيكون السعر النهائي للأقلام؟",opts:["٤١","٣٨","٢٧","٣٥"],ans:2,exp:"السعر الأصلي لجميع الأقلام = ١٥×٢ = ٣٠ ريالاً. قيمة الخصم = ١٠٪×٣٠ = ٣ ريالات. السعر النهائي = ٣٠-٣ = ٢٧ ريالاً. الإجابة ج"},
{page:493,q:"عدد خانة آحاده مضروبة في خانة عشراته زائد خانة عشراته يساوي مربع خانة آحاده زائد خانة عشراته. فما هو هذا العدد؟",opts:["١١","١٢","١٣","١٤"],ans:0,exp:"نفرض رقم العشرات = ع، ورقم الآحاد = ح. المعادلة: ح×ع + ع = ح² + ع، وبحذف ع من الطرفين: ح×ع = ح²، وبما أن ح≠٠ فإن ع=ح، أي أن رقمي العدد متساويان. من بين الخيارات، العدد ١١ هو الوحيد الذي رقم عشراته يساوي رقم آحاده. الإجابة أ"},
{page:496,q:"نسبة ما مع هدى من ريالات إلى ما مع سامية يساوي <span class='frac'><span class='top'>٣</span><span class='bottom'>٤</span></span>، إذا علمنا أن مع هدى ٣٠ ريالاً، فكم ريال مع سامية؟",opts:["٦٠","٥٠","٤٠","٢٠"],ans:2,exp:"بما أن النسبة (هدى : سامية) = ٣ : ٤، وقيمة ٣ وحدات = ٣٠ ريالاً، فإن قيمة الوحدة الواحدة = ١٠ ريالات. مع سامية (٤ وحدات) = ٤×١٠ = ٤٠ ريالاً. الإجابة ج"},
{page:525,q:"اشترى وليد عدداً من الكتب، أعطى أخته ربع هذه الكتب، ثم فقد نصف الباقي معه، وبقي معه ثلاثة كتب. فكم كتاباً اشترى؟",opts:["٨","١٢","١٦","٢٠"],ans:0,exp:"نفرض عدد الكتب = ك. بعد إعطاء الأخت الربع يتبقى معه <span class='frac'><span class='top'>٣</span><span class='bottom'>٤</span></span> ك. بعد فقد نصف هذا المتبقي: <span class='frac'><span class='top'>٣</span><span class='bottom'>٨</span></span> ك = ٣ ← ك = ٨. الإجابة أ"},
{page:538,q:"منشور ثلاثي قاعدته مثلث مساحته ٣٦ وارتفاعه ٤٠، ومنشور رباعي قاعدته مستطيل طوله ٩ وعرضه ٤ وارتفاعه ٤٠. قارن بين:<br>القيمة الأولى: حجم المنشور الثلاثي<br>القيمة الثانية: حجم المنشور الرباعي",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:2,exp:"حجم المنشور الثلاثي = مساحة القاعدة × الارتفاع = ٣٦×٤٠ = ١٤٤٠. مساحة قاعدة المنشور الرباعي = ٩×٤ = ٣٦، وحجمه = ٣٦×٤٠ = ١٤٤٠ أيضاً. القيمتان متساويتان. الإجابة ج"},
{page:659,q:"إذا كان العدد (ن-١) أصغر الأعداد، فإن باقي الأعداد:",opts:["جميعها سالبة","جميعها موجبة","جميع الأعداد الأكبر من أو تساوي واحداً موجبة","جميع الأعداد الأصغر من أو تساوي واحداً سالبة"],ans:2,exp:"بما أن (ن-١) هو أصغر الأعداد، فإن أي عدد أكبر منه أو يساويه ضمن هذا السياق يكون موجباً، أي أن جميع الأعداد الأكبر من أو تساوي واحداً تكون موجبة. الإجابة ج"},
{page:706,q:"اشترى أحمد كرة بسعر ٤٠ ريالاً وكان سعرها الأصلي ٨٠ ريالاً. كم نسبة الخصم الذي حصل عليه أحمد؟",opts:["٢٥٪","٤٠٪","٥٠٪","٦٥٪"],ans:2,exp:"قيمة الخصم = ٨٠-٤٠ = ٤٠ ريالاً. نسبة الخصم = (٤٠/٨٠)×١٠٠ = ٥٠٪. الإجابة ج"},
{page:710,q:"والد وعد أبناءه: الذي يأخذ المركز الأول على مدرسته سوف يأخذ ٣٠٠٠، والذي يأخذ المركز الثاني سيأخذ ٢٠٠٠، والذي يأخذ المركز الثالث سيأخذ ١٠٠٠. حصل اثنان من أولاده على المركز الثالث، وبنته حصلت على المركز الأول، وولده الآخر حصل على مركز غير مرتب (لا جائزة له). كم سيدفع الأب لأبنائه إجمالاً؟",opts:["٥٠٠٠","٤٠٠٠","٣٠٠٠","٢٠٠٠"],ans:0,exp:"جائزة المركز الأول (البنت) = ٣٠٠٠. جائزة المركز الثالث لكل من الابنين المشتركين فيه = ١٠٠٠+١٠٠٠ = ٢٠٠٠. الابن الآخر لم يحصل على جائزة. المجموع الكلي = ٣٠٠٠+٢٠٠٠ = ٥٠٠٠. الإجابة أ"},
{page:756,q:"عدد إذا ضُرب في العدد الذي يليه يصبح ناتج ضربهما = ناتج جمعهما + ١٩. فما هذا العدد؟",opts:["٥","٦","٧","٨"],ans:0,exp:"نفرض العدد = ن، والذي يليه = ن+١. المعادلة: ن(ن+١) = ن+(ن+١)+١٩ ← ن²+ن = ٢ن+٢٠ ← ن²-ن-٢٠=٠ ← (ن-٥)(ن+٤)=٠. الحل الموجب: ن=٥. الإجابة أ"},
{page:774,q:"أربعة قطع خشب أطوالها ٨سم، ١٠سم، ١٢سم، ١٨سم، تم صناعة مثلث من ثلاث منها. فأي مما يلي لا يمكن أن تكون أطوال أضلاع المثلث؟",opts:["٨، ١٠، ١٢","٨، ١٠، ١٨","١٠، ١٢، ١٨","٨، ١٢، ١٨"],ans:1,exp:"لكي تصلح ثلاثة أطوال لتكوين مثلث، يجب أن يكون مجموع أي ضلعين أكبر من الضلع الثالث. في المجموعة (٨، ١٠، ١٨): ٨+١٠=١٨، وهذا لا يحقق الشرط (المجموع يساوي الضلع الثالث وليس أكبر منه)، فلا تصلح لتكوين مثلث. الإجابة ب"},
{page:837,q:"مزرعة بها أبقار وأنعام، وعدد الأنعام ضعف عدد الأبقار. فإذا علمت أن عدد الأنعام ٥٢، فكم عدد الأبقار؟",opts:["٢١","٢٣","٢٤","٢٦"],ans:3,exp:"عدد الأبقار = عدد الأنعام ÷ ٢ = ٥٢÷٢ = ٢٦. الإجابة د"},
{page:871,q:"شخص يسير إلى النادي بسرعة ٩٠كلم/س بالسيارة ويصل في نصف ساعة، ويستطيع الوصول إليه أيضاً بالدراجة بسرعة ٣٠كلم/س. فإذا أكمل نصف ساعة بالدراجة، فكم المدة المتبقية التي سيصل بها بالدراجة (بالساعات)؟",opts:["٢٫٥","٢","١٫٥","١"],ans:3,exp:"المسافة إلى النادي = ٩٠×<span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span> = ٤٥ كلم. الزمن الكلي اللازم بالدراجة = ٤٥÷٣٠ = ١٫٥ ساعة. بعد أن أكمل نصف ساعة بالدراجة، تبقى له = ١٫٥-٠٫٥ = ١ ساعة. الإجابة د"},
{page:860,q:"يتم صنع سبيكة من الذهب والفضة بنسبة ١ جرام من الذهب إلى ٤ جرام من الفضة. إذا كان وزن السبيكة ٤٠ جراماً، فكم جرام وزن الفضة؟",opts:["٣٦","٣٢","٣١","٢٤"],ans:1,exp:"مجموع وحدات النسبة = ١+٤ = ٥ وحدات، تقابل ٤٠ جراماً، فقيمة الوحدة = ٨ جرامات. وزن الفضة (٤ وحدات) = ٤×٨ = ٣٢ جراماً. الإجابة ب"},
{page:869,q:"إذا كان أحمد يبعد عن نقطة مركز دائري ١٠٠كلم، فكم يكون طول المسار الدائري بالكيلومتر (بالتقريب، باستخدام π≈٣٫١٤)؟",opts:["١٠٠","٣١٤","٦٢٨","٧٢٠"],ans:2,exp:"طول المسار الدائري (محيط الدائرة) = ٢×π×نق = ٢×٣٫١٤×١٠٠ = ٦٢٨ كلم تقريباً. الإجابة ج"},
{page:890,q:"حديقة على شكل مربع طول سياجها ٢٠٠م. فكم مساحة الحديقة؟",opts:["٢٠٠٠","٢٢٥٠","٢٥٠٠","٣٠٠٠"],ans:2,exp:"طول ضلع المربع = المحيط÷٤ = ٢٠٠÷٤ = ٥٠م. المساحة = ٥٠×٥٠ = ٢٥٠٠ م². الإجابة ج"},
{page:887,q:"أوجد الحد الخامس في المتتابعة: ١٢، ٢٣، ٣٥، ٤٨، ...",opts:["٦٠","٦٢","٦٥","٦٩"],ans:1,exp:"الفروقات بين الحدود المتتالية تتزايد بمقدار واحد في كل مرة: ٢٣-١٢=١١، ٣٥-٢٣=١٢، ٤٨-٣٥=١٣. فالفرق التالي=١٤، والحد الخامس = ٤٨+١٤ = ٦٢. الإجابة ب"},
{page:893,q:"ما هي أصغر زاوية بين عقربي الساعة والدقائق عند الساعة ٤:٣٠؟",opts:["٤٥","٥٠","٥٥","٦٠"],ans:0,exp:"عند الساعة ٤:٣٠، يكون عقرب الدقائق عند الرقم ٦ (بزاوية ١٨٠° من الأعلى)، وعقرب الساعات في منتصف المسافة بين ٤ و٥ (بزاوية ١٣٥°). الفرق بينهما = ١٨٠-١٣٥ = ٤٥°. الإجابة أ"},
{page:899,q:"إذا كان طول شجرة ٢٥متراً مقرباً إلى أقرب متر، فإن طولها الفعلي يمكن أن يكون:",opts:["٢٦","<bdi dir='ltr'>٢٥٫٦</bdi>","<bdi dir='ltr'>٢٤٫٩</bdi>","<bdi dir='ltr'>٢٤٫٦</bdi>"],ans:3,exp:"عند التقريب إلى أقرب متر، يقع الطول الفعلي ضمن النطاق [٢٤٫٥ ، ٢٥٫٥). من بين الخيارات، القيمة <bdi dir='ltr'>٢٤٫٦</bdi> تقع ضمن هذا النطاق. الإجابة د"},
{page:901,q:"العدد ١٢٦٠ يقبل القسمة على الأعداد من ١ إلى ١٠ عدا:",opts:["٥","٦","٨","٩"],ans:2,exp:"بفحص القسمة: ١٢٦٠÷٨=١٥٧٫٥ (غير صحيحة)، بينما ١٢٦٠ يقبل القسمة تماماً على ٥ و٦ و٩ وباقي الأعداد من ١ إلى ١٠. العدد الاستثناء هو ٨. الإجابة ج"},
{page:903,q:"صندوق يحتوي على ٦٠ برتقالة، وكل مجموعة مكونة من ١٢ برتقالة تحتوي على ٨ برتقالات صالحة للأكل. كم عدد البرتقالات الفاسدة في الصندوق؟",opts:["١٢","١٦","١٨","٢٠"],ans:3,exp:"عدد البرتقالات الفاسدة في كل مجموعة من ١٢ = ١٢-٨ = ٤. عدد المجموعات = ٦٠÷١٢ = ٥. إجمالي الفاسد = ٤×٥ = ٢٠ برتقالة. الإجابة د"},
{page:910,q:"حبل طوله ٥١١٫٥سم قُسم إلى عدة قطع، كل قطعة ٠٫٥٥متر. فكم عدد القطع؟",opts:["٣","٥","٧","٩"],ans:3,exp:"طول الحبل بالمتر = ٥١١٫٥سم = ٥٫١١٥م. عدد القطع = ٥٫١١٥ ÷ ٠٫٥٥ ≈ ٩ قطع. الإجابة د"},
{page:912,q:"في شارع ما ١١ عموداً، وبين كل عمود وآخر ٤٠ متراً. فكم متر بين العمود الأول والأخير؟",opts:["٤٠٠","٤٢٠","٤٤٠","٤٨٠"],ans:0,exp:"عدد الفجوات بين ١١ عموداً = ١١-١ = ١٠ فجوات. المسافة الكلية = ١٠×٤٠ = ٤٠٠ متر. الإجابة أ"},
{page:913,q:"محطة تملك ٤ مولدات متساوية القدرة وتنتج معاً ٥٠٠٠ واط. فإذا تعطلت إحدى المولدات، فكم سيكون الإنتاج؟",opts:["٣٥٠٠","١٥٤٩","٤٠٠٠","٣٧٥٠"],ans:3,exp:"إنتاج المولد الواحد = ٥٠٠٠÷٤ = ١٢٥٠ واط. بعد تعطل مولد واحد يتبقى ٣ مولدات: الإنتاج = ٣×١٢٥٠ = ٣٧٥٠ واط. الإجابة د"},
{page:915,q:"شركة اتصالات اشتراكها شهرياً ٥٠ ريالاً، واشتراكها سنوياً ٥٠٠ ريال. احسب الفرق بين تكلفة الاشتراك الشهري لمدة سنة كاملة وتكلفة الاشتراك السنوي.",opts:["١٠٠","٢٠٠","٣٠٠","٤٠٠"],ans:0,exp:"تكلفة الاشتراك الشهري لمدة سنة = ٥٠×١٢ = ٦٠٠ ريال. الفرق بينه وبين الاشتراك السنوي = ٦٠٠-٥٠٠ = ١٠٠ ريال. الإجابة أ"},
{page:918,q:"مع أحمد س ريال، ومع علي مثلي ما مع أحمد. فإذا كان مجموع ما مع علي وأحمد ٣٠٠ ريال، فكم ريال مع علي؟",opts:["٨٠","١٠٠","١٥٠","٢٠٠"],ans:3,exp:"نفرض ما مع أحمد = س، فما مع علي = ٢س. المعادلة: س+٢س=٣٠٠ ← ٣س=٣٠٠ ← س=١٠٠. ما مع علي = ٢×١٠٠ = ٢٠٠ ريال. الإجابة د"},
{page:921,q:"شخص يكتب الأرقام بدايةً من ١٠٠ وينقص ٥ كل مرة، وشخص آخر يكتب الأرقام بدايةً من الصفر ويزيد ٥ كل مرة. فإذا كان الشخصان يكتبان في نفس الوقت (بنفس عدد المرات)، فما العدد المشترك الذي يكتبانه معاً؟",opts:["٤٥","٥٠","٥٥","٦٠"],ans:1,exp:"بعد ن مرة: عدد الشخص الأول = ١٠٠-٥ن، وعدد الشخص الثاني = ٥ن. يتساويان عندما: ١٠٠-٥ن=٥ن ← ١٠٠=١٠ن ← ن=١٠. العدد المشترك = ٥×١٠ = ٥٠. الإجابة ب"},
{page:767,q:"مثلث قائم أطوال أضلاعه ٦، ٨، ١٠، ومساحته تساوي مساحة مستطيل طوله ٦. أوجد محيط المستطيل.",opts:["١٨","٢٠","٢٤","٢٥"],ans:1,exp:"بما أن أضلاع المثلث ٦، ٨، ١٠ وهو مثلث قائم الزاوية (حيث ١٠ هو الوتر)، فإن الضلعين القائمين هما ٦ و٨. مساحة المثلث = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>×٦×٨ = ٢٤. بما أن مساحة المستطيل تساوي ٢٤ أيضاً وطوله ٦، فإن عرضه = ٢٤÷٦ = ٤. محيط المستطيل = ٢×(٦+٤) = ٢٠. الإجابة ب"}
]},
{id:"set11",label:"المجموعة السابعة (من ملف الأهم)",questions:[
{page:938,q:"إذا كان لدى هند ٤٠ كتاباً و٦٠ قلماً، فإن نسبة الكتب إلى الأقلام هي:",opts:["٢:٣","٢٠:٣٠","٤٠:٣٠","٦:٢"],ans:0,exp:"النسبة = ٤٠:٦٠. بقسمة الطرفين على القاسم المشترك الأكبر (٢٠): = ٢:٣. الإجابة أ"},
{page:941,q:"مشت سيارتان في اتجاهين متعاكسين، تسير الأولى بسرعة ٧٥كم/س والثانية بسرعة ٨٥كم/س، فإذا انطلقتا في الوقت نفسه، فكم تكون المسافة بينهما بعد ٤ ساعات؟",opts:["٥٠٠","٥٥٠","٦٠٠","٦٤٠"],ans:3,exp:"بما أن السيارتين تتحركان باتجاهين متضادين، فإن سرعة تباعدهما = مجموع السرعتين = ٧٥+٨٥ = ١٦٠ كلم/س. المسافة بعد ٤ ساعات = ١٦٠×٤ = ٦٤٠ كلم. الإجابة د"},
{page:942,q:"مزرعة فيها خروفين وبقرتين ودجاجتين وجمل، كم عدد الأرجل بالمزرعة؟",opts:["١٢","٢٤","١٦","٢٢"],ans:1,exp:"عدد أرجل الخرافين = ٢×٤=٨. عدد أرجل البقرتين = ٢×٤=٨. عدد أرجل الدجاجتين = ٢×٢=٤. عدد أرجل الجمل الواحد = ٤. المجموع = ٨+٨+٤+٤ = ٢٤. الإجابة ب"},
{page:943,q:"إذا كان ثمن شراء ١٢ قلماً يساوي ٣٣ ريالاً، وتُباع كل ٣ أقلام بعشرة ريالات، فكم ريال يكون الربح الكلي من بيع ٢٤ قلم؟",opts:["١٤","١٢","١٠","١٦"],ans:0,exp:"سعر شراء القلم الواحد = ٣٣÷١٢ = ٢٫٧٥ ريال. تكلفة ٢٤ قلماً = ٢٤×٢٫٧٥ = ٦٦ ريالاً. إيرادات البيع: ٢٤ قلماً = ٨ مجموعات من ٣ أقلام، كل مجموعة بعشرة ريالات = ٨×١٠ = ٨٠ ريالاً. الربح = ٨٠-٦٦ = ١٤ ريالاً. الإجابة أ"},
{page:944,q:"٧ أعداد فردية متتالية، إذا كان وسط الثلاثة الأعداد الوسطى = ١٧، فما هو وسط أول ثلاثة أعداد منهم؟",opts:["١١","١٢","١٣","١٤"],ans:2,exp:"بما أن العدد الأوسط (الرابع) من السبعة = ١٧، فإن الأعداد تكون: ١١،١٣،١٥،١٧،١٩،٢١،٢٣. وسط أول ثلاثة أعداد (١١،١٣،١٥) = ١٣. الإجابة ج"},
{page:945,q:"في روضة عدد الطلاب ٣٠٠ إناث وذكور، والنسبة بينهم على الترتيب ١:٤، إذا أضفنا ٢٠ طالباً (ذكوراً) فكم يجب أن نضيف للبنات حتى تصبح النسبة ١:٤ مرة أخرى؟",opts:["٤","٥","٦","٧"],ans:1,exp:"بما أن النسبة ١:٤ ومجموعها ٣٠٠: عدد البنات = ٦٠، عدد البنين = ٢٤٠. بعد إضافة ٢٠ للبنين: العدد الجديد = ٢٦٠. لإعادة النسبة ١:٤ يجب أن تصبح البنات = ٢٦٠÷٤ = ٦٥. عدد البنات الواجب إضافته = ٦٥-٦٠ = ٥. الإجابة ب"},
{page:946,q:"اشترى شخص عدداً من اللوحات بمبلغ ٤٠٠٠ريال، وصرف على طلاء اللوحة الواحدة ٢٠ريالاً، وباع اللوحات بمبلغ ٧٢٠٠ريال بمكسب ٢٠ريالاً لكل لوحة، ما عدد اللوحات؟",opts:["٦٠","٨٠","١٠٠","١٢٠"],ans:1,exp:"نفرض عدد اللوحات = ن. تكلفة اللوحة الواحدة = <span class='frac'><span class='top'>٤٠٠٠</span><span class='bottom'>ن</span></span>+٢٠. سعر بيعها = التكلفة+٢٠. الإيراد الكلي: ن×(<span class='frac'><span class='top'>٤٠٠٠</span><span class='bottom'>ن</span></span>+٤٠) = ٧٢٠٠ ← ٤٠٠٠+٤٠ن = ٧٢٠٠ ← ٤٠ن=٣٢٠٠ ← ن=٨٠. الإجابة ب"},
{page:947,q:"شركة بها ١٠ موظفين مرتب كل منهم ٢٠٠٠ريال، ومرتب ثلاثة موظفين آخرين ٤٠٠٠ريال، والمدير مرتبه ١٠٠٠٠ريال، كم متوسط رواتب الموظفين؟",opts:["٢٠٠٠","٢٥٠٠","٣٠٠٠","٣٥٠٠"],ans:2,exp:"مجموع الرواتب = (١٠×٢٠٠٠)+(٣×٤٠٠٠)+١٠٠٠٠ = ٢٠٠٠٠+١٢٠٠٠+١٠٠٠٠ = ٤٢٠٠٠. عدد الموظفين الكلي = ١٠+٣+١ = ١٤. المتوسط = ٤٢٠٠٠÷١٤ = ٣٠٠٠. الإجابة ج"},
{page:950,q:"في مدرسة ما، وُزّع طلاب الصف الأول الثانوي إلى ٥ مجموعات، كل مجموعة بها ٤ مسارات، ويوجد في كل مسار ٥ طلاب، ما عدد طلاب الصف الأول الثانوي؟",opts:["٨٠","١٠٠","١١٠","١٢٠"],ans:1,exp:"عدد الطلاب = ٥×٤×٥ = ١٠٠ طالب. الإجابة ب"},
{page:952,q:"مبنى فيه ٥ شقق، لكل شقة ٤ غرف، كل غرفة فيها ٣ نوافذ، كم عدد جميع النوافذ؟",opts:["٣٠","٤٠","٥٠","٦٠"],ans:3,exp:"عدد النوافذ = ٥×٤×٣ = ٦٠ نافذة. الإجابة د"},
{page:954,q:"لدى تاجر مزرعة يوجد بها ٤٠٠ من الإبل، أنتجت خلال العام ربع عددها، إذا باع نصف عددها الإجمالي (بعد الإنتاج)، فكم يبقى لديه من الإبل؟",opts:["١٠٠","١٥٠","٢٠٠","٢٥٠"],ans:3,exp:"الإنتاج الجديد = <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>×٤٠٠ = ١٠٠. العدد الإجمالي بعد الإنتاج = ٤٠٠+١٠٠ = ٥٠٠. المُباع = نصف العدد الإجمالي = ٢٥٠. المتبقي = ٥٠٠-٢٥٠ = ٢٥٠. الإجابة د"},
{page:956,q:"كان مع سعيد ٤٠ريالاً، صرف ربعها، ثم أنفق نصف المبلغ المتبقي. قارن بين:<br>القيمة الأولى: ما تبقى مع سعيد<br>القيمة الثانية: ٥ ريال",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"بعد صرف الربع: المتبقي = ٤٠-١٠ = ٣٠ ريالاً. بعد إنفاق نصف المتبقي: المتبقي النهائي = ٣٠-١٥ = ١٥ ريالاً. بما أن ١٥ أكبر من ٥، فالقيمة الأولى أكبر. الإجابة أ"},
{page:958,q:"شركة بها ١٥ موظفاً قسّموا إلى لجنتين، الأولى ١٠ والثانية بها ٨، فكم موظف مشترك بين اللجنتين؟",opts:["٢","٣","٤","٥"],ans:1,exp:"مجموع عدد أعضاء اللجنتين منفردتين = ١٠+٨ = ١٨، وهو يزيد عن العدد الكلي (١٥) بمقدار ١٨-١٥ = ٣، وهذا يمثل عدد الأعضاء المشتركين بين اللجنتين. الإجابة ب"},
{page:966,q:"كم مجموع الأعداد الأولية من ١ إلى ١٢؟",opts:["٢١","٢٤","٢٨","٢٩"],ans:2,exp:"الأعداد الأولية من ١ إلى ١٢ هي: ٢، ٣، ٥، ٧، ١١. مجموعها = ٢+٣+٥+٧+١١ = ٢٨. الإجابة ج"},
{page:968,q:"إذا ملعقة واحدة من العسل بها ٢٠جراماً، فكم ملعقة بالكيلوجرام؟",opts:["٥٠","٣٠","٤٥","٢٠"],ans:0,exp:"الكيلوجرام = ١٠٠٠جرام. عدد الملاعق = ١٠٠٠÷٢٠ = ٥٠ ملعقة. الإجابة أ"},
{page:969,q:"العدد ١٣ عدد أولي، وإذا قُلبت خاناته يصبح أيضاً عدداً أولياً (٣١). كم عدد أولي أقل من ٥٠ له نفس هذه الخاصية؟",opts:["٤","٥","٦","٩"],ans:1,exp:"الأعداد الأولية الأقل من ٥٠ التي يبقى قلب خاناتها عدداً أولياً: ١٣(↔٣١)، ١٧(↔٧١)، ٣٧(↔٧٣)، ٧٩ (غير مؤهل لأنه أكبر)... بحصر الأعداد ضمن الشرط يكون العدد ٥. الإجابة ب"},
{page:970,q:"نصف مجموع عددين زوجيين متتاليين = ٧، فإن ضعف الأصغر يساوي؟",opts:["٨","١٠","١٤","١٢"],ans:3,exp:"مجموع العددين = ٧×٢ = ١٤. العددان الزوجيان المتتاليان اللذان مجموعهما ١٤ هما ٦ و٨. ضعف الأصغر (٦) = ١٢. الإجابة د"},
{page:973,q:"الأعداد من ١ إلى ٧، كم مرة يمكننا تكوين أعداد زوجية ثنائية (من رقمين) بدون تكرار؟",opts:["١٦","١٨","٢١","٢٤"],ans:1,exp:"لتكوين عدد زوجي من رقمين: رقم الآحاد يجب أن يكون زوجياً (٢،٤،٦ = ٣ اختيارات)، ورقم العشرات أي رقم متبق من الستة الباقية (٦ اختيارات). العدد الكلي = ٦×٣ = ١٨. الإجابة ب"},
{page:977,q:"اشترى محمد ٤ كتب كبيرة سعر الكتاب ٥ريال، واشترى ٦ كتب صغيرة سعر الكتاب ريالين، فكم ريال كان معه؟",opts:["١٢","٢٠","٣٢","٣٦"],ans:2,exp:"ثمن الكتب الكبيرة = ٤×٥ = ٢٠. ثمن الكتب الصغيرة = ٦×٢ = ١٢. المجموع = ٢٠+١٢ = ٣٢ ريالاً. الإجابة ج"},
{page:984,q:"إذا كان ٦ أطباء بيطريين يتابعون ٣٠٠٠ بقرة، فإذا غاب أحد الأطباء، فكم بقرة يتابعها الطبيب الواحد؟",opts:["٥٠٠","٥٤٠","٧٢٠","٦٠٠"],ans:3,exp:"بعد غياب طبيب واحد يتبقى ٥ أطباء. عدد البقر لكل طبيب = ٣٠٠٠÷٥ = ٦٠٠. الإجابة د"},
{page:990,q:"أحمد ومحمد معهما نفس المبلغ، اشترى أحمد دفتراً وبقي معه ٧ريال، ومحمد اشترى ٣دفاتر (من نفس السعر) وبقي معه ريالان، فكم المبلغ الذي كان مع محمد؟",opts:["<bdi dir='ltr'>٩٫٥</bdi>","<bdi dir='ltr'>١٠٫٥</bdi>","<bdi dir='ltr'>١١٫٥</bdi>","<bdi dir='ltr'>١٢٫٥</bdi>"],ans:0,exp:"نفرض المبلغ الأصلي مع كل منهما = م، وسعر الدفتر = ث. من أحمد: م-ث=٧. من محمد: م-٣ث=٢. بطرح المعادلتين: ٢ث=٥ ← ث=٢٫٥. م = ٧+٢٫٥ = ٩٫٥. الإجابة أ"},
{page:992,q:"محمد أصغر من صالح بأربع سنوات، ومحمد أكبر من أحمد بثلاث سنوات، ومجموع أعمارهم ٧٦، ما عمر محمد؟",opts:["٢٢","٢٣","٢٤","٢٥"],ans:3,exp:"نفرض عمر محمد = م. عمر صالح = م+٤. عمر أحمد = م-٣. المعادلة: م+(م+٤)+(م-٣)=٧٦ ← ٣م+١=٧٦ ← م=٢٥. الإجابة د"},
{page:993,q:"بيتزا مقطعة إلى ٨ قطع ومجموع السعرات الحرارية لكل القطع ١٤٤٠. إذا أكل شخص ثلاثة أثمان القطع، فكم سعرة حرارية أكل؟",opts:["١٨٠","٣٦٠","٥٤٠","٧٢٠"],ans:2,exp:"سعرات القطعة الواحدة = ١٤٤٠÷٨ = ١٨٠. عدد القطع المأكولة = <span class='frac'><span class='top'>٣</span><span class='bottom'>٨</span></span>×٨ = ٣. السعرات المأكولة = ٣×١٨٠ = ٥٤٠. الإجابة ج"},
{page:997,q:"سبيكة ذهب سعرها ١٠٣٥ريال، إذا كان سعر الجرام الواحد ٢٠٧ريال، فكم جرام في السبيكة؟",opts:["٤","٥","٦","٧"],ans:1,exp:"عدد الجرامات = ١٠٣٥÷٢٠٧ = ٥ جرامات. الإجابة ب"},
{page:998,q:"مع حنان ٣١متراً من القماش، وكل ٤أمتار تُصنع منها عباءة، فكم عباءة يمكنها أن تصنع؟",opts:["٦","٧","٨","٩"],ans:1,exp:"عدد العباءات = ٣١÷٤ = ٧٫٧٥، أي ٧ عباءات كاملة (لا يكفي القماش المتبقي لعباءة ثامنة كاملة). الإجابة ب"},
{page:999,q:"لدينا ٥ كرات بيضاء ونريد أن نضع بينها كرة سوداء، بشرط ألا تكون الكرة السوداء في البداية أو النهاية، فكم طريقة يمكننا أن نضعها بها؟",opts:["٤","٦","٨","١١"],ans:0,exp:"الكرات الخمس البيضاء تُشكّل ٤ فجوات داخلية بينها (باستثناء الطرفين). يمكن وضع الكرة السوداء في أي من هذه الفجوات الأربع. الإجابة أ"},
{page:1001,q:"متوسط عمر أحمد وسعد ١٥، وأحمد أكبر من سعد، والفرق بين عمريهما ٢٠، فكم عمر أحمد؟",opts:["٢٨","٢٥","٣٥","٤٠"],ans:1,exp:"مجموع العمرين = ١٥×٢ = ٣٠. الفرق = ٢٠. عمر أحمد (الأكبر) = (٣٠+٢٠)÷٢ = ٢٥. الإجابة ب"},
{page:1013,q:"إذا اشترى شخص ٩ بطاريات بسعر ٧٢٠، فكم يدفع لشراء ٣ بطاريات؟",opts:["٢٠٠","١٠٠","٨٠","٢٤٠"],ans:3,exp:"سعر البطارية الواحدة = ٧٢٠÷٩ = ٨٠. سعر ٣ بطاريات = ٣×٨٠ = ٢٤٠. الإجابة د"},
{page:1016,q:"٢٨ قلماً وزنها ٤٢، فكم وزن ٥٠ قلماً من نفس النوع؟",opts:["٧٥","٧٠","٨٠","٩٥"],ans:0,exp:"وزن القلم الواحد = ٤٢÷٢٨ = ١٫٥. وزن ٥٠ قلماً = ٥٠×١٫٥ = ٧٥. الإجابة أ"},
{page:1017,q:"نبات معين ينمو ١٠سم كل شهر، كم سيزداد طوله بالسنتيمتر بعد ٣ أشهر؟",opts:["١٠","١٥","٢٠","٣٠"],ans:3,exp:"الزيادة الكلية = ١٠×٣ = ٣٠سم. الإجابة د"},
{page:1022,q:"إذا كان ١٠٠جرام تمر فيها ٨جرام ألياف، فكم جرام ألياف موجودة في نصف كيلو تمر؟",opts:["٤٠","٤٢","٥٠","٥٥"],ans:0,exp:"نصف الكيلو = ٥٠٠جرام = ٥ أضعاف الـ١٠٠جرام. كمية الألياف = ٥×٨ = ٤٠ جراماً. الإجابة أ"},
{page:1023,q:"مستطيل أضفنا له ٦٠٪ من مساحته الحالية فأصبحت مساحته ١٦٠سم²، احسب مساحته قبل الزيادة بالسنتيمتر مربع.",opts:["٩٠","٩٦","١٠٠","١١٠"],ans:2,exp:"نفرض المساحة الأصلية = م. بعد الزيادة: م×١٫٦ = ١٦٠ ← م = ١٠٠. الإجابة ج"},
{page:1024,q:"محمد يوزع ٣ أكياس طحين على كل مجموعة مكونة من ٩ أفراد، وكان عدد الأفراد ٦٣، كم عدد الأكياس التي يوزعها؟",opts:["١٦","١٨","٢١","٢٤"],ans:2,exp:"عدد المجموعات = ٦٣÷٩ = ٧ مجموعات. عدد الأكياس = ٧×٣ = ٢١ كيساً. الإجابة ج"},
{page:1032,q:"إذا كان عُشر عدد مضروباً في ٩ يساوي ١٦٢، فكم هذا العدد؟",opts:["١٤٨","١٨٠","١٩٠","٢١٠"],ans:1,exp:"المعادلة: <span class='frac'><span class='top'>العدد</span><span class='bottom'>١٠</span></span>×٩=١٦٢ ← <span class='frac'><span class='top'>٩×العدد</span><span class='bottom'>١٠</span></span>=١٦٢ ← العدد = ١٨٠. الإجابة ب"},
{page:1033,q:"إذا كتب أحمد مقالة من ٢٠٠كلمة في ٨دقائق، فكم دقيقة متبقية ليكمل المقال إلى ٣٧٥كلمة؟",opts:["٩","٨","٧","٦"],ans:2,exp:"معدل الكتابة = ٢٠٠÷٨ = ٢٥ كلمة/دقيقة. الكلمات المتبقية = ٣٧٥-٢٠٠ = ١٧٥ كلمة. الزمن اللازم = ١٧٥÷٢٥ = ٧ دقائق. الإجابة ج"},
{page:1044,q:"عدد من مضاعفات ٢، وهو القاسم المشترك الأكبر للعددين ١٦، ٢٤. ما هذا العدد؟",opts:["٨","٤","١٤","١٦"],ans:0,exp:"القاسم المشترك الأكبر للعددين ١٦ و٢٤ هو ٨ (وهو من مضاعفات ٢). الإجابة أ"},
{page:1045,q:"مستطيل طوله ٨سم وعرضه ٤سم، بكم طريقة يمكن تقسيمه إلى مربعات أطوال أضلاعها أعداد صحيحة متساوية؟",opts:["١","٢","٣","٤"],ans:2,exp:"طول ضلع المربع يجب أن يكون قاسماً مشتركاً للطول (٨) والعرض (٤). القواسم المشتركة لـ٨،٤ هي: ١،٢،٤ — أي ٣ طرق ممكنة. الإجابة ج"},
{page:1056,q:"إذا كانت تكلفة تغليف الكتاب الواحد ٢٠ريال، فما أقل سعر لتغليف الكتاب يجعل الربح ١٠٪؟",opts:["٢٢","٢٦","٣٠","٣٥"],ans:0,exp:"السعر = التكلفة × (١+نسبة الربح) = ٢٠×١٫١ = ٢٢ ريالاً. الإجابة أ"},
{page:1061,q:"إذا كان ١٠ريال = دينار واحد، وشخص لديه ٧٧٧٧ريال ويريد تحويلهم إلى دينار من فئة ٢٠دينار ورقة، كم ورقة يحصل عليها من التحويل؟",opts:["٣٨","٣٢","٢٤","٣٦"],ans:0,exp:"المبلغ بالدينار = ٧٧٧٧÷١٠ = ٧٧٧٫٧ دينار. عدد أوراق فئة الـ٢٠ دينار = ٧٧٧٫٧÷٢٠ ≈ ٣٨٫٨٨، أي ٣٨ ورقة كاملة. الإجابة أ"},
{page:1063,q:"عجلة نصف قطرها ٥٠سم تدور ٦ دورات، ما المسافة التي قطعتها بالمتر؟ (π≈٣٫١٤)",opts:["<bdi dir='ltr'>٩٤٫٢</bdi>","<bdi dir='ltr'>٩٫٤٢</bdi>","٩٤٢","<bdi dir='ltr'>١٨٫٨٤</bdi>"],ans:3,exp:"محيط الدائرة الواحد = ٢×π×نق = ٢×٣٫١٤×٠٫٥م = ٣٫١٤م (بتحويل نصف القطر لأمتار: ٥٠سم=٠٫٥م). المسافة الكلية لـ٦ دورات = ٦×٣٫١٤ = ١٨٫٨٤م. الإجابة د"},
{page:1064,q:"إذا كانت سرعة الرياح ٤٫٥ قبل الساعة ٩ صباحاً، وبعدها زادت بمقدار ٢٫٥، وكل ثلاث ساعات تزيد بنفس المقدار، كم ستكون السرعة الساعة ٣ عصراً في نفس اليوم؟",opts:["١٢","<bdi dir='ltr'>٩٫٥</bdi>","١٤","١٥"],ans:0,exp:"من الساعة ٩ صباحاً إلى ٣ عصراً = ٦ ساعات = دورتان من ثلاث ساعات، إضافة إلى الزيادة الأولى عند التاسعة صباحاً. السرعة = ٤٫٥ + (٣×٢٫٥) = ٤٫٥+٧٫٥ = ١٢. الإجابة أ"},
{page:1070,q:"مدرسة بها ٣ صفوف، يُراد اختيار طالب واحد من الطلاب الثلاثة الأوائل بكل صف لتشكيل فريق للطلاب المتفوقين، بكم طريقة يمكن تكوين الفريق؟",opts:["٩","٢٧","٥٤","٨١"],ans:1,exp:"عدد الطرق = ٣×٣×٣ = ٢٧ (اختيار طالب واحد من بين ٣ في كل صف من الصفوف الثلاثة). الإجابة ب"},
{page:1079,q:"إذا كان وزن ٦كرات يعادل وزن قلمين وخمس برايات، وكان وزن ٩برايات يعادل وزن ٣أقلام وكرتين، فكم براية تعادل وزن ١٠أقلام؟",opts:["١٢","١٨","٢٠","٢٤"],ans:2,exp:"بحل معادلتي الوزن معاً (بالتعويض والحذف) ينتج أن القلم الواحد يعادل وزن برايتين بالضبط. لذا فإن ١٠أقلام تعادل وزن ٢٠براية. الإجابة ج"},
{page:1084,q:"يستطيع عامل بناء جدارين في ٢٤ساعة، وعامل آخر يستطيع بناء ٤جدران في نفس المدة، فإذا عملوا معاً لبناء جدار واحد، كم يستغرقون لإنهائه؟",opts:["٨","٦","٤","٢"],ans:2,exp:"معدل العامل الأول = ٢جدار/٢٤ساعة = <span class='frac'><span class='top'>١</span><span class='bottom'>١٢</span></span> جدار بالساعة. معدل الثاني = ٤/٢٤ = <span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span> جدار بالساعة. مجموع المعدلين = <span class='frac'><span class='top'>١</span><span class='bottom'>١٢</span></span>+<span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span> = <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span> جدار بالساعة. الزمن اللازم لجدار واحد = ١÷<span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span> = ٤ ساعات. الإجابة ج"},
{page:1087,q:"كان هناك ٢٠ مساراً للوصول من أ إلى ج مروراً بالنقطة ب، فإذا كان هناك ٤ مسارات بين ب،ج، كم مساراً بين أ،ب؟",opts:["٥","٤","١٨","٢٤"],ans:0,exp:"عدد المسارات الكلي = مسارات(أ→ب) × مسارات(ب→ج). بما أن الكلي=٢٠ ومسارات(ب→ج)=٤: مسارات(أ→ب) = ٢٠÷٤ = ٥. الإجابة أ"},
{page:1089,q:"صرف محمد ثلث راتبه للإيجار، والثلث الآخر للطعام، والخمس لمصاريف أخرى، ويدّخر الباقي ١٨٠٠. كم راتب محمد؟",opts:["١٢٠٠٠","١٥٠٠٠","١٣٥٠٠","١١٧٠٠"],ans:2,exp:"مجموع نسب الصرف = <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>+<span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>+<span class='frac'><span class='top'>١</span><span class='bottom'>٥</span></span> = <span class='frac'><span class='top'>١٣</span><span class='bottom'>١٥</span></span>. نسبة الادخار = ١-<span class='frac'><span class='top'>١٣</span><span class='bottom'>١٥</span></span> = <span class='frac'><span class='top'>٢</span><span class='bottom'>١٥</span></span>، وتساوي ١٨٠٠. الراتب الكلي = ١٨٠٠÷<span class='frac'><span class='top'>٢</span><span class='bottom'>١٥</span></span> = ١٨٠٠×<span class='frac'><span class='top'>١٥</span><span class='bottom'>٢</span></span> = ١٣٥٠٠. الإجابة ج"},
{page:1091,q:"شخص يشرب كحد أدنى ٨أكواب يومياً، ويشرب ١٥كوباً كحد أعلى. فإذا شرب خلال ٤أيام ٥٥كوباً (بحيث كانت ٣أيام منها عند الحد الأعلى)، فما أقل عدد أكواب يشربه في اليوم المتبقي؟",opts:["٨","١٠","١٣","١٥"],ans:1,exp:"الأكواب التي شُربت في ٣أيام عند الحد الأعلى = ٣×١٥ = ٤٥. الأكواب المتبقية لليوم الرابع = ٥٥-٤٥ = ١٠ أكواب. الإجابة ب"},
{page:1097,q:"خالد اشترى حاسوبين، فقارن بين:<br>القيمة الأولى: شراء حاسوبين لكل واحد تخفيض ٣٠٪<br>القيمة الثانية: شراء الأول بالسعر الأصلي والثاني بتخفيض ٦٠٪",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:2,exp:"نفرض سعر الحاسوب الأصلي = ١٠٠. القيمة الأولى: كل حاسوب بخصم٣٠٪ = ٧٠، المجموع = ١٤٠. القيمة الثانية: الأول بسعر كامل=١٠٠، والثاني بخصم٦٠٪=٤٠، المجموع = ١٤٠. القيمتان متساويتان. الإجابة ج"},
{page:1119,q:"صندوق حجمه ١٢٠ وحدة مكعبة، يريد وضعه في كرتون، فسيختار العلبة التي تملأ الكرتون (نفس حجم الصندوق) من بين الخيارات التالية:",opts:["علبة أبعادها ٥ و٨ وارتفاعها ٤","علبة أبعادها ٦ و٥ وارتفاعها ٤","علبة أبعادها ٦ و٥ وارتفاعها ٣","علبة أبعادها ٥ و٧ وارتفاعها ٣"],ans:1,exp:"نحسب حجم كل خيار: أ) ٥×٨×٤=١٦٠. ب) ٦×٥×٤=١٢٠. ج) ٦×٥×٣=٩٠. د) ٥×٧×٣=١٠٥. الخيار (ب) هو الوحيد الذي يطابق حجم الصندوق (١٢٠) تماماً. الإجابة ب"},
{page:1121,q:"أوجد الحد السادس في المتتابعة التالية: ٢، ٥، ١٠، ١٧، ٢٦، ....",opts:["٣٦","٣٧","٣٨","٤٤"],ans:1,exp:"الفروقات بين الحدود المتتالية: ٥-٢=٣، ١٠-٥=٥، ١٧-١٠=٧، ٢٦-١٧=٩ (تزيد بمقدار ٢ كل مرة). الفرق التالي = ١١. الحد السادس = ٢٦+١١ = ٣٧. الإجابة ب"}
]},
{id:"set12",label:"المجموعة الثامنة (من ملف الأهم)",questions:[
{page:820,q:"٣ موظفين بدأوا العمل معاً ويأخذون إجازة بعد فترة دوام معينة، الأول فترة دوامه ٢١يوم وأخذ ٧أيام إجازة، الثاني فترة دوامه ٢٥يوم وأخذ ٥أيام إجازة، الثالث أخذ ٣أيام إجازة، فكم مدة دوامه؟",opts:["٢٧","٢٨","٢٩","٢٦"],ans:1,exp:"بملاحظة النمط بين مدة الدوام ومدة الإجازة للموظفَين الأول والثاني، وبتطبيق نفس النمط على الموظف الثالث الذي أخذ ٣أيام إجازة، تكون مدة دوامه = ٢٨يوماً. الإجابة ب"},
{page:885,q:"متحف يستقبل كل يوم ضعف عدد زوار اليوم السابق، فإذا تواجد به ٥٠٠ زائر في اليوم الأول، فكم يصبح إجمالي عدد الزوار (التراكمي) بحلول اليوم الرابع؟",opts:["٣٠٠٠","٣٥٠٠","٦٠٠٠","٧٥٠٠"],ans:3,exp:"عدد الزوار يومياً: اليوم١=٥٠٠، اليوم٢=١٠٠٠، اليوم٣=٢٠٠٠، اليوم٤=٤٠٠٠. المجموع التراكمي = ٥٠٠+١٠٠٠+٢٠٠٠+٤٠٠٠ = ٧٥٠٠. الإجابة د"},
{page:901,q:"رجل يأخذ كل ساعة ١٦ريالاً. قارن بين:<br>القيمة الأولى: المال الذي يأخذه خلال ٣ساعات<br>القيمة الثانية: ٣٦ريال",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"المال خلال ٣ساعات = ١٦×٣ = ٤٨ريالاً. بما أن ٤٨ أكبر من ٣٦، فالقيمة الأولى أكبر. الإجابة أ"},
{page:905,q:"لدينا مجموعة أطوال لثلاث طالبات بالسنتيمتر: ١٥٠، ١٢٠، ٩٠. أوجد المدى.",opts:["٥٠","٦٠","٨٠","١٢٠"],ans:1,exp:"المدى = أكبر قيمة - أصغر قيمة = ١٥٠-٩٠ = ٦٠. الإجابة ب"},
{page:918,q:"ما العدد الذي ثلاثة أمثال تربيعه ناقص ٢٧ يساوي صفراً؟",opts:["١","٢","٣","٦"],ans:2,exp:"المعادلة: ٣س²-٢٧=٠ ← ٣س²=٢٧ ← س²=٩ ← س=٣. الإجابة ج"},
{page:926,q:"عند كتابة الأعداد من ١ إلى ١٠٠، كم مرة يتم كتابة الرقم ٩؟",opts:["٩","١٠","١٥","٢٠"],ans:3,exp:"يظهر الرقم ٩ في خانة الآحاد ١٠مرات (٩،١٩،...،٩٩)، وفي خانة العشرات ١٠مرات (٩٠-٩٩)، مع عدم تكرار عدّ العدد٩٩ سوى مرة إضافية صحيحة ضمن الحالتين. المجموع الكلي = ٢٠ مرة. الإجابة د"},
{page:927,q:"إذا كان المتوسط الحسابي للأعداد: ٣، ٥، ٧، ٣٠، س يساوي ١٠، فما هو المنوال؟",opts:["٥","٦","٨","١٤"],ans:0,exp:"مجموع الأعداد الخمسة = ١٠×٥ = ٥٠. المعادلة: ٣+٥+٧+٣٠+س=٥٠ ← س=٥. الأعداد أصبحت: ٣، ٥، ٧، ٣٠، ٥. المنوال (الأكثر تكراراً) = ٥. الإجابة أ"},
{page:931,q:"عددان صحيحان موجبان حاصل ضربهما يساوي ٦٠ والفرق بينهما ٧، فكم حاصل جمعهما؟",opts:["٩","٢٠","١٧","١٩"],ans:2,exp:"بالتجربة: العددان ١٢ و٥ يحققان: ١٢×٥=٦٠ ✓، و١٢-٥=٧ ✓. مجموعهما = ١٢+٥ = ١٧. الإجابة ج"},
{page:1128,q:"ما العدد الذي إذا جمعناه مع العدد الذي يليه، ثم أضفنا الناتج إلى ١١، أصبح المجموع ٢٢؟",opts:["٥","٦","٧","٨"],ans:0,exp:"نفرض العدد = ن. المعادلة: ن+(ن+١)+١١=٢٢ ← ٢ن+١٢=٢٢ ← ٢ن=١٠ ← ن=٥. الإجابة أ"},
{page:1129,q:"إذا امتلأ خزان وقود السيارة إلى النصف فإن مؤشر البنزين يصنع زاوية قائمة (٩٠°)، فإذا امتلأ إلى الثلثين، كم الزاوية التي يصنعها المؤشر؟",opts:["١٠٠°","١٨٠°","١٦٠°","١٢٠°"],ans:3,exp:"بافتراض أن الزاوية تتناسب طردياً مع نسبة الامتلاء (حيث الامتلاء الكامل=١٨٠°، والنصف=٩٠°)، فإن الزاوية عند الثلثين = ١٨٠×<span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span> = ١٢٠°. الإجابة د"},
{page:1132,q:"إذا كان عمر أحمد أكبر من عمر خالد، وعمر سعود أصغر من عمر محمد، وعمر خالد أكبر من عمر محمد، فقارن بين:<br>القيمة الأولى: عمر أحمد<br>القيمة الثانية: عمر سعود",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:0,exp:"من المعطيات نرتب الأعمار تنازلياً: أحمد > خالد > محمد > سعود. إذن عمر أحمد هو الأكبر بينهم جميعاً، وعمر سعود هو الأصغر. القيمة الأولى أكبر حتماً. الإجابة أ"},
{page:1138,q:"كيس فيه عدد من الكرات (حمراء - خضراء - صفراء). إذا كانت <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span> الكرات خضراء وعددها ٨، و<span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span> الكرات حمراء، فما عدد الكرات الصفراء؟",opts:["٢","٣","٤","٥"],ans:2,exp:"بما أن <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span> الكرات = ٨ = خضراء، فإن العدد الكلي للكرات = ٢٤. عدد الكرات الحمراء = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>×٢٤ = ١٢. عدد الكرات الصفراء = ٢٤-٨-١٢ = ٤. الإجابة ج"},
{page:1140,q:"إذا كان متوسط أربعة أعداد صحيحة موجبة مختلفة يساوي ١١، فما أكبر عدد ممكن بينهم؟",opts:["٣٦","٣٧","٣٨","٣٩"],ans:2,exp:"مجموع الأعداد الأربعة = ١١×٤ = ٤٤. لجعل أحد الأعداد أكبر ما يمكن، نجعل البقية أصغر ما يمكن من أعداد صحيحة موجبة مختلفة: ١، ٢، ٣. أكبر عدد = ٤٤-(١+٢+٣) = ٣٨. الإجابة ج"},
{page:1159,q:"إذا كان وزن أحمد بعد الحمية يمثل <span class='frac'><span class='top'>٨</span><span class='bottom'>١٣</span></span> من وزنه السابق، علماً أن وزنه الآن ٨٠كيلوجراماً، فكم كان وزنه السابق؟",opts:["٩٠","١٠٠","١٢٠","١٣٠"],ans:3,exp:"المعادلة: <span class='frac'><span class='top'>٨</span><span class='bottom'>١٣</span></span>×الوزن السابق = ٨٠ ← الوزن السابق = ٨٠×<span class='frac'><span class='top'>١٣</span><span class='bottom'>٨</span></span> = ١٣٠كجم. الإجابة د"},
{page:1165,q:"مصنع ينتج ٥ ألعاب في ١٠٠دقيقة، كم لعبة يصنع في ١٨٠دقيقة؟",opts:["٦","٧","٨","٩"],ans:3,exp:"معدل الإنتاج = ٥÷١٠٠ = ٠٫٠٥ لعبة في الدقيقة. الإنتاج خلال ١٨٠دقيقة = ١٨٠×٠٫٠٥ = ٩ ألعاب. الإجابة د"},
{page:1172,q:"يزور المدينة المنورة يومياً ٤٥٠زائراً، فكم يبلغ عدد الزوار بعد مرور ٤٠يوماً؟",opts:["٨٠٠٠","١٢٠٠٠","١٦٠٠٠","١٨٠٠٠"],ans:3,exp:"عدد الزوار = ٤٥٠×٤٠ = ١٨٠٠٠ زائراً. الإجابة د"},
{page:1177,q:"أب وثلاثة أبناء، مجموع أعمارهم بعد ٨سنوات يساوي ٩٨. كم مجموع أعمارهم بعد ٥سنوات؟",opts:["٧٦","٨٦","٩٠","٩٢"],ans:1,exp:"عدد الأفراد = ٤، وكل سنة تزيد مجموع الأعمار بمقدار ٤. مجموع الأعمار الآن = ٩٨-(٨×٤) = ٩٨-٣٢ = ٦٦. بعد ٥سنوات = ٦٦+(٥×٤) = ٦٦+٢٠ = ٨٦. الإجابة ب"},
{page:1184,q:"طالب متوسط درجاته في خمس اختبارات ٤٥، إذا زاده المعلم ١٠درجات على مشاركته (أُضيفت لمجموع درجاته)، فكم أصبح متوسط درجاته الجديد؟",opts:["٤٦","٤٧","٥٢","٥٤"],ans:1,exp:"مجموع الدرجات الأصلي = ٤٥×٥ = ٢٢٥. بعد إضافة ١٠درجات: المجموع الجديد = ٢٣٥. المتوسط الجديد = ٢٣٥÷٥ = ٤٧. الإجابة ب"},
{page:1185,q:"إذا كان هناك خصم بنسبة ٢٥٪ على الحذاء، وسعره الأصلي ٥٠ريالاً، واشترينا ٤أحذية، فكم سيكون المبلغ الإجمالي المدفوع بالريال؟",opts:["١٠٠","١٢٠","١٥٠","١٧٥"],ans:2,exp:"السعر بعد الخصم للحذاء الواحد = ٥٠×٠٫٧٥ = ٣٧٫٥ريال. المبلغ الإجمالي لـ٤أحذية = ٣٧٫٥×٤ = ١٥٠ريالاً. الإجابة ج"},
{page:1196,q:"ما الحد التالي في المتتابعة: ٥، ٩، ١٥، ٢٣، ٣٣، ٤٥، ...؟",opts:["٤٥","٤٨","٥٢","٥٩"],ans:3,exp:"الفروقات بين الحدود: ٤، ٦، ٨، ١٠، ١٢ (تزيد بمقدار٢ كل مرة). الفرق التالي = ١٤. الحد التالي = ٤٥+١٤ = ٥٩. الإجابة د"},
{page:1207,q:"إذا قرأ شخص جزءاً واحداً من القرآن الكريم كل ٣أيام، فكم يوماً يحتاج ليختم القرآن (٣٠جزءاً)؟",opts:["٣٠","٦٠","٩٠","١٠٠"],ans:2,exp:"عدد الأيام = ٣٠جزءاً × ٣أيام لكل جزء = ٩٠ يوماً. الإجابة ج"},
{page:1208,q:"ما العدد الذي ناتج جذره التربيعي أكبر من ناتج تربيعه؟",opts:["<span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>","صفر","١","٢"],ans:0,exp:"بفحص الخيارات: عند <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>: الجذر=٠٫٥، والتربيع=٠٫٠٦٢٥، وبما أن ٠٫٥>٠٫٠٦٢٥ فهذا يحقق الشرط. أما عند صفر أو١ فإن الجذر والتربيع متساويان (وليس الجذر أكبر)، وعند٢ يكون التربيع أكبر من الجذر. الإجابة أ"},
{page:1211,q:"مستطيل محيطه = ٤٨، إذا نقص طوله ٢ وزاد عرضه ٢ أصبح مربعاً، فما مساحة المربع الناتج؟",opts:["٩٦","١١٨","١٤٤","١٨٦"],ans:2,exp:"من المحيط: الطول+العرض=٢٤. من شرط تحوله لمربع: الطول-٢=العرض+٢ ← الطول-العرض=٤. بحل المعادلتين: الطول=١٤، العرض=١٠. طول ضلع المربع = ١٤-٢=١٢. مساحة المربع = ١٢×١٢ = ١٤٤. الإجابة ج"},
{page:1212,q:"اشترى عادل عدداً من البيتزا ووزعها على ٦أشخاص، حيث قسّم كل بيتزا إلى ٨قطع متساوية وأعطى كل شخص أربع قطع. فما عدد البيتزا التي اشتراها عادل؟",opts:["٣","٦","٨","١٢"],ans:0,exp:"إجمالي القطع المطلوبة = ٦أشخاص × ٤قطع = ٢٤ قطعة. عدد البيتزا = ٢٤÷٨ = ٣ بيتزا. الإجابة أ"},
{page:1216,q:"فارس اشترى بنصف مبلغ عيدياته، ثم اشترى بنصف المبلغ المتبقي، وتبقى معه ٧٥ريالاً. فكم كان المبلغ الذي معه في البداية؟",opts:["٢٢٠","٢٥٠","٢٧٥","٣٠٠"],ans:3,exp:"بعد الشراء الأول تبقى نصف المبلغ. بعد الشراء الثاني (نصف المتبقي) يتبقى ربع المبلغ الأصلي، وهذا يساوي ٧٥. المبلغ الأصلي = ٧٥×٤ = ٣٠٠ريال. الإجابة د"},
{page:1223,q:"إذا كان المضاعف الخامس لعدد يساوي ٦٥، فما هو المضاعف الثالث لنفس العدد؟",opts:["٣٩","٤٠","٤١","٤٢"],ans:0,exp:"المعادلة: ٥×العدد = ٦٥ ← العدد = ١٣. المضاعف الثالث = ٣×١٣ = ٣٩. الإجابة أ"},
{page:1229,q:"تدرّب فهد في الأسبوع الماضي ٦ساعات، وكانت مدة تدريبه أكثر من الأسبوع الذي قبله بساعتين. فكم ساعة تدرب في الأسبوع الذي قبل الماضي؟",opts:["٢","٣","٤","٥"],ans:2,exp:"مدة التدريب في الأسبوع الذي قبل الماضي = ٦-٢ = ٤ ساعات. الإجابة ج"},
{page:1245,q:"إذا كان متوسط الأعداد: ٣، أ، ب يساوي ٢. قارن بين:<br>القيمة الأولى: أ+ب<br>القيمة الثانية: ٣",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:2,exp:"المتوسط = (٣+أ+ب)÷٣ = ٢ ← ٣+أ+ب = ٦ ← أ+ب = ٣. القيمتان متساويتان تماماً. الإجابة ج"},
{page:1251,q:"إذا كانت المعادلة ٢س = ٣+ص، حيث س، ص عددان صحيحان، فأي مما يلي صحيح دائماً؟",opts:["س عدد زوجي","ص عدد زوجي","س عدد فردي","ص عدد فردي"],ans:3,exp:"من المعادلة: ص = ٢س-٣. بما أن ٢س عدد زوجي دائماً (لأي عدد صحيح س)، فإن طرح ٣ (عدد فردي) من عدد زوجي ينتج دائماً عدداً فردياً. إذن ص عدد فردي دائماً. الإجابة د"},
{page:1252,q:"خمسة أعداد متوسطها الحسابي ٧. إذا أضفنا عدداً جديداً وبقي المتوسط الحسابي الجديد ٧ أيضاً، فما هذا العدد المضاف؟",opts:["٥","٦","٧","٨"],ans:2,exp:"لكي يبقى المتوسط ثابتاً عند إضافة عدد جديد، يجب أن يكون هذا العدد مساوياً للمتوسط نفسه، أي ٧. الإجابة ج"},
{page:1254,q:"مستطيل مساحته ٤٥سم²، قُسّم إلى ٥مربعات متساوية. فما مساحة المربع الواحد؟",opts:["٩","٦","٤","٢"],ans:0,exp:"مساحة المربع الواحد = ٤٥÷٥ = ٩سم². الإجابة أ"},
{page:1259,q:"في المعادلة: <span class='frac'><span class='top'>٥</span><span class='bottom'>س+١</span></span> + <span class='frac'><span class='top'>٥</span><span class='bottom'>١-س</span></span> = <span class='frac'><span class='top'>١٠</span><span class='bottom'>١-س²</span></span>، ما عدد الاحتمالات المستبعدة لقيم س (القيم التي تجعل المعادلة غير معرّفة)؟",opts:["صفر","١","٢","٣"],ans:2,exp:"بتوحيد المقامات، يتبين أن طرفي المعادلة متطابقان جبرياً لكل قيم س، باستثناء القيم التي تجعل المقام (١-س²) يساوي صفراً، وهما س=١ وس=-١. إذن عدد القيم المستبعدة = ٢. الإجابة ج"},
{page:1272,q:"سارة معها ٨٤٠ريالاً، وصرفت ثلث المبلغ لفستان، وربع المتبقي لكتاب. فكم تبقى معها؟",opts:["٤٠٠","٤١٠","٤٢٠","٤٣٠"],ans:2,exp:"بعد شراء الفستان يتبقى ثلثا المبلغ = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>×٨٤٠ = ٥٦٠. بعد شراء الكتاب (ربع المتبقي): يتبقى ٥٦٠-١٤٠ = ٤٢٠ريالاً. الإجابة ج"},
{page:1274,q:"شخص يقرأ ٣أجزاء من القرآن الكريم يومياً، فبعد كم يوم سيختم القرآن (٣٠جزءاً)؟",opts:["١٠","١٥","٢٠","٢٥"],ans:0,exp:"عدد الأيام = ٣٠÷٣ = ١٠ أيام. الإجابة أ"},
{page:1276,q:"يُراد لف شريط حول إطار ساعة دائري بمقدار لفتين ونصف، فإذا كان طول الشريط المستخدم ١٥٠سم، فما محيط إطار الساعة بالسنتيمتر؟",opts:["٢٠","٤٠","٦٠","٨٠"],ans:2,exp:"طول الشريط = عدد اللفات × محيط الإطار. المحيط = ١٥٠÷٢٫٥ = ٦٠سم. الإجابة ج"},
{page:1277,q:"مع خالد ٨٠٠ريال، ويريد شراء ٣أزواج من الأحذية، فإذا كان سعر الزوج الواحد ١٧٥ريالاً، فكم ريالاً يتبقى معه بعد الشراء؟",opts:["٢٥٠","٢٧٥","٣٠٠","٣٥٠"],ans:1,exp:"تكلفة ٣أزواج = ٣×١٧٥ = ٥٢٥ريالاً. المتبقي = ٨٠٠-٥٢٥ = ٢٧٥ريالاً. الإجابة ب"},
{page:1279,q:"ما ثالث عدد مشترك في النمطين الآتيين:<br>النمط الأول: ٣، ٦، ٩، ١٢، ...<br>النمط الثاني: ١٥، ١٩، ٢٣، ٢٧، ٣١، ٣٥، ٣٩...؟",opts:["٣٦","٣٩","٤٢","٤٥"],ans:1,exp:"النمط الأول هو مضاعفات ٣. من حدود النمط الثاني، الأعداد التي هي أيضاً من مضاعفات ٣ (بالترتيب): ١٥ (الأول)، ٢٧ (الثاني)، ٣٩ (الثالث). الإجابة ب"},
{page:1291,q:"إذا كان خالد يمشي ٣كيلومتر في الفجر و٥كيلومتر في العشاء، فكم المسافة الكلية التي يمشيها خلال عشرة أيام؟",opts:["٦٠","٧٠","٨٠","٩٠"],ans:2,exp:"المسافة اليومية = ٣+٥ = ٨كلم. المسافة خلال ١٠أيام = ٨×١٠ = ٨٠كلم. الإجابة ج"},
{page:1293,q:"يجمع خالد ٣ريالات يومياً لمدة شهر (٣٠يوماً) لشراء الشوكولاتة، فإذا كان سعر القطعة الواحدة ٣ريالات، فكم قطعة شوكولاتة يستطيع شراءها؟",opts:["٢٤","٣٠","٣٢","٣٤"],ans:1,exp:"المبلغ المُدّخر خلال الشهر = ٣×٣٠ = ٩٠ريالاً. عدد القطع = ٩٠÷٣ = ٣٠ قطعة. الإجابة ب"},
{page:1296,q:"يحتاج طباخ لإعداد رغيف خبز إلى طحين وماء بنسبة ٤:٦، لكنه عكس النسبة بالخطأ فأصبحت ٦:٤، فوضع ٦أكواب من الطحين مقابل ٤أكواب من الماء. كم كوباً من الماء يجب أن يضيف لتصحيح النسبة؟",opts:["٢","٣","٥","٩"],ans:2,exp:"النسبة الصحيحة (طحين:ماء) = ٤:٦ = ٢:٣. بما أن كمية الطحين ثابتة (٦أكواب)، فكمية الماء الصحيحة اللازمة = ٦×<span class='frac'><span class='top'>٣</span><span class='bottom'>٢</span></span> = ٩أكواب. الكمية الناقصة = ٩-٤ = ٥أكواب. الإجابة ج"},
{page:1297,q:"أيّ الأعداد الآتية يقبل القسمة على العدد ١ وعلى عددين أوليين متتاليين؟",opts:["٩٠","٩١","٩٢","٩٣"],ans:0,exp:"العددان الأوليان المتتاليان ٢ و٣: حاصل ضربهما = ٦. من بين الخيارات، العدد ٩٠ هو الوحيد الذي يقبل القسمة على ٦ (٩٠÷٦=١٥). الإجابة أ"},
{page:1299,q:"إذا كان خالد يدّخر ١٥٪ من راتبه للوقود، وكان يدفع للوقود ١٥٠٠ريال، فكم يبلغ راتب خالد؟",opts:["٨٥٠٠","٩٠٠٠","١٠٠٠٠","١٢٠٠٠"],ans:2,exp:"المعادلة: ٠٫١٥×الراتب = ١٥٠٠ ← الراتب = ١٥٠٠÷٠٫١٥ = ١٠٠٠٠ريال. الإجابة ج"},
{page:1300,q:"تدور الأرض حول الشمس في مدار دائري نصف قطره ١٥٠مليون كيلومتر، فما محيط مدار الأرض حول الشمس تقريباً بوحدة مليون كيلومتر؟ (π≈٣٫١٤)",opts:["٣١٤","٩٠٠","٥٠٠","٢٣٠"],ans:1,exp:"محيط المدار = ٢×π×نق = ٢×٣٫١٤×١٥٠ = ٩٤٢ تقريباً، وهو الأقرب لقيمة ٩٠٠ من بين الخيارات المتاحة. الإجابة ب"},
{page:1304,q:"مع شخص ١٥٠٠ريال، اشترى ٦كاسات سعر الواحدة ١٠ريالات، واشترى صحوناً بمبلغ ٢٥٠ريالاً. فكم ريالاً تبقى معه؟",opts:["١١٦٠","١١٥٠","١١٩٠","١١٢٠"],ans:2,exp:"تكلفة الكاسات = ٦×١٠ = ٦٠ريالاً. المتبقي = ١٥٠٠-٦٠-٢٥٠ = ١١٩٠ريالاً. الإجابة ج"},
{page:1317,q:"أب عمره ٣٦عاماً، وأعمار أبنائه الثلاثة: ١٤، ١٠، ٤. بعد كم سنة يصبح مجموع أعمار أبنائه مساوياً لعمر الأب (عندئذ)؟",opts:["٢","٣","٤","٥"],ans:2,exp:"نفرض عدد السنوات = ن. عمر الأب بعدها = ٣٦+ن. مجموع أعمار الأبناء الثلاثة بعدها = (١٤+١٠+٤)+٣ن = ٢٨+٣ن. المعادلة: ٣٦+ن = ٢٨+٣ن ← ٨=٢ن ← ن=٤. الإجابة ج"},
{page:1322,q:"وزن علبة تفاح ٤٤٠جراماً، إذا أفرغنا ربع التفاح وأصبح وزنها الجديد ٣٤٠جراماً، فما وزن العلبة فارغة بنفس الوحدة؟",opts:["٤٠","٦٠","٩٠","١٢٠"],ans:0,exp:"نفرض وزن العلبة الفارغة=ف، ووزن التفاح الكلي=ت. المعادلة الأولى: ف+ت=٤٤٠. بعد إفراغ ربع التفاح: ف+<span class='frac'><span class='top'>٣</span><span class='bottom'>٤</span></span> ت=٣٤٠. بطرح المعادلتين: <span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span> ت=١٠٠ ← ت=٤٠٠. ف=٤٤٠-٤٠٠=٤٠. الإجابة أ"},
{page:1327,q:"ما مجموع العوامل الأولية للعدد ٣٠؟",opts:["٨","٩","١٠","١١"],ans:2,exp:"٣٠ = ٢×٣×٥. مجموع العوامل الأولية = ٢+٣+٥ = ١٠. الإجابة ج"},
{page:1332,q:"تُؤجَّر عربة بسعر ٢٥ريالاً لكل ١٥دقيقة، فإذا استأجرها شخص لمدة ساعة كاملة، فكم ريالاً سيدفع؟",opts:["٧٥","١٠٠","١٢٠","١٢٥"],ans:1,exp:"الساعة = ٦٠دقيقة = ٤ فترات من ١٥دقيقة. المبلغ = ٤×٢٥ = ١٠٠ريال. الإجابة ب"},
{page:1349,q:"من الأعداد من ١ إلى ٩، أوجد نسبة الأعداد التي تقبل القسمة على ٣.",opts:["<span class='frac'><span class='top'>١</span><span class='bottom'>٤</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٧</span></span>"],ans:1,exp:"الأعداد من ١ إلى ٩ التي تقبل القسمة على ٣ هي: ٣، ٦، ٩ — أي ٣ أعداد من أصل ٩. النسبة = <span class='frac'><span class='top'>٣</span><span class='bottom'>٩</span></span> = <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>. الإجابة ب"}
]},
{id:"set13",label:"تكملة أخيرة (من ملف الأهم)",questions:[
{page:1188,q:"ما أكبر قاسم مشترك للأعداد الطبيعية من ١ إلى ١٠٠؟",opts:["١","٣","٥","٢"],ans:0,exp:"بما أن العدد ١ نفسه من ضمن هذه الأعداد، وهو يقبل القسمة فقط على واحد، فإن أكبر قاسم مشترك بين جميع الأعداد من ١ إلى ١٠٠ هو ١. الإجابة أ"},
{page:1219,q:"ما المتوسط الحسابي للأعداد الطبيعية من ٢ إلى ٧٩؟",opts:["٣٤","٣٥","٤٠","٤٠٫٥"],ans:3,exp:"بما أن الأعداد من ٢ إلى ٧٩ متتالية، فإن متوسطها الحسابي يساوي متوسط الحدين الأول والأخير: (٢+٧٩)÷٢ = ٤٠٫٥. الإجابة د"},
{page:1285,q:"في مسجد ١٠ صفوف كل صف مكون من ٢٠ مصلياً، وبعد جائحة كورونا أصبح نصف الصفوف فارغة، فما عدد المصلين بعد الجائحة؟",opts:["٨٠","٩٠","١٠٠","١١٠"],ans:2,exp:"عدد الصفوف المتبقية (الممتلئة) = ١٠÷٢ = ٥ صفوف. عدد المصلين = ٥×٢٠ = ١٠٠ مصلٍ. الإجابة ج"},
{page:1315,q:"اشترى بائع أحذية ٤ مقاسات مختلفة، وكان عدد الأحذية المباعة من كل مقاس يساوي نصف عدد الأحذية المباعة من المقاس الذي قبله، فإذا باع من المقاس الأخير ١٠أحذية، فكم إجمالي عدد الأحذية التي باعها؟",opts:["١٢٥","١٣٠","١٤٠","١٥٠"],ans:3,exp:"بما أن كل مقاس يبيع نصف ما قبله، وآخر مقاس باع ١٠، فإن المقاسات باعت بالترتيب العكسي: ٨٠، ٤٠، ٢٠، ١٠. المجموع الكلي = ٨٠+٤٠+٢٠+١٠ = ١٥٠ حذاءً. الإجابة د"},
{page:1334,q:"أسطوانة نريد ملأها بالماء باستخدام قمع على شكل مخروط، فإذا كانت مساحة قاعدة المخروط مساوية لمساحة قاعدة الأسطوانة، وارتفاع المخروط مساوياً لارتفاع الأسطوانة، فكم مرة نحتاج إلى ملء القمع لتعبئة الأسطوانة بالكامل؟",opts:["١","٢","٣","٤"],ans:2,exp:"حجم المخروط = ثلث حجم الأسطوانة (عند تساوي القاعدة والارتفاع)، لذا نحتاج إلى ملء القمع ٣ مرات لتعبئة الأسطوانة بالكامل. الإجابة ج"},
{page:1337,q:"قطعت سيارة مسافة ٦٥٠كم خلال ٤ساعات و٢٠دقيقة، فإذا استمرت بالسير بالمعدل نفسه، وكانت تبعد عن محطة الوقود ١٠كم، فكم دقيقة تستغرق للوصول إلى المحطة؟",opts:["٢","٣","٤","٦"],ans:2,exp:"الزمن الكلي = ٤ساعات و٢٠دقيقة = ٢٦٠دقيقة. سرعة السيارة = ٦٥٠÷٢٦٠ = ٢٫٥ كم/دقيقة. الزمن اللازم لقطع ١٠كم = ١٠÷٢٫٥ = ٤ دقائق. الإجابة ج"},
{page:1351,q:"خرج شخص من مدينة تبوك إلى حائل بسرعة ٩٥كم/س، إذا كانت المسافة ٦٦٥كم، فبعد كم ساعة يصل إلى حائل؟",opts:["٥","٦","٧","٨"],ans:2,exp:"الزمن = المسافة÷السرعة = ٦٦٥÷٩٥ = ٧ ساعات. الإجابة ج"}
]},
{id:"set14",label:"أسئلة هندسية واحتمالات (من ملف الأهم)",questions:[
{page:324,q:"دائرة مركزها م، ونصف قطرها (م أ) = ٥سم. رُسم من المركز م عمود على الوتر أب، وطول هذا العمود = ٣سم (ونقطة تقاطعه مع الوتر تنصّف الوتر). أوجد طول الوتر أب بالسنتيمتر.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٠","١٥","٣","٨"],ans:3,exp:"بما أن العمود من مركز الدائرة على أي وتر ينصّف ذلك الوتر، فإن المثلث الناتج (نق، نصف الوتر، والعمود) قائم الزاوية بأضلاع ٣، ٤، ٥ (مثلث فيثاغورث): نق=٥ (الوتر الأكبر)، والعمود=٣، فيكون نصف طول أب = ٤. طول الوتر الكامل أب = ٢×٤ = ٨. الإجابة د"},
{page:180,q:"مثلث قائم الزاوية مرسوم داخل دائرة بحيث يكون الضلع أب (وتر المثلث) هو نفسه قطر الدائرة، وطولا ضلعي القائمة للمثلث هما ٦سم و٨سم. أوجد طول نصف قطر الدائرة.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٠","٥","٨","٦"],ans:1,exp:"بما أن المثلث قائم الزاوية ووتره هو قطر الدائرة (نظرية الزاوية المحاطة بنصف دائرة)، فإن طول الوتر = √(٦²+٨²) = √١٠٠ = ١٠ (باستخدام فيثاغورث: ٦²+٨²=٣٦+٦٤=١٠٠). القطر=١٠، إذن نصف القطر = ١٠÷٢ = ٥. الإجابة ب"},
{page:613,q:"دائرة مركزها م، وفيها زاوية مركزية ب م ج قياسها ٣٦°. أوجد قياس القوس ج ب.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٧٢","١٨","٩٠","٣٦"],ans:3,exp:"قياس القوس المقابل لزاوية مركزية يساوي قياس تلك الزاوية نفسها. إذن قياس القوس ج ب = ٣٦°. الإجابة د"},
{page:656,q:"مربع مرسوم بحيث تقع رؤوسه الأربعة على دائرة (أي أن قطر الدائرة يساوي القطر الأكبر للمربع)، فإذا كان قطر الدائرة = ٢√٢، فما محيط المربع؟<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢","٤","٨","١٦"],ans:2,exp:"قطر الدائرة = القطر (المحور الأكبر) للمربع = ٢√٢. طول ضلع المربع = القطر÷√٢ = ٢√٢÷√٢ = ٢. محيط المربع = ٤×٢ = ٨. الإجابة ج"},
{page:908,q:"مستطيل كبير مقسّم بخط أفقي وخط رأسي إلى ٤ مستطيلات صغيرة. مساحة المستطيل الصغير أعلى اليسار = ٩، ومساحة أعلى اليمين = ٦، ومساحة أسفل اليمين = ٨. احسب مساحة المستطيل الكبير الكلية.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٦","٢٣","٣٥","٤٢"],ans:2,exp:"بما أن المستطيلات في نفس العمود تتشارك نفس العرض، والمستطيلات في نفس الصف تتشارك نفس الارتفاع، فإن النسبة بين مساحتي أعلى اليسار وأعلى اليمين (٩:٦) تساوي نسبة أسفل اليسار إلى أسفل اليمين. مساحة أسفل اليسار = (٩/٦)×٨ = ١٢. المساحة الكلية = ٩+٦+١٢+٨ = ٣٥. الإجابة ج"},
{page:855,q:"مربع، وم هي نقطة تقاطع قطري المربع (مركزه)، والمسافة من م إلى أحد رؤوس المربع (أ) = ٤√٢. أوجد مساحة المربع.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٦","٢٥","٣٦","٦٤"],ans:3,exp:"المسافة من مركز المربع إلى أحد رؤوسه تساوي نصف طول القطر. إذن طول القطر الكامل = ٢×٤√٢ = ٨√٢. طول ضلع المربع = القطر÷√٢ = ٨√٢÷√٢ = ٨. مساحة المربع = ٨×٨ = ٦٤. الإجابة د"},
{page:572,q:"إذا كان طول ضلع مربع يساوي ٢سم، وكان هذا المربع محيطاً بدائرة (أي الدائرة مرسومة داخل المربع وتماس أضلاعه الأربعة)، فأي العبارات التالية صحيحة؟",opts:["مساحة المربع تساوي مساحة الدائرة","مجموع مساحة المربع ومساحة الدائرة = ٨ط","مساحة المربع أكبر من مساحة الدائرة","مساحة الدائرة أكبر من مساحة المربع"],ans:2,exp:"طول ضلع المربع = ٢سم، فتكون مساحته = ٤سم². قطر الدائرة المحاطة بالمربع = ٢سم (نفس ضلع المربع)، فنصف قطرها = ١سم، ومساحتها = π×١² ≈ ٣٫١٤سم². بما أن ٤ أكبر من ٣٫١٤، فإن مساحة المربع أكبر من مساحة الدائرة. الإجابة ج"},
{page:589,q:"مربع طول ضلعه ٦سم قُسم إلى مستطيلين متطابقين، فإذا وُضعا بجانب بعضهما (من الجهة الطويلة) كوّنا مستطيلاً واحداً، فما محيط هذا المستطيل الجديد؟",opts:["٢٠","٢٥","٣٠","٣٦"],ans:2,exp:"عند تقسيم المربع (٦×٦) إلى مستطيلين متطابقين، يكون كل مستطيل أبعاده ٦×٣. عند وضع المستطيلين جنباً إلى جنب من جهة الضلع الأقصر (٣)، ينتج مستطيل أبعاده ١٢×٣. محيط المستطيل الجديد = ٢×(١٢+٣) = ٣٠. الإجابة ج"},
{page:482,q:"مربع مساحته ٦٤سم². قُسّم المربع بخطوط رأسية متوازية إلى شرائح متساوية عرض كل شريحة منها ٢سم. ما أطول طول ممكن لأحد هذه المستطيلات الناتجة بالسنتيمتر؟<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٨","١٢","١٦","٣٢"],ans:0,exp:"مساحة المربع = ٦٤سم²، فطول ضلعه = √٦٤ = ٨سم. عند تقسيمه بخطوط رأسية إلى شرائح، يبقى ارتفاع كل شريحة (وهو أطول بعد فيها) مساوياً لضلع المربع الأصلي = ٨سم، بغض النظر عن عرض الشريحة. الإجابة أ"},
{page:628,q:"شكل رباعي مكوّن من مثلثين قائمي الزاوية يشتركان في نفس الوتر (القطر الفاصل بينهما). المثلث الأول ضلعاه القائمان طولهما ٦سم و٨سم. المثلث الثاني أحد ضلعيه القائمين طوله ٥سم، والضلع الآخر (القائم) مجهول، وكلاهما يشترك مع المثلث الأول في نفس طول الوتر. أوجد طول الضلع المجهول.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٣√٥","٥√٣","٥√٢","٢√٥"],ans:1,exp:"طول الوتر المشترك (من المثلث الأول) = √(٦²+٨²) = √(٣٦+٦٤) = ١٠ (فيثاغورث على ٦، ٨). في المثلث الثاني: أحد الضلعين=٥، والوتر=١٠، فالضلع المجهول = √(١٠²-٥²) = √(١٠٠-٢٥) = √٧٥ = ٥√٣. الإجابة ب"},
{page:740,q:"مثلث قائم الزاوية طول قاعدته الكلية ١٢سم. رُسم داخله خط موازٍ للقاعدة يقسمه إلى مثلث علوي صغير وجزء سفلي، بحيث يكون طول القطعة الموازية للقاعدة (عند خط التقسيم) = ٦سم، وارتفاع الجزء السفلي (من القاعدة إلى خط التقسيم) = ٤سم. ما الفرق بين مساحة المثلث الكبير الأصلي بأكمله ومساحة المثلث الصغير العلوي الناتج عن القسمة؟<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢٤","٣٦","٣٠","٧٢"],ans:1,exp:"بما أن طول القطعة الداخلية (٦) نصف طول القاعدة (١٢)، فإن المثلث الصغير العلوي يشابه المثلث الكبير بنسبة ١:٢، أي أن ارتفاعه يساوي نصف الارتفاع الكلي للمثلث الكبير. بما أن ارتفاع الجزء السفلي (من القاعدة حتى خط التقسيم) = ٤، وهذا يمثل النصف الآخر من الارتفاع الكلي، فإن الارتفاع الكلي = ٨، وارتفاع المثلث الصغير = ٨-٤ = ٤. مساحة المثلث الكبير = ٠٫٥×١٢×٨=٤٨. مساحة المثلث الصغير = ٠٫٥×٦×٤=١٢. الفرق = ٤٨-١٢ = ٣٦. الإجابة ب"},
{page:335,q:"دائرة مركزها م. زاوية مركزية عند م قياسها ٥٠°، وزاوية أخرى (س) رأسها نقطة على محيط الدائرة، وكلتا الزاويتين تحصران نفس القوس. أوجد قياس الزاوية س.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢٠","٢٥","٣٠","٣٥"],ans:1,exp:"بحسب نظرية الزاوية المحيطية، فإن قياس الزاوية المحيطية يساوي نصف قياس الزاوية المركزية التي تحصر نفس القوس. إذن س = ٥٠÷٢ = ٢٥°. الإجابة ب"},
{page:1096,q:"شكل سداسي منتظم، أوجد قياس الزاوية الخارجية (س) عند أحد رؤوسه (الزاوية المكوّنة بين ضلع من أضلاعه وامتداد الضلع المجاور له).<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٦٠","٩٠","١٢٠","١٣٥"],ans:0,exp:"مجموع الزوايا الخارجية لأي مضلع منتظم = ٣٦٠°، وبما أن السداسي المنتظم له ٦ زوايا خارجية متساوية، فإن كل زاوية خارجية = ٣٦٠÷٦ = ٦٠°. الإجابة أ"},
{page:1301,q:"سداسيان منتظمان متطابقان، طول ضلع كل منهما ٣سم، مُلصقان معاً بحيث يتشاركان في ضلع واحد بينهما (فيصبح هذا الضلع المشترك داخلياً وغير ظاهر في محيط الشكل الناتج). فما محيط الشكل الناتج بالسنتيمتر؟<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢٤","٣٠","٣٣","٣٦"],ans:1,exp:"كل سداسي منتظم له ٦ أضلاع طول كل منها ٣سم. عند إلصاق السداسيين على ضلع مشترك، يختفي هذا الضلع من كلا الشكلين من محيط الشكل الناتج (أي يُحذف مرتين، مرة من كل سداسي). عدد الأضلاع الظاهرة في المحيط = (٦+٦)-٢ = ١٠ أضلاع. المحيط = ١٠×٣ = ٣٠سم. الإجابة ب"},
{page:304,q:"أي القيم التالية لا يمكن أن تكون أطوال أضلاع مثلث؟<br>الأول: ٦، ٥، ٧ — الثاني: ٥<span class='frac'><span class='top'>١</span><span class='bottom'>٧</span></span>، ٥<span class='frac'><span class='top'>١</span><span class='bottom'>٧</span></span>، ٥<span class='frac'><span class='top'>١</span><span class='bottom'>٧</span></span> — الثالث: ٣، ٢، ٤ — الرابع: ٤، ١، ٦",opts:["الأول","الثاني","الثالث","الرابع"],ans:3,exp:"لتكوين مثلث صحيح، يجب أن يكون مجموع أي ضلعين أكبر من الضلع الثالث. في المجموعة الرابعة (٤، ١، ٦): مجموع أصغر ضلعين = ٤+١ = ٥، وهذا أصغر من الضلع الثالث (٦)، فلا يمكن أن تكون أطوال أضلاع مثلث. أما باقي المجموعات فتحقق الشرط. الإجابة د"},
{page:1189,q:"شخص يمشي حول أرض مربعة الشكل مرة ونصف (١٫٥ مرة)، فقطع مسافة ٢٤٠٠متر. فكم طول ضلع هذه الأرض المربعة بالمتر؟",opts:["٢٠٠","٣٠٠","٤٠٠","٦٠٠"],ans:2,exp:"المسافة التي قطعها = ١٫٥ × محيط المربع = ٢٤٠٠ ← محيط المربع = ٢٤٠٠÷١٫٥ = ١٦٠٠متر. طول الضلع = المحيط÷٤ = ١٦٠٠÷٤ = ٤٠٠متر. الإجابة ج"},
{page:1207,q:"احسب محيط مربع إحداثيات رؤوسه: (٣، ٣)، (٢-، ٣)، (٣، ٢-)، (٢-، ٢-).",opts:["٨","١٢","١٨","٢٠"],ans:3,exp:"طول ضلع المربع = الفرق بين الإحداثيات المتجاورة = ٣-(٢-) = ٥. محيط المربع = ٤×٥ = ٢٠. الإجابة د"},
{page:1148,q:"إذا كانت مساحة مربع على رسم هندسي = ١٠٠سم²، وكان مقياس الرسم ٢سم : ١متر (أي كل ٢سم في الرسم يمثلان ١متراً في الواقع)، فكم مساحة المربع الحقيقي بالمتر المربع؟",opts:["٢٠","٢٥","٤٥","٥٥"],ans:1,exp:"طول ضلع المربع في الرسم = √١٠٠ = ١٠سم. بما أن كل ٢سم في الرسم = ١متر في الواقع، فإن ١سم في الرسم = ٠٫٥متر، وطول الضلع الحقيقي = ١٠×٠٫٥ = ٥أمتار. مساحة المربع الحقيقي = ٥×٥ = ٢٥م². الإجابة ب"},
{page:121,q:"ثلاث دوائر متطابقة مرصوصة في صف واحد داخل مستطيل، بحيث تلامس كل دائرة الدائرة المجاورة لها، وتلامس أيضاً الضلعين العلوي والسفلي للمستطيل (أي أن عرض المستطيل = قطر دائرة واحدة، وطوله = مجموع أقطار الدوائر الثلاث). إذا كانت مساحة كل دائرة = ٩ط، فأوجد مساحة المستطيل.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٠٨","٩٠","١٢٠","٦٠"],ans:0,exp:"من مساحة الدائرة: نق²=٩ ← نق=٣، والقطر = ٦. عرض المستطيل = القطر = ٦. طول المستطيل = ٣ أقطار = ٣×٦=١٨. مساحة المستطيل = ٦×١٨ = ١٠٨. الإجابة أ"},
{page:987,q:"مربع صغير رؤوسه الأربعة تقع عند منتصف أضلاع مربع كبير (فيبدو كمعيّن بالنسبة للمربع الكبير). إذا كانت مساحة المربع الكبير = ١٦، فأوجد مساحة المربع الصغير.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢","٤","٨","١٢"],ans:2,exp:"عندما تصل رؤوس مربع بمنتصفات أضلاع مربع آخر، تكون مساحة المربع الداخلي (الناتج) دائماً نصف مساحة المربع الخارجي. مساحة المربع الصغير = ١٦÷٢ = ٨. الإجابة ج"},
{page:1250,q:"مربع أبجد مساحته الكلية = ١٠٠، مقسّم بخطين (أفقي ورأسي يمران من منتصف أضلاعه) إلى أربعة أرباع متساوية المساحة. أحد هذه الأرباع الأربعة مظلل. أوجد مساحة الجزء المظلل.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢٠","٢٥","٣٠","٤٠"],ans:1,exp:"بما أن المربع قُسّم إلى ٤ أجزاء متساوية تماماً، فإن مساحة كل جزء = ١٠٠÷٤ = ٢٥. الإجابة ب"},
{page:1325,q:"مستطيل طوله ١٢سم وعرضه ٨سم، وبداخله مربع مظلل طول ضلعه ٦سم بالكامل ضمن حدود المستطيل. أوجد مساحة الجزء غير المظلل من المستطيل (أي مساحة المستطيل مطروحاً منها مساحة المربع).<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٥٢","٥٤","٦٠","٦٤"],ans:2,exp:"مساحة المستطيل = ١٢×٨ = ٩٦. مساحة المربع = ٦×٦ = ٣٦. مساحة الجزء غير المظلل = ٩٦-٣٦ = ٦٠. الإجابة ج"},
{page:204,q:"سبعة مربعات متطابقة مُتلاصقة في صف واحد، شكّلت معاً مستطيلاً محيطه = ٣٢. احسب مساحة هذا المستطيل.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٤","٢٨","٣٢","٣٦"],ans:1,exp:"إذا كان طول ضلع المربع الواحد = س، فإن طول المستطيل = ٧س وعرضه = س. محيط المستطيل = ٢(٧س+س) = ١٦س = ٣٢ ← س=٢. مساحة المستطيل = ٧س×س = ٧×٢×٢ = ٢٨. الإجابة ب"},
{page:359,q:"مستطيل مرسوم بحيث يقع بالكامل داخل دائرة ورؤوسه الأربعة تلامس محيط الدائرة (أي أن قطر المستطيل يقع على قطر الدائرة). أي المعطيات التالية لا يفيد في حساب مساحة الدائرة؟<br>أ: طولا ضلعي المستطيل = ٨سم و٦سم<br>ب: محيط الدائرة = ١٠ط<br>ج: مساحة المستطيل = ٤٨سم²<br>د: مجموع قطري المستطيل = ٢٠سم<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["أ","ب","ج","د"],ans:2,exp:"لحساب مساحة الدائرة نحتاج معرفة قطرها، وهو نفسه قطر المستطيل. المعطى (أ) يمكّننا من حساب القطر بفيثاغورث (√(٨²+٦²)=١٠). المعطى (ب) يعطي القطر مباشرة من المحيط. المعطى (د) يعطي القطر مباشرة (فكل قطر=١٠). أما المعطى (ج) وهو مساحة المستطيل فقط (٤٨) فلا يكفي وحده لتحديد طول القطر بشكل قطعي، لأن مستطيلات مختلفة الأبعاد يمكن أن يكون لها نفس المساحة بأقطار مختلفة. الإجابة ج"},
{page:440,q:"مثلث أبج مساحته = ٨٠. نقطة م منتصف الضلع أب، ونقطة ن منتصف الضلع أج، والقطعة مـن توازي الضلع بج. أوجد مساحة المثلث أمن.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٦","١٨","٢٠","٢٤"],ans:2,exp:"بما أن م، ن منتصفا ضلعين في المثلث و مـن يوازي الضلع الثالث (بج)، فإن المثلث أمن يشابه المثلث أبج بنسبة ١:٢ (نظرية منتصفي الضلعين). نسبة المساحات = مربع نسبة التشابه = ١:٤. مساحة المثلث أمن = ٨٠÷٤ = ٢٠. الإجابة ج"},
{page:1265,q:"دائرتان: دائرة كبيرة نصف قطرها = ١٤سم، ودائرة صغيرة تقع بالكامل داخلها بحيث تمر بمركز الدائرة الكبيرة ويلامس طرفها الآخر محيط الدائرة الكبيرة (أي أن قطر الدائرة الصغيرة = نصف قطر الدائرة الكبيرة). أوجد مساحة الجزء المظلل (مساحة الدائرة الكبيرة ناقص مساحة الدائرة الصغيرة) بالسنتيمتر المربع، علماً أن ط ≈ <span class='frac'><span class='top'>٢٢</span><span class='bottom'>٧</span></span>.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٤٦٢","٨٠٠","٩١٦","٥٨٨"],ans:0,exp:"مساحة الدائرة الكبيرة = ط×١٤² = <span class='frac'><span class='top'>٢٢</span><span class='bottom'>٧</span></span>×١٩٦ = ٦١٦. نصف قطر الدائرة الصغيرة = نصف قطر الكبيرة÷٢ = ٧سم. مساحة الدائرة الصغيرة = <span class='frac'><span class='top'>٢٢</span><span class='bottom'>٧</span></span>×٧² = <span class='frac'><span class='top'>٢٢</span><span class='bottom'>٧</span></span>×٤٩ = ١٥٤. مساحة الجزء المظلل = ٦١٦-١٥٤ = ٤٦٢. الإجابة أ"},
{page:1268,q:"دائرة، ومربع بداخلها بحيث يقع أحد رؤوس المربع عند مركز الدائرة تماماً، ويمتد أحد ضلعي المربع من المركز حتى محيط الدائرة (أي أن طول ضلع المربع = نصف قطر الدائرة = ٥سم). أوجد مساحة المربع بالسنتيمتر المربع.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٢٥","٣٦","٤٩","٦٤"],ans:0,exp:"طول ضلع المربع = نصف قطر الدائرة = ٥سم. مساحة المربع = ٥×٥ = ٢٥سم². الإجابة أ"},
{page:1105,q:"صندوق (متوازي مستطيلات) أبعاده ٥سم، ٣سم، ٢سم، مملوء بالكامل بالرمل. أوجد حجم الرمل داخل الصندوق.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["١٨","٢٥","٢٠","٣٠"],ans:3,exp:"حجم متوازي المستطيلات = الطول×العرض×الارتفاع = ٥×٣×٢ = ٣٠سم³. الإجابة د"},
{page:232,q:"مستطيل أبعاده ١٢٠سم و٦٠سم، يُراد تغطيته بالكامل بأوراق مربعة الشكل طول ضلع كل منها ٢٠سم. كم عدد الأوراق اللازمة؟",opts:["١٢","١٤","١٦","١٨"],ans:3,exp:"مساحة المستطيل = ١٢٠×٦٠ = ٧٢٠٠سم². مساحة الورقة المربعة الواحدة = ٢٠×٢٠ = ٤٠٠سم². عدد الأوراق = ٧٢٠٠÷٤٠٠ = ١٨ ورقة. الإجابة د"},
{page:514,q:"مثلث مجموع قياسي زاويتين منه (أ، ب) = ٩٠°. إذا كانت الزاوية أ = (٣س-٨)، والزاوية ب = (٥س+١٠)، فما قياس الزاوية الأصغر بينهما؟",opts:["١١","٢٥","٥٥","٦٥"],ans:1,exp:"المعادلة: (٣س-٨)+(٥س+١٠) = ٩٠ ← ٨س+٢=٩٠ ← س=١١. قياس الزاوية أ = ٣(١١)-٨ = ٢٥°. قياس الزاوية ب = ٥(١١)+١٠ = ٦٥°. أصغر الزاويتين = ٢٥°. الإجابة ب"},
{page:1089,q:"تبلغ الطاقة الاستيعابية لرافعة في أحد الموانئ ٢٠ حاوية من الحجم الكبير، أو ٢٤ حاوية من الحجم المتوسط (أي أن سعتها بالحجم المتوسط تعادل ٢٤ حاوية). إذا وضع عامل ١٥ حاوية من الحجم الكبير في هذه الرافعة، فما أكبر عدد من حاويات الحجم المتوسط يستطيع أن يضعه في السعة المتبقية؟",opts:["٦","٨","١٢","١٦"],ans:0,exp:"السعة الكلية للرافعة (بوحدة الحاويات الكبيرة) = ٢٠. كل حاوية كبيرة تعادل ٢٤÷٢٠=١٫٢ حاوية متوسطة. السعة المتبقية بعد وضع ١٥ حاوية كبيرة = ٥ وحدات كبيرة، وتعادل بالحجم المتوسط = ٥×١٫٢ = ٦ حاويات. الإجابة أ"},
{page:206,q:"الزاوية س ص ع قياسها = ٦٠°، وينصّفها الشعاع ص م (فينتج عن ذلك زاويتان متساويتان: س ص م، وم ص ع، قياس كل منهما ٣٠°). ثم الزاوية م ص ع (٣٠°) ينصّفها بدورها الشعاع ص ن. أوجد قياس الزاوية س ص ن.<br><span style='color:#fbbf24;font-size:0.85em'>⚠ هذا السؤال في الأصل مرفق برسم توضيحي؛ النص التالي وصف دقيق لذلك الرسم بنفس الأرقام الواردة فيه حرفياً.</span>",opts:["٤٥","٥٥","٦٠","٣٠"],ans:0,exp:"قياس الزاوية س ص م = ٣٠° (نصف الزاوية الأصلية ٦٠°). قياس الزاوية م ص ن = نصف زاوية م ص ع = ٣٠÷٢=١٥°. قياس الزاوية س ص ن = س ص م + م ص ن = ٣٠+١٥ = ٤٥°. الإجابة أ"},
{page:734,q:"مكعب أرقامه مُعدَّدة من ١ إلى ٦ (نرد عادي)، ما احتمال ظهور عدد أكبر من ٤ عند رميه؟",opts:["<span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>","<span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>","<span class='frac'><span class='top'>٣</span><span class='bottom'>٤</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>"],ans:3,exp:"الأعداد الأكبر من ٤ على النرد هما ٥ و٦، أي عددان من أصل ٦ أعداد ممكنة. الاحتمال = <span class='frac'><span class='top'>٢</span><span class='bottom'>٦</span></span> = <span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>. الإجابة د"},
{page:1036,q:"مكعب (نرد) مساحة سطحه الكلية = ٥٤. قارن بين:<br>القيمة الأولى: طول حرف المكعب<br>القيمة الثانية: ٦",opts:["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],ans:1,exp:"مساحة سطح المكعب = ٦×(طول الحرف)². المعادلة: ٦×(طول الحرف)²=٥٤ ← (طول الحرف)²=٩ ← طول الحرف = ٣. بما أن ٣ أصغر من ٦، فالقيمة الثانية أكبر. الإجابة ب"},
{page:387,q:"مكعب (نرد عادي) مع قطعة نقدية، إذا رُميا معاً في نفس الوقت، فما احتمال ظهور شعار (من القطعة) مع الرقم واحد (من النرد) معاً؟",opts:["<span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٩</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>١٢</span></span>"],ans:3,exp:"احتمال ظهور الشعار من القطعة = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span>، واحتمال ظهور الرقم واحد من النرد = <span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span>. بما أن الحدثين مستقلان، فاحتمال حدوثهما معاً = <span class='frac'><span class='top'>١</span><span class='bottom'>٢</span></span> × <span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span> = <span class='frac'><span class='top'>١</span><span class='bottom'>١٢</span></span>. الإجابة د"},
{page:447,q:"صندوق (على شكل مكعب) بداخله كرتان حمراوان، و٣كرات صفراء، وكرة بيضاء واحدة. إذا سُحبت كرة عشوائياً، فما احتمال أن تكون الكرة المسحوبة غير حمراء؟",opts:["<span class='frac'><span class='top'>١</span><span class='bottom'>٦</span></span>","<span class='frac'><span class='top'>١</span><span class='bottom'>٣</span></span>","<span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>","<span class='frac'><span class='top'>٥</span><span class='bottom'>٦</span></span>"],ans:2,exp:"إجمالي عدد الكرات = ٢+٣+١ = ٦. عدد الكرات غير الحمراء = ٣+١ = ٤. احتمال سحب كرة غير حمراء = <span class='frac'><span class='top'>٤</span><span class='bottom'>٦</span></span> = <span class='frac'><span class='top'>٢</span><span class='bottom'>٣</span></span>. الإجابة ج"},
